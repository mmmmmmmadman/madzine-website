<!DOCTYPE html>
<!-- version: v260806 — 每次部署到 madzine.work 前更新此版本號與 #wordmark -->
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#121212">
<meta name="description" content="Session Guide - band leader cue system for live improvisation.">
<title>Session Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400&family=Noto+Sans+TC:wght@300;400&family=Noto+Sans+JP:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#121212;
  --bg-elev:#1c1c1c;
  --panel:#232323;
  --line:#303030;
  --fg:#f2f2f2;
  --fg2:#a8a8a8;
  --fg3:#6e6e6e;
  --acc:#e8846c;
  --acc-dim:#6b4a41;
  --acc-glow:#ff9c80;
  --warn:#c8443a;
  --font:"Barlow Condensed","Noto Sans TC","Noto Sans JP","PingFang TC",-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
  --gap:8px;
  --pad:10px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--fg);
  font-family:var(--font);
  font-weight:300;
  line-height:1.2;
  font-size:17px;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;
  overscroll-behavior:none;
}
button,input{font-family:var(--font);font-weight:300;line-height:1.2;color:inherit}
button{background:none;border:none;cursor:pointer}

#app{
  /* dynamic viewport height: iOS Safari shrinks the visible area when the
     toolbars are shown, and position:fixed alone reports the LARGE viewport. */
  position:fixed;left:0;right:0;top:0;
  height:100vh;height:100svh;height:100dvh;
  display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 8px) calc(env(safe-area-inset-right,0px) + 12px) calc(env(safe-area-inset-bottom,0px) + 10px) calc(env(safe-area-inset-left,0px) + 12px);
}

/* ---------- top bar ---------- */
#topbar{
  display:flex;align-items:center;justify-content:space-between;
  gap:8px;height:26px;flex:0 0 auto;
}
#wordmark{font-size:14px;letter-spacing:.14em;color:var(--fg3);line-height:26px;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
#topright{display:flex;align-items:center;gap:10px}
#connstate{font-size:14px;color:var(--fg2);line-height:26px;white-space:nowrap}
.hue-btn{
  font-size:16px;letter-spacing:.12em;color:var(--fg2);
  border:1px solid var(--line);border-radius:5px;
  padding:0 11px;line-height:26px;min-height:26px;
}
.hue-btn.on{color:var(--acc);border-color:var(--acc-dim)}

/* ---------- screens ---------- */
.screen{flex:1 1 auto;min-height:0;display:none;flex-direction:column}
.screen.show{display:flex}

/* home */
#home{justify-content:center;gap:14px;padding-bottom:6vh}
#home .brand{text-align:center;margin-bottom:18px}
#home .brand .t{font-size:52px;letter-spacing:.06em;line-height:1.05}
#home .brand .s{font-size:15px;color:var(--fg3);letter-spacing:.2em;margin-top:6px;line-height:1.2}
.big-btn{
  display:block;width:100%;min-height:64px;
  background:var(--bg-elev);border:1px solid var(--line);border-radius:10px;
  font-size:22px;letter-spacing:.04em;color:var(--fg);
  padding:12px;line-height:1.2;
}
.big-btn .sub{display:block;font-size:14px;color:var(--fg3);margin-top:4px;line-height:1.2}
/* self-download: the app is one file, so the page hands out its own source */
#srcbox{text-align:center;margin-top:10px}
#srcdl{display:inline-flex;align-items:center;justify-content:center;min-height:44px;
  padding:0 14px;font-size:17px;letter-spacing:.08em;color:var(--fg2);
  border-bottom:1px solid var(--line);cursor:pointer}
#srcdl:active{color:var(--acc)}
#srcnote{font-size:17px;color:var(--fg2);line-height:1.35;margin-top:4px;padding:0 8px}
.big-btn.primary{border-color:var(--acc-dim);color:var(--acc)}
.big-btn:active{background:var(--panel)}

/* language switch (home corner) */
#langbar{
  position:absolute;
  left:calc(env(safe-area-inset-left,0px) + 12px);
  bottom:calc(env(safe-area-inset-bottom,0px) + 10px);
  display:flex;gap:6px;
}
.lang-btn{
  font-size:16px;letter-spacing:.1em;color:var(--fg3);
  background:var(--bg-elev);border:1px solid var(--line);border-radius:6px;
  min-height:44px;min-width:52px;padding:0 12px;line-height:1.2;
}
.lang-btn.on{color:var(--acc);border-color:var(--acc-dim)}
.lang-btn:active{background:var(--panel)}

/* join */
#join{justify-content:center;align-items:center;gap:14px;overflow-y:auto}
#join .lab{font-size:18px;color:var(--fg);letter-spacing:.14em;line-height:1.2;flex:0 0 auto}
#nameinput{
  width:100%;max-width:320px;text-align:center;
  font-size:22px;letter-spacing:.04em;
  background:var(--bg-elev);border:1px solid var(--line);border-radius:10px;
  padding:10px;color:var(--fg);line-height:1.2;min-height:48px;flex:0 0 auto;
}
#nameinput:focus{outline:none;border-color:var(--acc-dim)}
#joinrole{width:100%;max-width:320px;flex:0 0 auto}
#codeinput{
  width:100%;max-width:320px;text-align:center;
  font-size:64px;letter-spacing:.22em;
  background:var(--bg-elev);border:1px solid var(--line);border-radius:10px;
  padding:10px 0 10px 12px;color:var(--fg);line-height:1.2;
  text-transform:uppercase;flex:0 0 auto;
}
#codeinput:focus{outline:none;border-color:var(--acc-dim)}
#joinmsg{font-size:18px;color:var(--fg2);min-height:22px;line-height:1.2;flex:0 0 auto}
.row-btns{display:flex;gap:var(--gap);width:100%;flex:0 0 auto}

/* ---------- main ---------- */
/* the leader column scrolls when the viewport is short, so the tempo /
   meter / metronome cards scroll away instead of squeezing the cell grid.
   The sentence + START bar sits OUTSIDE that scroller and is always reachable. */
#main{gap:var(--gap);padding-top:6px}
#mainscroll{
  flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:var(--gap);
  overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
}
.card{
  background:var(--bg-elev);border:1px solid var(--line);border-radius:10px;
  padding:var(--pad);flex:0 0 auto;
}
.card + .card{margin-top:0}

/* room strip */
#roomstrip{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 12px}
#roomstrip .idbox{display:flex;align-items:baseline;gap:10px;min-width:0}
#roomcode{font-size:34px;letter-spacing:.2em;color:var(--acc);line-height:1.15;white-space:nowrap}
#roomlabel{font-size:14px;color:var(--fg3);letter-spacing:.16em;line-height:1.2}
#leavebtn{flex:0 0 auto;font-size:16px;color:var(--fg2);border:1px solid var(--line);border-radius:6px;padding:0 14px;min-height:44px;line-height:1.2}

/* tempo */
#tempo{display:flex;align-items:center;gap:10px}
#bpmbox{flex:0 0 auto;text-align:center;min-width:118px}
#bpmval{font-size:66px;line-height:.95;letter-spacing:.02em}
#bpmunit{font-size:14px;color:var(--fg3);letter-spacing:.22em;line-height:1.2;margin-top:2px}
#nudge{display:flex;flex-direction:column;gap:6px;flex:0 0 auto}
.nudge-btn{
  width:52px;min-height:44px;border:1px solid var(--line);border-radius:8px;
  background:var(--panel);font-size:22px;color:var(--fg);line-height:1.2;
}
.nudge-btn:active{background:var(--acc-dim)}
#tapbtn{
  flex:1 1 auto;min-height:88px;border:1px solid var(--acc-dim);border-radius:10px;
  background:var(--panel);color:var(--acc);
  font-size:30px;letter-spacing:.22em;line-height:1.2;
}
#tapbtn:active,#tapbtn.hit{background:var(--acc);color:#121212}
#tapinfo{font-size:18px;color:var(--fg2);line-height:1.2;margin-top:5px;text-align:center}

/* read-only tempo / meter (a conductor who is not the host) */
/* the read-only tempo card collapses into a single compact strip so it does
   not leave a large empty block where the TAP button used to be */
.card.ro{border-color:#2a2a2a}
.card.ro#tempocard{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px var(--pad)}
.card.ro #nudge,.card.ro #tapbtn{display:none}
.card.ro #tempo{flex:0 0 auto;gap:8px}
.card.ro #bpmbox{display:flex;align-items:baseline;gap:8px;min-width:0;text-align:left}
.card.ro #bpmval{font-size:40px;line-height:1}
.card.ro #bpmunit{margin-top:0}
.card.ro #tapinfo{flex:1 1 auto;margin-top:0;text-align:right}
.card.ro #meterrow{pointer-events:none}
.card.ro .meter-btn{opacity:.4}
.card.ro .meter-btn.on{opacity:1}

/* meter row */
#meterrow{display:flex;gap:6px}
.meter-btn{
  flex:1 1 0;min-height:44px;border:1px solid var(--line);border-radius:8px;
  background:var(--panel);font-size:19px;color:var(--fg2);line-height:1.2;
}
.meter-btn.on{border-color:var(--acc);color:var(--acc);background:var(--bg-elev)}

/* metronome */
#metrocard{display:flex;flex-direction:column;gap:8px}
#dots{display:flex;align-items:center;justify-content:center;gap:10px;min-height:30px}
.dot{
  width:20px;height:20px;border-radius:50%;
  background:var(--panel);border:1px solid var(--line);
  flex:0 0 auto;transition:background .04s linear;
}
.dot.first{width:26px;height:26px}
.dot.on{background:var(--fg)}
.dot.first.on{background:var(--acc);border-color:var(--acc)}
.dot.acc.on{background:var(--fg2)}
#transport{display:flex;gap:6px}
.tr-btn{
  flex:1 1 0;min-height:44px;border:1px solid var(--line);border-radius:8px;
  background:var(--panel);font-size:18px;color:var(--fg2);line-height:1.2;letter-spacing:.04em;
}
.tr-btn.on{border-color:var(--acc);color:var(--acc)}

/* grid: three zones, one per sentence slot type.
   1 how long (time)   2 at once / gradually (mode)   3+4 what (action) */
#gridwrap{flex:1 0 auto;display:flex;flex-direction:column;gap:var(--gap)}
.gsec{display:flex;flex-direction:column;gap:6px;flex:0 0 auto}
.ghead{font-size:17px;color:var(--fg2);letter-spacing:.02em;line-height:1.2;padding-left:2px}
.ggrid{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap);grid-auto-rows:minmax(56px,auto)}
.ggrid.c4{grid-template-columns:1fr 1fr 1fr 1fr;grid-auto-rows:minmax(48px,auto)}
.ggrid.c2{grid-auto-rows:minmax(48px,auto)}
/* number actions: dense row, still a 46px touch target on a 390px phone */
.ggrid.cnum{grid-template-columns:repeat(6,1fr);gap:6px;grid-auto-rows:minmax(46px,auto)}
.cell{
  border:1px solid var(--line);border-radius:10px;background:var(--bg-elev);
  font-size:21px;color:var(--fg);line-height:1.2;padding:8px 6px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  min-height:56px;position:relative;
}
.cell .n{font-size:14px;color:var(--fg3);letter-spacing:.16em;line-height:1.2}
/* time cells: small pills. mode cells: wider pills. actions: the loud block row */
.cell.time{background:var(--panel);border-color:#3d3d3d;font-size:18px;min-height:48px;border-radius:24px;padding:6px 4px}
.cell.mode{background:var(--panel);border-color:#3d3d3d;font-size:19px;min-height:48px;border-radius:10px;border-style:dashed}
.cell.act{background:var(--bg-elev)}
.cell.act.num{min-height:46px;font-size:22px;padding:6px 2px}
.cell.act.num .slot{top:2px;right:5px;font-size:13px}
.cell.sel{border-color:var(--acc);background:var(--acc-dim);color:var(--fg);border-style:solid}
/* slot number badge on a picked action: 3 = what, 4 = then what */
.cell .slot{
  position:absolute;top:4px;right:8px;font-size:14px;line-height:1.2;
  color:var(--acc-glow);letter-spacing:.08em;
}
.cell.addc{color:var(--fg2);border-style:dashed;font-size:18px}
/* CSS-drawn hairpin: widening = crescendo, narrowing = diminuendo */
.cell:active{background:var(--panel)}
.cell.editing{border-style:dashed;border-color:var(--acc)}

/* ---------- sentence + START bar (never scrolls away) ---------- */
#composebar{
  flex:0 0 auto;display:flex;flex-direction:column;gap:6px;
  background:var(--bg-elev);border:1px solid var(--line);border-radius:10px;
  padding:8px var(--pad);
}
#sentence{
  font-size:18px;color:var(--fg);line-height:1.3;min-height:24px;
  overflow:hidden;text-overflow:ellipsis;
}
#sentence.dim{color:var(--fg2)}
#sentence.warn{color:var(--acc-glow)}
#composebtns{display:flex;gap:var(--gap)}
#clearbtn{
  flex:0 0 34%;min-height:48px;border:1px solid var(--line);border-radius:10px;
  background:var(--panel);font-size:18px;color:var(--fg2);line-height:1.2;
}
#startbtn{
  flex:1 1 auto;min-height:48px;border-radius:10px;
  background:var(--acc);border:1px solid var(--acc);color:#121212;
  font-size:22px;letter-spacing:.14em;line-height:1.2;
}
#startbtn:active{background:var(--acc-glow);border-color:var(--acc-glow)}
/* disabled: no fill, dashed outline, struck-through weight — not just faded */
#startbtn.off{
  background:transparent;border:2px dashed var(--fg3);color:var(--fg3);
  cursor:default;letter-spacing:.08em;
}

/* short viewports (iPhone Safari with toolbars, ~664 px and below):
   compress the non-interactive display elements so the cell grid keeps
   at least two visible rows. Touch targets stay at 44 px. */
@media (max-height:700px){
  #roomcode{font-size:28px}
  #bpmval{font-size:52px}
  #bpmbox{min-width:100px}
  #tapbtn{min-height:70px;font-size:26px}
  #tapinfo{margin-top:3px}
  #dots{min-height:24px}
  .dot{width:16px;height:16px}
  .dot.first{width:22px;height:22px}
  #metrocard{gap:6px}
  #codeinput{font-size:48px}
  #join{gap:12px}
  #rampbar{height:32px;margin-top:14px}
  #ramprem{font-size:32px;margin-top:10px}
  #composebar{padding:6px 8px;gap:4px}
  #sentence{font-size:17px;min-height:22px}
  /* overlays: keep number and label the same size, just a lower starting cap so
     the dots / sub / cancel rows stay on screen; fitOverlayLabel() takes it from here */
  #countnum,#countlab{font-size:min(24vh,32vw)}
  #countsub{margin-top:10px}
  #countdots{margin-top:10px;min-height:24px}
  #ramptxt{font-size:min(18vh,24vw)}
  #rampdots{margin-top:10px;min-height:24px}
  #rampfrom{margin-top:8px}
  :root{--pad:8px}
}

/* follower panel */
#folinfo{display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;flex:1 1 auto;min-height:0}
#folstate{font-size:24px;color:var(--fg2);letter-spacing:.08em;line-height:1.3;text-align:center}
#folsub{font-size:17px;color:var(--fg2);line-height:1.3;text-align:center}

/* ---------- overlays ---------- */
.overlay{
  position:fixed;left:0;right:0;top:0;
  height:100vh;height:100svh;height:100dvh;
  z-index:40;display:none;
  flex-direction:column;align-items:center;justify-content:center;
  padding:24px;text-align:center;background:var(--bg);
}
.overlay.show{display:flex}
/* the cue label is as loud as the bar number: same font-size cap for both, stacked
   number over label. fitOverlayLabel() scales the label down when a long cue would
   not fit the space the other rows leave. */
#countnum{font-size:min(26vh,38vw);line-height:.86;letter-spacing:-.02em;font-weight:400}
#countlab{font-size:min(26vh,38vw);line-height:1.02;letter-spacing:.02em;font-weight:400;
  color:var(--fg2);margin-top:6px;max-width:92vw;word-break:break-word}
#countsub{font-size:17px;color:var(--fg2);letter-spacing:.2em;margin-top:16px;line-height:1.2}
/* slot 4 preview: what happens the instant the countdown / ramp lands */
.nextline{display:none;font-size:20px;letter-spacing:.08em;color:var(--fg3);margin-top:8px;line-height:1.25}
.nextline.on{display:block}
#countdots{display:flex;align-items:center;justify-content:center;gap:10px;min-height:30px;margin-top:14px;flex-wrap:wrap}
#ovcount.last{background:#3a1512}
#ovcount.last .dot{background:#2a0f0d;border-color:#7a3a31}
#ovcount.last .dot.on{background:var(--fg);border-color:var(--fg)}
#ovcount.last .dot.first.on{background:var(--acc-glow);border-color:var(--acc-glow)}
#ovcount.last #countnum{color:#ff6a55}
#ovcount.last.blink #countnum{opacity:.15}
#ovcount .cancel{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);font-size:17px;color:var(--fg3);border:1px solid var(--line);border-radius:8px;padding:10px 20px;min-height:44px;line-height:1.2}
#ovflash{background:var(--acc);color:#121212;transition:opacity .35s linear}
#ovflash.fade{opacity:0}
/* cue flash: pulses for the whole time the overlay is shown, until endFlash()
   fades it out; ~2.3 Hz, kept under the 3 Hz photosensitivity ceiling */
#ovflash.intro{animation:introflash .44s steps(1,end) infinite}
@keyframes introflash{
  0%,49%{background:#121212}
  50%,100%{background:var(--acc)}
}
/* opening attention pulses for countdown/ramp: finite, ends on the static bg
   so the numbers stay readable; 6 cycles over 3 s = 2 Hz */
#ovcount.intro,#ovramp.intro{animation:introov 3s steps(1,end)}
@keyframes introov{
  0%,8%{background:var(--acc)}
  9%,16%{background:var(--bg)}
  17%,24%{background:var(--acc)}
  25%,33%{background:var(--bg)}
  34%,41%{background:var(--acc)}
  42%,49%{background:var(--bg)}
  50%,58%{background:var(--acc)}
  59%,66%{background:var(--bg)}
  67%,74%{background:var(--acc)}
  75%,83%{background:var(--bg)}
  84%,91%{background:var(--acc)}
  92%,100%{background:var(--bg)}
}
/* cue text is meant to fill the screen; this is only the starting cap — fitFlashText()
   scales it down per label so long cues still land inside the viewport */
#flashtxt{font-size:min(75vh,85vw);line-height:1.02;letter-spacing:.02em;font-weight:400;word-break:break-word}
/* source nickname stays visually subordinate to the cue text */
#flashfrom{font-size:17px;letter-spacing:.14em;color:rgba(18,18,18,.55);margin-top:14px;line-height:1.2;max-width:90%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- ramp overlay ---------- */
/* same rule as #countlab: display-sized cue text, shrunk by fitOverlayLabel()
   when the bar / remaining / dots rows do not leave enough room */
#ramptxt{font-size:min(22vh,30vw);line-height:1.02;letter-spacing:.02em;font-weight:400;
  max-width:92vw;word-break:break-word}
#rampdir{font-size:22px;letter-spacing:.18em;color:var(--fg2);margin-top:8px;line-height:1.2}
#rampbar{
  position:relative;width:min(78vw,320px);height:38px;margin-top:20px;
  background:#2e2e2e;overflow:hidden;
}
#rampbar.up{clip-path:polygon(0 46%,100% 0,100% 100%,0 54%)}
#rampbar.down{clip-path:polygon(0 0,100% 46%,100% 54%,0 100%)}
#rampfill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--acc)}
#ramprem{font-size:38px;letter-spacing:.06em;margin-top:14px;line-height:1.15}
#rampsub{font-size:17px;color:var(--fg2);letter-spacing:.2em;margin-top:6px;line-height:1.2}
#rampdots{display:flex;align-items:center;justify-content:center;gap:10px;min-height:30px;margin-top:14px;flex-wrap:wrap}
#rampfrom{font-size:15px;color:var(--fg3);letter-spacing:.14em;margin-top:12px;line-height:1.2}
#ovramp .cancel{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);font-size:17px;color:var(--fg3);border:1px solid var(--line);border-radius:8px;padding:10px 20px;min-height:44px;line-height:1.2}

/* ---------- modal / hue ---------- */
#scrim{position:fixed;inset:0;z-index:50;display:none;background:rgba(0,0,0,.6)}
#scrim.show{display:block}
#huepop{
  position:fixed;z-index:60;display:none;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;
  flex-direction:column;align-items:center;gap:8px;
}
#huepop.show{display:flex}
#huecanvas{touch-action:none;display:block}
#hueinfo{font-size:17px;color:var(--fg2);letter-spacing:.04em;line-height:1.3;max-width:220px;text-align:center}

#editor{
  position:fixed;z-index:60;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
  display:none;flex-direction:column;gap:10px;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;
}
#editor.show{display:flex}
#editor .h{font-size:15px;color:var(--fg3);letter-spacing:.16em;line-height:1.2}
#edlabel{
  width:100%;min-height:48px;font-size:22px;color:var(--fg);

function normLang(v){
  if(!v) return null;
  v = String(v).toLowerCase();
  if(v.indexOf("zh")===0) return "zh-TW";
  if(v.indexOf("ja")===0 || v.indexOf("jp")===0) return "ja";
  if(v.indexOf("en")===0) return "en";
  return null;
}
function initLang(){
  var q = null;
  try{
    var m = /[?&]lang=([^&]+)/.exec(window.location.search);
    if(m) q = normLang(decodeURIComponent(m[1]));
  }catch(err){}
  if(q){ try{ localStorage.setItem("sg_lang", q); }catch(e2){} return q; }
  var stored = null;
  try{ stored = normLang(localStorage.getItem("sg_lang")); }catch(e3){}
  if(stored) return stored;
  return normLang(navigator.language || (navigator.languages||[])[0]) || "en";
}
var lang = initLang();

/* t(key, value) — {n} and {label} are both replaced by value */
function t(k, v){
  var dict = I18N[lang] || I18N.en;
  var s = dict[k];
  if(s === undefined) s = I18N.en[k];
  if(s === undefined) return k;
  return (v === undefined) ? s : s.replace(/\{n\}|\{label\}/g, v);
}
/* tf(key, {n:.., a:.., b:..}) — sentence templates carry the word order of each
   language, so a clause is never assembled by concatenating fragments. */
function tf(k, map){
  var dict = I18N[lang] || I18N.en;
  var s = dict[k];
  if(s === undefined) s = I18N.en[k];
  if(s === undefined) return k;
  return s.replace(/\{(n|a|b)\}/g, function(_, g){
    return (map && map[g] !== undefined && map[g] !== null) ? String(map[g]) : "";
  });
}

   dim     S x 0.500 B 0.60
   glow    S x 1.333 B 1.00
   Backgrounds are pure grey (chroma 0), never tinted.
   ========================================================= */
var BASE_S = 0.54;               // coral pink reference saturation
var DEFAULT_HUE = 12/360;        // MADZINE brand H=12
var DEFAULT_SAT = 1.0;           // multiplier

var hue = readNum("sg_hue", DEFAULT_HUE);
var satMul = readNum("sg_sat", DEFAULT_SAT);

function readNum(k, d){
  var v = parseFloat(localStorage.getItem(k));
  return isFinite(v) ? v : d;
}
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }

function hsb(h,s,b){
  h = ((h % 1) + 1) % 1;
  s = clamp(s,0,1); b = clamp(b,0,1);
  var i = Math.floor(h*6), f = h*6 - i;
  var p = b*(1-s), q = b*(1-s*f), t = b*(1-s*(1-f));
  var r,g,bl;
  switch(i%6){
    case 0: r=b; g=t; bl=p; break;
    case 1: r=q; g=b; bl=p; break;
    case 2: r=p; g=b; bl=t; break;
    case 3: r=p; g=q; bl=b; break;
    case 4: r=t; g=p; bl=b; break;
    default: r=b; g=p; bl=q; break;
  }
  return "rgb("+Math.round(r*255)+","+Math.round(g*255)+","+Math.round(bl*255)+")";
}
function applyTheme(){
  var s = BASE_S * satMul;
  var root = document.documentElement.style;
  root.setProperty("--acc",      hsb(hue, s*1.000, 0.92));
  root.setProperty("--acc-dim",  hsb(hue, s*0.500, 0.60));
  root.setProperty("--acc-glow", hsb(hue, s*1.333, 1.00));
  var m = document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute("content","#121212");
  drawWheel();
}

/* ---------- HUE wheel canvas ---------- */
var hueCanvas = document.getElementById("huecanvas");
var hctx = hueCanvas.getContext("2d");
var HC = 220, HR_OUT = 104, HR_IN = 64;   // css px
function drawWheel(){
  var d = 2; // retina scale (canvas is 440 for 220 css px)
  hctx.setTransform(d,0,0,d,0,0);
  hctx.clearRect(0,0,HC,HC);
  var cx = HC/2, cy = HC/2;
  var segs = 360, step = Math.PI*2/segs;
  var s = clamp(BASE_S*satMul,0,1);
  for(var i=0;i<segs;i++){
    var a0 = i*step - Math.PI/2;
    var a1 = a0 + step + 0.012;
    hctx.beginPath();
    hctx.arc(cx,cy,HR_OUT,a0,a1,false);
    hctx.arc(cx,cy,HR_IN,a1,a0,true);
    hctx.closePath();
    hctx.fillStyle = hsb(i/segs, 0.30, 0.92);
    hctx.fill();
  }
  // center circle = current accent
  hctx.beginPath();
  hctx.arc(cx,cy,HR_IN-6,0,Math.PI*2);
  hctx.fillStyle = hsb(hue, s, 0.92);
  hctx.fill();
  // chevrons (drawn lines, no unicode glyphs)
  hctx.strokeStyle = "rgba(0,0,0,0.70)";
  hctx.lineWidth = 2; hctx.lineCap = "round"; hctx.lineJoin = "round";
  var w = 13, yTop = cy-26, yBot = cy+26;
  hctx.beginPath();
  hctx.moveTo(cx-w, yTop+7); hctx.lineTo(cx, yTop); hctx.lineTo(cx+w, yTop+7);
  hctx.moveTo(cx-w, yBot-7); hctx.lineTo(cx, yBot); hctx.lineTo(cx+w, yBot-7);
  hctx.stroke();
  hctx.fillStyle = "rgba(0,0,0,0.70)";
  hctx.font = '300 15px "Barlow Condensed", sans-serif';
  hctx.textAlign = "center"; hctx.textBaseline = "middle";
  hctx.fillText("SATURATION", cx, cy);
  // hue marker: white solid dot + dark shadow
  var ang = hue*Math.PI*2 - Math.PI/2;
  var mr = (HR_OUT+HR_IN)/2;
  var mx = cx + Math.cos(ang)*mr, my = cy + Math.sin(ang)*mr;
  hctx.beginPath(); hctx.arc(mx+1,my+1,9,0,Math.PI*2);
  hctx.fillStyle = "rgba(0,0,0,0.45)"; hctx.fill();
  hctx.beginPath(); hctx.arc(mx,my,8,0,Math.PI*2);
  hctx.fillStyle = "#ffffff"; hctx.fill();
}

var hueZone = 0; // 0 none, 1 ring, 2 center
var lastY = 0;
function huePos(e){
  var r = hueCanvas.getBoundingClientRect();
  var p = (e.touches && e.touches[0]) ? e.touches[0] : e;
  return { x:p.clientX - r.left - HC/2, y:p.clientY - r.top - HC/2, cy:p.clientY };
}
function hueDown(e){
  e.preventDefault();
  var p = huePos(e), d = Math.sqrt(p.x*p.x+p.y*p.y);
  hueZone = d > HR_IN-6 ? 1 : 2;
  lastY = p.cy;
  if(hueZone===1) hueMove(e); else e.stopPropagation();
}
function hueMove(e){
  if(!hueZone) return;
  e.preventDefault();
  var p = huePos(e);
  if(hueZone===1){
    var a = Math.atan2(p.y,p.x) + Math.PI/2;
    hue = ((a/(Math.PI*2))%1+1)%1;
  }else{
    satMul = clamp(satMul - (p.cy-lastY)*0.01, 0, 2);
    lastY = p.cy;
  }
  applyTheme();
}
function hueUp(){
  if(!hueZone) return;
  if(hueZone===1) localStorage.setItem("sg_hue", String(hue));
  else localStorage.setItem("sg_sat", String(satMul));
  hueZone = 0;
}
hueCanvas.addEventListener("pointerdown", function(e){ hueCanvas.setPointerCapture(e.pointerId); hueDown(e); });
hueCanvas.addEventListener("pointermove", hueMove);
hueCanvas.addEventListener("pointerup", hueUp);
hueCanvas.addEventListener("pointercancel", hueUp);

var huebtn = document.getElementById("huebtn");
var huepop = document.getElementById("huepop");
var scrim  = document.getElementById("scrim");
function openHue(){
  huepop.classList.add("show");
  huebtn.classList.add("on");
  scrim.classList.add("show");
  var r = huebtn.getBoundingClientRect();
  var w = 244;
  var left = clamp(r.right - w, 8, window.innerWidth - w - 8);
  huepop.style.left = left+"px";
  huepop.style.top  = (r.bottom + 8)+"px";
  drawWheel();
}
function closeHue(){
  huepop.classList.remove("show");
  huebtn.classList.remove("on");
  scrim.classList.remove("show");
}
huebtn.addEventListener("click", function(e){
  e.stopPropagation();
  if(huepop.classList.contains("show")) closeHue(); else openHue();
});
// tap anywhere outside closes (mandatory behaviour)
scrim.addEventListener("pointerdown", function(){ closeHue(); closeEditor(); });
huepop.addEventListener("pointerdown", function(e){ e.stopPropagation(); });

/* =========================================================
   STATE
   ========================================================= */
var METERS = [
  {name:"4/4", n:4, d:4, acc:[0]},
  {name:"3/4", n:3, d:4, acc:[0]},
  {name:"6/8", n:6, d:8, acc:[0,3]},
  {name:"7/8", n:7, d:8, acc:[0,4]},
  {name:"5/4", n:5, d:4, acc:[0,3]}
];
/* ---------------------------------------------------------
   Cell model (v3): a command is a four slot sentence.
     1 time   {kind:"time", n}                      optional -> now
     2 mode   {kind:"mode", mode:"now"|"gradual"}   optional -> at once
     3 action {kind:"act", fx, dir, pct}            REQUIRED
     4 action (a second tap on the action grid)     optional

   Slot 1 is read through slot 2:
     time + at once   = delay      -> fires in one go after N bars
     time + gradually = duration   -> spreads the change across N bars
   Slot 4 runs the instant the first segment ends and carries no time of its own.
   --------------------------------------------------------- */
var CELLS_VER = 5;
var DEFAULT_TIME_DEFS = [2, 4, 8, 16];
var DEFAULT_MODE_DEFS = [
  {id:"mn", mode:"now"},
  {id:"mg", mode:"gradual"}
];
var DEFAULT_ACT_DEFS = [
  {id:"a1", key:"act_louder",  fx:"dyn",   dir:"up"},
  {id:"a2", key:"act_quieter", fx:"dyn",   dir:"down"},
  {id:"a3", key:"act_faster",  fx:"tempo", dir:"up",   pct:10},
  {id:"a4", key:"act_slower",  fx:"tempo", dir:"down", pct:10},
  {id:"a5", key:"act_solo",    fx:"none"},
  {id:"a6", key:"act_head",    fx:"none"},
  {id:"a7", key:"act_ending",  fx:"none"},
  {id:"a8", key:"act_stop",    fx:"none"},
  {id:"a9", key:"act_free",    fx:"none"}
];
/* Plain number actions 0..10. A digit reads the same in every language, so the
   label is stored on the cell instead of going through an i18n key: a language
   switch rebuilds it to exactly the same face. `num:true` only routes it to the
   dense grid row — in every other respect it is an ordinary action cell. */
var DEFAULT_NUM_DEFS = (function(){
  var out = [];
  for(var i=0;i<=10;i++) out.push({id:"n"+i, label:String(i)});
  return out;
})();
function numCellsFromDefs(){
  return DEFAULT_NUM_DEFS.map(function(d){
    return {id:d.id, kind:"act", num:true, label:d.label, fx:"none", dir:"up", pct:10};
  });
}
/* the dense row holds every action cell that was built as a number cell */
function isNumCell(c){
  if(!c || c.kind === "time" || c.kind === "mode") return false;
  return c.num === true;
}
/* Time and mode cells have no stored text unless the user typed one, so their
   face always reads correctly after a language switch. */
function cellText(c){
  if(c.kind === "time") return c.label || t("bars_unit", clamp(parseInt(c.n,10)||4,1,64));
  if(c.kind === "mode") return t(c.mode === "gradual" ? "slot_grad" : "slot_now");
  return c.label || t("new_act_label");
}
/* Built in the current language. Once the user edits a cell the set is written
   to localStorage and is never regenerated on a language switch. */
function defaultCells(){
  var out = DEFAULT_TIME_DEFS.map(function(n){
    return {id:"t"+n, kind:"time", n:n};
  });
  DEFAULT_MODE_DEFS.forEach(function(c){
    out.push({id:c.id, kind:"mode", mode:c.mode});
  });
  DEFAULT_ACT_DEFS.forEach(function(c){
    out.push({id:c.id, kind:"act", label:t(c.key), fx:c.fx,
              dir:c.dir || "up", pct:c.pct || 10});
  });
  numCellsFromDefs().forEach(function(c){ out.push(c); });
  return out;
}
function cellsAreCustom(){
  try{ return !!localStorage.getItem("sg_cells"); }catch(err){ return false; }
}
function cellById(id){ return S.cells.filter(function(c){ return c.id === id; })[0] || null; }
/* the two mode cells are structural: a set that lost them gets them back */
function ensureModeCells(arr){
  var have = {};
  arr.forEach(function(c){ if(c.kind === "mode") have[c.mode] = 1; });
  var add = [];
  DEFAULT_MODE_DEFS.forEach(function(d){
    if(!have[d.mode]) add.push({id:d.id, kind:"mode", mode:d.mode});
  });
  return add.length ? arr.concat(add) : arr;
}

/* set by loadCells() when an older payload was upgraded. It has to be declared
   AND initialised before S, because S.cells calls loadCells() while S is being
   built and a later "= false" would wipe the flag before it is read. */
var needMigrateSave = false;

var S = {
  /* role  = network endpoint: none | leader (host) | follower | local
     canCue = permission to send cues. The host is always a conductor;
     a follower may be a conductor as well, but is never the state authority. */
  role:"none",
  canCue:false,
  name:"",
  code:"",
  bpm:  clamp(readNum("sg_bpm",120), 30, 300),
  meter: clamp(readNum("sg_meter",0), 0, METERS.length-1)|0,
  sound: localStorage.getItem("sg_sound") === "1",
  metroRunning:false,
  metroStart:0,
  metroBeat0:0,           // absolute beat position of the metronome downbeat
  cells: loadCells(),
  /* the sentence under construction; nothing leaves the device until START */
  cmp:{timeId:null, modeId:null, actId:null, act2Id:null},
  warnKey:null, warnUntil:0,
  count:null,             // {startAt, startBeat, bars, label, from, fx}
  ramp:null,              // {startAt, startBeat, bars, label, dir, from, fx}
  flashUntil:0,
  flashText:"",
  flashFrom:"",
  editMode:false,
  editId:null,
  connKey:null, connArg:null,   // live-translated status strings
  joinKey:null,
  tapKey:null,  tapArg:null
};

function loadCells(){
  var a = null;
  /* only the storage read and the parse are guarded: a throw inside the
     migration itself must not be swallowed into a silent reset to defaults */
  try{
    var raw = localStorage.getItem("sg_cells");
    if(raw) a = JSON.parse(raw);
  }catch(err){ a = null; }
  var arr = Array.isArray(a) ? a : (a && Array.isArray(a.cells) ? a.cells : null);
  if(!arr || !arr.length) return defaultCells();
  var ver = (a && !Array.isArray(a) && a.v) ? a.v : 1;
  if(ver >= CELLS_VER) return ensureModeCells(arr);
  needMigrateSave = true;                    // written back once, right after init
  if(ver < 3) arr = ver >= 2 ? migrateV2(arr) : migrateV1(arr);
  if(ver < 4) arr = migrateV3(arr);
  return ensureModeCells(migrateV4(arr));
}
/* ---------------------------------------------------------
   v4 -> v5
   The built-in number actions 0..10 were added. A set saved before v5 has none
   of them, so the missing ones are appended. A number cell the user already
   deleted in this session cannot be told apart from one that never existed, so
   this runs once per upgrade only — the result is written back at v5 and the
   check never fires again.
   --------------------------------------------------------- */
function migrateV4(arr){
  var have = {};
  arr.forEach(function(c){ if(c && c.id) have[c.id] = 1; });
  var add = numCellsFromDefs().filter(function(c){ return !have[c.id]; });
  return add.length ? arr.concat(add) : arr;
}
/* ---------------------------------------------------------
   v3 -> v4
   "immediately / gradually" became its own slot, so the four built-in dynamics
   and tempo actions are states, not changes: 變吵 -> 吵, Louder -> Loud, ...
   Only a label that still reads exactly as one of the labels v3 generated is
   rewritten; anything the user typed is left alone. Japanese labels (強く /
   静かに / 速く / 遅く) were already stateful and are not in the table.
   --------------------------------------------------------- */
function migrateV3(arr){
  var REN = {
    "變吵":"吵", "變安靜":"安靜", "變快":"快", "變慢":"慢",
    "Louder":"Loud", "Quieter":"Quiet", "Faster":"Fast", "Slower":"Slow"
  };
  arr.forEach(function(c){
    if(c && c.kind === "act" && REN[c.label]) c.label = REN[c.label];
  });
  return arr;
}
/* Label templates that v2 generated for its modifier cells, in every language.
   A stored label matching one of them was never typed by the user and is
   dropped; anything else is carried over as a custom time cell label.
   The list lives inside the function on purpose: loadCells() runs while S is
   still being built, so any `var` declared further down would be undefined. */
function isLegacyAutoLabel(label, n){
  var TPL = [
    "逐漸 {n} 小節", "Over {n} Bars", "{n} 小節かけて",
    "{n} 小節後",    "After {n} Bars",
    "立刻", "Now", "すぐに"
  ];
  if(!label) return true;
  for(var i=0;i<TPL.length;i++){
    if(TPL[i].replace("{n}", n) === label) return true;
  }
  return false;
}
function newAct(id, label, fx, dir, pct){
  return {id:id, kind:"act", label:label, fx:fx || "none",
          dir:dir === "down" ? "down" : "up", pct:clamp(parseInt(pct,10)||10,0,90)};
}
/* ---------------------------------------------------------
   v2 -> v3
     modifier "now"                  -> covered by the fixed 2 mode cells
     modifier "gradual N" / "after N" -> one time cell of N bars (deduped)
     action                           -> carried over unchanged
   A modifier label the user typed is kept on the time cell.
   --------------------------------------------------------- */
function migrateV2(old){
  var times = [], acts = [], seen = {};
  old.forEach(function(c){
    if(!c) return;
    if(c.kind === "mod"){
      if(c.mode === "now") return;
      var n = clamp(parseInt(c.n,10) || 4, 1, 64);
      if(seen[n]) return;
      seen[n] = 1;
      var cell = {id:"t"+n, kind:"time", n:n};
      if(!isLegacyAutoLabel(c.label, n)) cell.label = String(c.label).slice(0,12);
      times.push(cell);
    }else{
      acts.push(newAct(c.id || ("a"+Math.random().toString(36).slice(2,8)),
                       c.label || t("new_act_label"), c.fx, c.dir, c.pct));
    }
  });
  if(!times.length) times = DEFAULT_TIME_DEFS.map(function(n){ return {id:"t"+n, kind:"time", n:n}; });
  times.sort(function(a,b){ return a.n - b.n; });
  return times.concat(acts);
}
/* ---------------------------------------------------------
   v1 -> v3
     cue  -> action
     bars -> action, plus a time cell of N bars
     ramp -> action (dynamics, keeps its direction), plus a time cell of N bars
   Custom labels are preserved verbatim; nothing is dropped.
   --------------------------------------------------------- */
function migrateV1(old){
  var acts = [], ns = {};
  old.forEach(function(c){
    if(!c) return;
    var lab = c.label || t("new_act_label");
    var id  = c.id || ("a" + Math.random().toString(36).slice(2,8));
    if(c.type === "bars"){
      ns[clamp(parseInt(c.n,10) || 4, 1, 64)] = 1;
      acts.push(newAct(id, lab, "none", "up", 10));
    }else if(c.type === "ramp"){
      ns[clamp(parseInt(c.n,10) || 4, 1, 64)] = 1;
      acts.push(newAct(id, lab, "dyn", c.dir, 10));
    }else{
      acts.push(newAct(id, lab, "none", "up", 10));
    }
  });
  var keys = Object.keys(ns);
  if(!keys.length) keys = DEFAULT_TIME_DEFS.map(String);
  var times = keys.sort(function(a,b){ return a-b; }).map(function(n){
    return {id:"t"+n, kind:"time", n:+n};
  });
  return times.concat(acts);
}
function saveCells(){
  localStorage.setItem("sg_cells", JSON.stringify({v:CELLS_VER, cells:S.cells}));
}
function meter(){ return METERS[S.meter]; }
function beatDur(){ return (60000/curBpm()) * (4/meter().d); }
function barDur(){ return beatDur() * meter().n; }
/* host  = the single state authority (room creator, or a standalone device)
   canCue = may issue cues; every host is a conductor, a follower may be one too */
function isHost(){ return S.role==="leader" || S.role==="local"; }
function canCue(){ return isHost() || S.canCue===true; }
function myName(){ return S.name || t(isHost() ? "host_name" : "player_n", 1); }

/* =========================================================
   TIMEBASE  (beat position as the integral of the beat rate)
   ---------------------------------------------------------
   The metronome, the click lookahead, the bar countdown and the gradual
   overlays all read beat positions from here, so a tempo ramp bends every
   one of them with the same curve. Nothing anywhere may assume a fixed
   beat duration.

   k = meter denominator / 4   (the pulse the meter counts in)
   beat rate:            r(B) = k*B/60000            beats per millisecond
   ramp, BPM linear in TIME (not in beats):
                         B(tau) = B0 + (B1-B0)*tau/T,   0 <= tau <= T
   cumulative beats is therefore quadratic in time:
       phi(tau) = integral_0^tau r(B(x)) dx
                = k/60000 * ( B0*tau + (B1-B0)*tau^2/(2T) )
   after the ramp:
       phi(tau) = phi(T) + r(B1)*(tau-T),  phi(T) = k*T*(B0+B1)/120000

   Analytic inverse (time of a given beat) — solve phi(tau) = beta:
       a*tau^2 + b*tau - beta = 0,
       a = k*(B1-B0)/(120000*T),   b = k*B0/60000
       tau = (-b + sqrt(b^2 + 4*a*beta)) / (2a)
   which is evaluated in the algebraically equal but numerically stable form
       tau = 2*beta / (b + sqrt(b^2 + 4*a*beta))
   (no cancellation as a -> 0, and it degrades cleanly to tau = beta/b).

   Ramp length for exactly N bars: phi(T) = N*n gives
       T = 120000*N*n / (k*(B0+B1))                (average-tempo identity)
   ========================================================= */
var TB = {t0:Date.now(), beat0:0, bpm0:S.bpm, bpm1:S.bpm, T:0};
function kFac(){ return meter().d/4; }
function rateOf(b){ return kFac()*b/60000; }
function phiFull(){ return kFac()*TB.T*(TB.bpm0+TB.bpm1)/120000; }
function phiAt(tau){
  if(TB.T > 0){
    if(tau <= 0) return rateOf(TB.bpm0)*tau;
    if(tau < TB.T) return kFac()/60000*(TB.bpm0*tau + (TB.bpm1-TB.bpm0)*tau*tau/(2*TB.T));
    return phiFull() + rateOf(TB.bpm1)*(tau - TB.T);
  }
  return rateOf(TB.bpm0)*tau;
}
function tauOfPhi(beta){
  if(TB.T > 0){
    if(beta <= 0) return beta/rateOf(TB.bpm0);
    var full = phiFull();
    if(beta < full){
      var a = kFac()*(TB.bpm1-TB.bpm0)/(120000*TB.T);
      var b = kFac()*TB.bpm0/60000;
      if(Math.abs(a) < 1e-15) return beta/b;
      var disc = b*b + 4*a*beta;
      if(disc < 0) disc = 0;
      return 2*beta/(b + Math.sqrt(disc));
    }
    return TB.T + (beta - full)/rateOf(TB.bpm1);
  }
  return beta/rateOf(TB.bpm0);
}
function beatAt(t){ return TB.beat0 + phiAt(t - TB.t0); }
function timeOfBeat(beat){ return TB.t0 + tauOfPhi(beat - TB.beat0); }
function bpmAt(t){
  if(TB.T > 0){
    var tau = t - TB.t0;
    if(tau <= 0) return TB.bpm0;
    if(tau < TB.T) return TB.bpm0 + (TB.bpm1-TB.bpm0)*tau/TB.T;
  }
  return TB.bpm1;
}
function curBpm(){ return bpmAt(now()); }
function rampActive(){ return TB.T > 0; }
/* Re-anchor at t without moving the beat position: any stored absolute beat
   (countdown / gradual anchors) stays valid, and a meter change only affects
   the integration from t onwards. */
function rebaseTB(t){
  var b = beatAt(t), bp = bpmAt(t);
  var rem = (TB.T > 0) ? Math.max(0, TB.T - (t - TB.t0)) : 0;
  TB = {t0:t, beat0:b, bpm0:bp, bpm1:(rem > 0 ? TB.bpm1 : bp), T:rem};
}
function setConstBpm(t, bpm){
  var b = beatAt(t);
  TB = {t0:t, beat0:b, bpm0:bpm, bpm1:bpm, T:0};
}
/* start a tempo ramp that lasts exactly `bars` bars of the current meter */
function startTempoRamp(startAt, bars, target){
  var b0 = beatAt(startAt), from = bpmAt(startAt);
  var n = meter().n;
  var T = 120000*bars*n/(kFac()*(from + target));
  TB = {t0:startAt, beat0:b0, bpm0:from, bpm1:target, T:T};
  return {from:from, to:target, startBeat:b0};
}

   NETWORK (PeerJS)
   ========================================================= */
var peer=null, conns=[], hostConn=null, clockOffset=0, retryTimer=null, retryDelay=1200, peerSeq=0;
var PREFIX = "madzine-sessionguide-";
var CODE_CHARS = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

function now(){ return Date.now() + clockOffset; }
function makeCode(){
  var s=""; for(var i=0;i<4;i++) s += CODE_CHARS[Math.floor(Math.random()*CODE_CHARS.length)];
  return s;
}
/* host -> everyone. Only the host ever broadcasts authoritative state. */
function send(obj){
  if(!isHost()) return;
  var msg = JSON.stringify(obj);
  for(var i=0;i<conns.length;i++){
    var c = conns[i];
    if(c && c.open){ try{ c.send(msg); }catch(err){} }
  }
}
/* non-host conductor -> host. These are requests, never applied locally:
   the sender waits for the host broadcast like everybody else. */
function req(obj){
  if(hostConn && hostConn.open){ try{ hostConn.send(JSON.stringify(obj)); }catch(err){} }
}
function stateMsg(){
  return {t:"sync", bpm:S.bpm, meter:S.meter,
          metroRunning:S.metroRunning, metroStart:S.metroStart,
          metroBeat0:S.metroBeat0, tb:TB,
          count:S.count, ramp:S.ramp};
}
function setConnState(key, arg){
  S.connKey = key || null;
  S.connArg = (arg === undefined) ? null : arg;
  renderConnState();
}
function renderConnState(){
  document.getElementById("connstate").textContent =
    S.connKey ? t(S.connKey, S.connArg === null ? undefined : S.connArg) : "";
}
function setJoinMsg(key){
  S.joinKey = key || null;
  renderJoinMsg();
}
function renderJoinMsg(){
  document.getElementById("joinmsg").textContent = S.joinKey ? t(S.joinKey) : "";
}

function peerReady(){
  if(typeof Peer !== "undefined") return true;
  setConnState("conn_notloaded");
  setJoinMsg("join_nopeer");
  return false;
}
function hostRoom(attempt){
  if(!peerReady()){ S.role="local"; S.canCue=true; showMain(); setConnState("conn_local"); return; }
  S.code = makeCode();
  S.role = "leader";
  S.canCue = true;
  S.name = storedName() || t("host_name");
  showMain();
  setConnState("conn_creating");
  peer = new Peer(PREFIX + S.code, {debug:0});
  peer.on("open", function(){
    document.getElementById("roomcode").textContent = S.code;
    updateConn();
  });
  peer.on("connection", function(c){
    conns.push(c);
    c.on("open", function(){ updateConn(); try{ c.send(JSON.stringify(stateMsg())); }catch(err){} });
    c.on("data", function(raw){
      var m = parse(raw); if(!m) return;
      if(m.t==="ping" && c.open){ try{ c.send(JSON.stringify({t:"pong", c:m.c, s:Date.now()})); }catch(err){} return; }
      if(m.t==="hello"){
        peerSeq++;
        c._name = (m.name||"").slice(0,12).trim() || t("player_n", peerSeq);
        c._canCue = m.canCue===true;
        if(c.open){ try{ c.send(JSON.stringify({t:"welcome", name:c._name})); }catch(err){} }
        return;
      }
      if(m.t==="role"){ c._canCue = m.canCue===true; return; }
      if(m.t==="req"){
        if(!c._canCue) return;                    // only conductors may request
        onCueRequest(m, c._name || "");
        return;
      }
    });
    c.on("close", function(){ conns = conns.filter(function(x){return x!==c;}); updateConn(); });
    c.on("error", function(){ conns = conns.filter(function(x){return x!==c;}); updateConn(); });
  });
  peer.on("disconnected", function(){ setConnState("conn_reconnect"); try{ peer.reconnect(); }catch(err){} });
  peer.on("error", function(err){
    if(err && err.type==="unavailable-id" && (attempt||0) < 5){
      try{ peer.destroy(); }catch(e2){}
      hostRoom((attempt||0)+1); return;
    }
    setConnState("conn_error");
  });
}
function updateConn(){
  if(S.role==="leader") setConnState("conn_peers", conns.filter(function(c){return c.open;}).length);
}

function storedName(){
  try{ return (localStorage.getItem("sg_name")||"").slice(0,12); }catch(err){ return ""; }
}
function joinRoom(code){
  if(!peerReady()) return;
  S.code = code; S.role = "follower";
  setJoinMsg("join_connecting");
  peer = new Peer({debug:0});
  peer.on("open", function(){ connectHost(); });
  peer.on("disconnected", function(){ setConnState("conn_reconnect"); try{ peer.reconnect(); }catch(err){} });
  peer.on("error", function(){
    if(S.role!=="follower") return;
    setJoinMsg("join_notfound");
    setConnState("conn_none");
    scheduleRetry();
  });
}
function connectHost(){
  if(!peer || S.role!=="follower") return;
  setConnState("conn_connecting");
  var c = peer.connect(PREFIX + S.code, {reliable:true});
  hostConn = c;
  c.on("open", function(){
    retryDelay = 1200;
    showMain();
    document.getElementById("roomcode").textContent = S.code;
    renderFollowerConnState();
    try{ c.send(JSON.stringify({t:"hello", name:S.name, canCue:S.canCue===true})); }catch(err){}
    pingHost();
  });
  c.on("data", function(raw){ onHostData(parse(raw)); });
  c.on("close", function(){ setConnState("conn_reconnect"); scheduleRetry(); });
  c.on("error", function(){ setConnState("conn_reconnect"); scheduleRetry(); });
}
function scheduleRetry(){
  if(S.role!=="follower") return;
  clearTimeout(retryTimer);
  retryTimer = setTimeout(function(){
    retryDelay = Math.min(retryDelay*1.6, 8000);
    if(peer && peer.disconnected && !peer.destroyed){ try{ peer.reconnect(); }catch(err){} }
    connectHost();
  }, retryDelay);
}
function parse(raw){
  try{ return typeof raw==="string" ? JSON.parse(raw) : raw; }catch(err){ return null; }
}
var pingSentAt = 0;
function pingHost(){
  if(!hostConn || !hostConn.open) return;
  pingSentAt = Date.now();
  try{ hostConn.send(JSON.stringify({t:"ping", c:pingSentAt})); }catch(err){}
  setTimeout(pingHost, 5000);
}
function renderFollowerConnState(){
  if(S.role!=="follower") return;
  setConnState(S.canCue ? "conn_conductor" : "conn_follower");
}
function onHostData(m){
  if(!m) return;
  if(m.t==="pong"){
    var rtt = Date.now() - m.c;
    clockOffset = (m.s + rtt/2) - Date.now();
    return;
  }
  if(m.t==="welcome"){ S.name = m.name || S.name; return; }
  if(m.t==="sync"){
    S.bpm = m.bpm; S.meter = m.meter;
    S.metroRunning = m.metroRunning; S.metroStart = m.metroStart;
    S.metroBeat0 = m.metroBeat0 || 0;
    if(m.tb && isFinite(m.tb.t0)) TB = {t0:m.tb.t0, beat0:m.tb.beat0, bpm0:m.tb.bpm0, bpm1:m.tb.bpm1, T:m.tb.T};
    S.count = m.count || null;
    S.ramp  = m.ramp  || null;
    if(!S.ramp) hideRamp();
    nextClickBeat = -1;
    renderAll();
    return;
  }
  if(m.t==="flash"){ startFlash(m.text, m.dur, m.from); return; }
  if(m.t==="count"){
    S.ramp = null; hideRamp(); endFlash();
    /* no `next` here on purpose: slot 4 is executed by the host alone,
       a follower only ever displays nextLabel */
    S.count = {startAt:m.startAt, startBeat:m.startBeat, bars:m.bars,
               label:m.label||"", from:m.from||"", fx:m.fx||null,
               nextLabel:String(m.nextLabel||"").slice(0,24)};
    return;
  }
  if(m.t==="countcancel"){ S.count = null; hideCount(); return; }
  if(m.t==="ramp"){
    S.count = null; hideCount(); endFlash();
    S.ramp = {startAt:m.startAt, startBeat:m.startBeat, bars:m.bars, label:m.label||"",
              dir:m.dir||null, from:m.from||"", fx:m.fx||"none",
              bpmFrom:m.bpmFrom||0, bpmTo:m.bpmTo||0,
              nextLabel:String(m.nextLabel||"").slice(0,24)};
    return;
  }
  if(m.t==="rampcancel"){ S.ramp = null; hideRamp(); return; }
}

/* =========================================================
   SCREENS
   ========================================================= */
var scrHome = document.getElementById("home");
var scrJoin = document.getElementById("join");
var scrMain = document.getElementById("main");
var langbar = document.getElementById("langbar");
function show(el){
  [scrHome,scrJoin,scrMain].forEach(function(s){ s.classList.remove("show"); });
  el.classList.add("show");
  langbar.classList.toggle("hidden", el !== scrHome);   // corner switch is home only
}
function showMain(){
  show(scrMain);
  applyPermissions();
  renderAll();
  if(S.role==="local") setConnState("conn_local");
  requestWakeLock();
}
/* Called on entry and whenever the conductor / follow-only switch is flipped,
   so a hand-over takes effect immediately without reconnecting. */
function applyPermissions(){
  var host = isHost(), cue = canCue();
  var tempoCard = document.getElementById("tempocard");
  var meterCard = document.getElementById("metercard");
  tempoCard.classList.toggle("hidden", !cue);
  meterCard.classList.toggle("hidden", !cue);
  tempoCard.classList.toggle("ro", !host);      // BPM / meter: host only
  meterCard.classList.toggle("ro", !host);
  document.getElementById("gridwrap").classList.toggle("hidden", !cue);
  document.getElementById("folinfo").classList.toggle("hidden", cue);
  document.getElementById("editbtn").classList.toggle("hidden", !cue);
  document.getElementById("metrobtn").classList.toggle("hidden", !host);
  document.getElementById("rolebtn").classList.toggle("hidden", host);
  if(S.editMode && !cue){
    S.editMode = false;
    document.getElementById("editbtn").classList.remove("on");
  }
  if(!cue) clearCompose();
  renderRoleBtn();
  renderTapInfo();
}
function renderRoleBtn(){
  var b = document.getElementById("rolebtn");
  b.textContent = t(S.canCue ? "role_cue" : "role_follow");
  b.classList.toggle("on", !!S.canCue);
}
document.getElementById("rolebtn").addEventListener("click", function(){
  if(isHost()) return;                       // the host is always a conductor
  S.canCue = !S.canCue;
  try{ localStorage.setItem("sg_cancue", S.canCue ? "1" : "0"); }catch(err){}
  req({t:"role", canCue:S.canCue});
  applyPermissions();
  renderAll();
  renderFollowerConnState();
});

document.getElementById("btnCreate").addEventListener("click", function(){ hostRoom(0); });
document.getElementById("btnLocal").addEventListener("click", function(){
  S.role = "local"; S.canCue = true; S.code = "";
  S.name = storedName() || t("host_name");
  showMain(); setConnState("conn_local");
});
document.getElementById("btnJoin").addEventListener("click", function(){
  show(scrJoin); setJoinMsg(null);
  document.getElementById("nameinput").value = storedName();
  setJoinRole(readNum("sg_cancue",0) === 1);
  document.getElementById("codeinput").focus();
});
/* join screen: conductor / follow-only choice */
function setJoinRole(v){
  S.canCue = !!v;
  Array.prototype.forEach.call(document.querySelectorAll("#joinrole button"), function(b){
    b.classList.toggle("on", (b.getAttribute("data-cue")==="1") === S.canCue);
  });
}
Array.prototype.forEach.call(document.querySelectorAll("#joinrole button"), function(b){
  b.addEventListener("click", function(){ setJoinRole(b.getAttribute("data-cue")==="1"); });
});
document.getElementById("btnJoinBack").addEventListener("click", function(){ show(scrHome); });
document.getElementById("btnJoinGo").addEventListener("click", function(){
  var v = (document.getElementById("codeinput").value||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
  if(v.length!==4){ setJoinMsg("join_err_len"); return; }
  S.name = (document.getElementById("nameinput").value||"").trim().slice(0,12);
  try{
    localStorage.setItem("sg_name", S.name);
    localStorage.setItem("sg_cancue", S.canCue ? "1" : "0");
  }catch(err){}
  joinRoom(v);
});
document.getElementById("codeinput").addEventListener("input", function(){
  this.value = this.value.toUpperCase().replace(/[^A-Z0-9]/g,"");
});
document.getElementById("leavebtn").addEventListener("click", function(){
  try{ if(peer) peer.destroy(); }catch(err){}
  peer=null; conns=[]; hostConn=null; clearTimeout(retryTimer); peerSeq=0;
  S.role="none"; S.canCue=false; S.count=null; S.ramp=null;
  S.metroRunning=false; clearCompose();
  hideCount(); hideRamp(); setConnState(null); show(scrHome);
});

/* ---------- language switch ---------- */
function setLang(v){
  var n = normLang(v); if(!n || n === lang) return;
  lang = n;
  try{ localStorage.setItem("sg_lang", lang); }catch(err){}
  if(!cellsAreCustom()) S.cells = defaultCells();   // untouched defaults follow the language
  applyLang();
}
Array.prototype.forEach.call(document.querySelectorAll(".lang-btn"), function(b){
  b.addEventListener("click", function(){ setLang(b.getAttribute("data-lang")); });
});
function applyLang(){
  document.documentElement.setAttribute("lang", lang === "zh-TW" ? "zh-Hant" : lang);
  Array.prototype.forEach.call(document.querySelectorAll("[data-i18n]"), function(el){
    el.textContent = t(el.getAttribute("data-i18n"));
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-i18n-ph]"), function(el){
    el.setAttribute("placeholder", t(el.getAttribute("data-i18n-ph")));
  });
  Array.prototype.forEach.call(document.querySelectorAll(".lang-btn"), function(b){
    b.classList.toggle("on", b.getAttribute("data-lang") === lang);
  });
  renderConnState(); renderJoinMsg(); renderTapInfo();
  renderAll();
}

/* =========================================================
   TEMPO / TAP
   ========================================================= */
var taps = [];
var tapbtn = document.getElementById("tapbtn");
function renderTapInfo(){
  var el = document.getElementById("tapinfo");
  if(!isHost() && S.role!=="none"){ el.textContent = t("ro_hint"); return; }
  el.textContent = S.tapKey ? t(S.tapKey, S.tapArg === null ? undefined : S.tapArg) : t("tap_hint");
}
function doTap(){
  var t = performance.now();
  if(taps.length && (t - taps[taps.length-1]) > beatDur()*8) taps = [];
  taps.push(t);
  if(taps.length > 5) taps.shift();
  if(taps.length >= 2){
    var iv=[], i;
    for(i=1;i<taps.length;i++) iv.push(taps[i]-taps[i-1]);
    var sum=0; for(i=0;i<iv.length;i++) sum += iv[i];
    var avg = sum/iv.length;
    setBpm(clamp(Math.round(60000/avg),30,300));   // BPM is quarter-note based
  }
  if(taps.length < 4){ S.tapKey = "tap_count"; S.tapArg = taps.length; }
  else { S.tapKey = "tap_done"; S.tapArg = null; }
  renderTapInfo();
  tapbtn.classList.add("hit");
  setTimeout(function(){ tapbtn.classList.remove("hit"); }, 70);
}
tapbtn.addEventListener("pointerdown", function(e){ e.preventDefault(); doTap(); });
function setBpm(v){
  if(!isHost()) return;                 // tempo is host-only
  S.bpm = clamp(Math.round(v),30,300);
  localStorage.setItem("sg_bpm", String(S.bpm));
  setConstBpm(now(), S.bpm);            // a manual tempo edit ends any ramp
  if(S.ramp && S.ramp.fx === "tempo"){ S.ramp = null; hideRamp(); send({t:"rampcancel"}); }
  nextClickBeat = -1;
  document.getElementById("bpmval").textContent = S.bpm;
  send(stateMsg());
}
document.getElementById("bpmup").addEventListener("click", function(){ setBpm(S.bpm+1); });
document.getElementById("bpmdown").addEventListener("click", function(){ setBpm(S.bpm-1); });

/* =========================================================
   METER
   ========================================================= */
function renderMeters(){
  var row = document.getElementById("meterrow");
  row.innerHTML = "";
  METERS.forEach(function(m, i){
    var b = document.createElement("button");
    b.className = "meter-btn" + (i===S.meter ? " on" : "");
    b.textContent = m.name;
    b.addEventListener("click", function(){
      if(!isHost()) return;             // meter is host-only
      /* re-anchor first: the beat rate depends on the meter denominator, so
         the integral has to be closed off under the old value */
      rebaseTB(now());
      S.meter = i;
      localStorage.setItem("sg_meter", String(i));
      nextClickBeat = -1;
      renderMeters(); renderDots(); send(stateMsg());
    });
    row.appendChild(b);
  });
}

/* =========================================================
   METRONOME  (local clock, leader broadcasts start stamp)
   ========================================================= */
var dotEls = [], countDotEls = [], rampDotEls = [];
function buildDots(wrap){
  wrap.innerHTML = "";
  var els = [], m = meter();
  for(var i=0;i<m.n;i++){
    var d = document.createElement("div");
    d.className = "dot" + (i===0 ? " first" : (m.acc.indexOf(i)>=0 ? " acc" : ""));
    wrap.appendChild(d); els.push(d);
  }
  return els;
}
function renderDots(){
  dotEls      = buildDots(document.getElementById("dots"));
  countDotEls = buildDots(document.getElementById("countdots"));
  rampDotEls  = buildDots(document.getElementById("rampdots"));
  lastBeat = -1; lastCountBeat = -1; lastRampBeat = -1;
}
function toggleMetro(){
  if(!isHost()) return;                 // transport is host-only
  S.metroRunning = !S.metroRunning;
  S.metroStart = S.metroRunning ? now() + 120 : 0;
  /* the downbeat phase is an absolute beat position, so it survives tempo
     ramps, BPM edits and meter changes without being recomputed */
  S.metroBeat0 = S.metroRunning ? beatAt(S.metroStart) : 0;
  nextClickBeat = -1;
  document.getElementById("metrobtn").textContent = t(S.metroRunning ? "metro_stop" : "metro_start");
  document.getElementById("metrobtn").classList.toggle("on", S.metroRunning);
  send(stateMsg());
}
document.getElementById("metrobtn").addEventListener("click", toggleMetro);

var soundbtn = document.getElementById("soundbtn");
function renderSound(){
  soundbtn.textContent = t(S.sound ? "sound_on" : "sound_off");
  soundbtn.classList.toggle("on", S.sound);
}
soundbtn.addEventListener("click", function(){
  S.sound = !S.sound;
  localStorage.setItem("sg_sound", S.sound ? "1" : "0");
  if(S.sound) initAudio();
  renderSound();
});

var actx = null;
function initAudio(){
  if(actx) { if(actx.state==="suspended") actx.resume(); return; }
  var AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return;
  actx = new AC();
  if(actx.state==="suspended") actx.resume();
}
function click(when, strong){
  if(!actx) return;
  var o = actx.createOscillator(), g = actx.createGain();
  o.type = "square";
  o.frequency.value = strong ? 1600 : 900;
  g.gain.setValueAtTime(0.0001, when);
  g.gain.exponentialRampToValueAtTime(strong?0.32:0.16, when+0.002);
  g.gain.exponentialRampToValueAtTime(0.0001, when+0.045);
  o.connect(g); g.connect(actx.destination);
  o.start(when); o.stop(when+0.06);
}

/* =========================================================
   CELLS / GRID
   ========================================================= */
var gridTime = document.getElementById("gridtime");
var gridMode = document.getElementById("gridmode");
var gridActs = document.getElementById("gridacts");
var gridNums = document.getElementById("gridnums");

function bindCell(b, id, onTap){
  var lpTimer=null, moved=false;
  b.addEventListener("pointerdown", function(){
    moved = false;
    lpTimer = setTimeout(function(){ lpTimer=null; if(id) openEditor(id); }, 600);
  });
  b.addEventListener("pointermove", function(){ moved = true; });
  b.addEventListener("pointerup", function(){
    if(lpTimer){ clearTimeout(lpTimer); lpTimer=null; if(!moved) onTap(); }
  });
  b.addEventListener("pointercancel", function(){ clearTimeout(lpTimer); lpTimer=null; });
}
function gridOf(kind, c){
  if(kind === "time") return gridTime;
  if(kind === "mode") return gridMode;
  return isNumCell(c) ? gridNums : gridActs;
}
function renderGrid(){
  gridTime.innerHTML = ""; gridMode.innerHTML = "";
  gridActs.innerHTML = ""; gridNums.innerHTML = "";
  S.cells.forEach(function(c){
    var kind = (c.kind === "time" || c.kind === "mode") ? c.kind : "act";
    var b = document.createElement("button");
    b.className = "cell " + kind + (isNumCell(c) ? " num" : "");
    /* mode cells are structural, so they are never in the editable set */
    if(S.editMode && kind !== "mode") b.className += " editing";
    if(isPicked(c)) b.className += " sel";
    var lab = document.createElement("div");
    lab.className = "lab"; lab.textContent = cellText(c);
    b.appendChild(lab);
    if(kind === "act"){
      if(S.cmp.actId === c.id || S.cmp.act2Id === c.id){
        var sl = document.createElement("div");
        sl.className = "slot";
        sl.textContent = (S.cmp.actId === c.id) ? "3" : "4";
        b.appendChild(sl);
      }
      /* no cresc./decresc. wedge here: "gradually" is its own slot now, so a
         dynamics action carries no shape of its own — only its label */
      if(c.fx === "tempo"){
        var p = document.createElement("div");
        p.className = "n";
        p.textContent = (c.dir === "down" ? "-" : "+") + (c.pct || 10) + "%";
        b.appendChild(p);
      }
    }
    bindCell(b, kind === "mode" ? null : c.id, function(){ cellTap(c); });
    gridOf(kind, c).appendChild(b);
  });
  if(S.editMode){
    gridTime.appendChild(addButton("time"));
    gridActs.appendChild(addButton("act"));
  }
  renderCompose();
}
function isPicked(c){
  if(c.kind === "time") return S.cmp.timeId === c.id;
  if(c.kind === "mode") return S.cmp.modeId === c.id;
  return S.cmp.actId === c.id || S.cmp.act2Id === c.id;
}
function addButton(kind){
  var b = document.createElement("button");
  b.className = "cell addc " + kind;
  b.textContent = t(kind === "time" ? "add_time" : "add_act");
  b.addEventListener("click", function(){ addCell(kind); });
  return b;
}
function addCell(kind){
  var c = (kind === "time")
    ? {id:"t"+Date.now(), kind:"time", n:4}
    : {id:"a"+Date.now(), kind:"act", label:t("new_act_label"), fx:"none", dir:"up", pct:10};
  S.cells.push(c); saveCells(); renderGrid(); openEditor(c.id);
}

/* =========================================================
   SENTENCE COMPOSITION  (nothing is broadcast before START)
   ========================================================= */
function clearCompose(){
  S.cmp = {timeId:null, modeId:null, actId:null, act2Id:null};
  S.warnKey = null; S.warnUntil = 0;
}
function warn(key){
  S.warnKey = key; S.warnUntil = now() + 3000;
  renderCompose();
}
function cellTap(c){
  if(S.editMode){ if(c.kind !== "mode") openEditor(c.id); return; }
  if(!canCue()) return;
  S.warnKey = null;
  if(c.kind === "time"){
    S.cmp.timeId = (S.cmp.timeId === c.id) ? null : c.id;      // tap again = cancel
  }else if(c.kind === "mode"){
    S.cmp.modeId = (S.cmp.modeId === c.id) ? null : c.id;
  }else{
    if(S.cmp.actId === c.id){
      /* cancelling slot 3 promotes slot 4, so slot 4 is never left orphaned */
      S.cmp.actId = S.cmp.act2Id; S.cmp.act2Id = null;
    }else if(S.cmp.act2Id === c.id){
      S.cmp.act2Id = null;
    }else if(!S.cmp.actId){
      S.cmp.actId = c.id;
    }else{
      S.cmp.act2Id = c.id;                                     // third tap replaces slot 4
    }
  }
  renderGrid();
}
function cmpTime(){  return S.cmp.timeId ? cellById(S.cmp.timeId) : null; }
function cmpMode(){  return S.cmp.modeId ? cellById(S.cmp.modeId) : null; }
function cmpAct(){   return S.cmp.actId  ? cellById(S.cmp.actId)  : null; }
function cmpAct2(){  return S.cmp.act2Id ? cellById(S.cmp.act2Id) : null; }
function isGradual(){ var m = cmpMode(); return !!m && m.mode === "gradual"; }
function barsOf(c){ return clamp(parseInt(c && c.n,10) || 4, 1, 64); }

/* the sentence as one readable line, assembled from per-language templates */
function sentenceText(){
  var act = cmpAct();
  if(!act) return "";
  var tc = cmpTime(), s;
  if(!tc)              s = tf("sent_now",   {a:cellText(act)});
  else if(isGradual()) s = tf("sent_grad",  {n:barsOf(tc), a:cellText(act)});
  else                 s = tf("sent_after", {n:barsOf(tc), a:cellText(act)});
  var a2 = cmpAct2();
  if(a2) s = tf("sent_then", {a:s, b:cellText(a2)});
  return s;
}
function actPayload(c){
  return {label:cellText(c), fx:c.fx || "none",
          dir:c.dir === "down" ? "down" : "up",
          pct:clamp(parseInt(c.pct,10) || 0, 0, 90)};
}
function renderCompose(){
  var bar = document.getElementById("composebar");
  var line = document.getElementById("sentence");
  var btn  = document.getElementById("startbtn");
  bar.classList.toggle("hidden", !canCue());
  btn.textContent = t("start");
  var ready = !!cmpAct();
  btn.classList.toggle("off", !ready);
  btn.disabled = !ready;
  var msg = S.warnKey ? t(S.warnKey) : (ready ? sentenceText() : t("hint_pick_act"));
  line.classList.toggle("warn", !!S.warnKey);
  line.classList.toggle("dim", !S.warnKey && !ready);
  if(line.textContent !== msg) line.textContent = msg;
}
/* START is the only path out of this device */
function sendSentence(){
  var act = cmpAct();
  if(!act){ warn("hint_pick_act"); return; }
  var tc = cmpTime();
  if(isGradual() && !tc){ warn("warn_need_bars"); return; }   // gradual needs a duration
  var a2 = cmpAct2();
  var cmd = actPayload(act);
  cmd.mode = !tc ? "now" : (isGradual() ? "gradual" : "after");
  cmd.n    = tc ? barsOf(tc) : 0;
  cmd.next = a2 ? actPayload(a2) : null;
  if(!isHost() && (cmd.fx === "tempo" || (cmd.next && cmd.next.fx === "tempo"))){
    warn("tempo_host_only"); return;
  }
  if(runCmd(cmd, "", false) === false){ warn("tempo_host_only"); return; }
  clearCompose();
  renderGrid();
}
document.getElementById("startbtn").addEventListener("click", sendSentence);
document.getElementById("clearbtn").addEventListener("click", function(){
  clearCompose(); renderGrid();
});
document.getElementById("editbtn").addEventListener("click", function(){
  S.editMode = !S.editMode;
  document.getElementById("editbtn").classList.toggle("on", S.editMode);
  document.getElementById("editbtn").textContent = t(S.editMode ? "edit_off" : "edit_on");
  if(S.editMode) clearCompose();
  renderGrid();
});

/* ---------- cell editor ---------- */
var editorEl = document.getElementById("editor");
var curEdKind = "act", curEdFx = "none", curEdDir = "up";
function openEditor(id){
  var c = cellById(id);
  if(!c || c.kind === "mode") return;          // the two mode cells are fixed
  S.editId = id;
  document.getElementById("edlabel").value = c.label || "";
  document.getElementById("ednval").textContent = clamp(parseInt(c.n,10)||4,1,64);
  document.getElementById("edpctval").textContent = clamp(parseInt(c.pct,10)||10,0,90) + "%";
  setEdDir(c.dir === "down" ? "down" : "up");
  setEdFx(c.fx || "none");
  setEdKind(c.kind === "time" ? "time" : "act");
  editorEl.classList.add("show");
  scrim.classList.add("show");
}
function closeEditor(){
  if(!editorEl.classList.contains("show")) return;
  var c = cellById(S.editId);
  if(c){
    var v = document.getElementById("edlabel").value.trim();
    var n = clamp(parseInt(document.getElementById("ednval").textContent,10)||4,1,64);
    c.kind = curEdKind;
    if(curEdKind === "time"){
      c.n = n;
      /* an empty name means "follow the language", so the face stays correct */
      if(v) c.label = v; else delete c.label;
      c.fx = "none";
    }else{
      c.label = v || c.label || t("new_act_label");
      c.fx = curEdFx;
      c.dir = curEdDir;
      c.pct = clamp(parseInt(document.getElementById("edpctval").textContent,10)||10,0,90);
    }
    saveCells();
  }
  editorEl.classList.remove("show");
  scrim.classList.remove("show");
  S.editId = null;
  clearCompose();               // an edited cell may no longer fit its slot
  renderGrid();
}
function segOn(sel, attr, v){
  Array.prototype.forEach.call(document.querySelectorAll(sel), function(b){
    b.classList.toggle("on", b.getAttribute(attr) === v);
  });
}
function setEdKind(v){
  curEdKind = v;
  segOn("#edkind button","data-kind",v);
  document.getElementById("edfx").classList.toggle("hidden", v === "time");
  updEdRows();
}
function setEdFx(v){   curEdFx   = v; segOn("#edfx button","data-fx",v);     updEdRows(); }
function setEdDir(v){  curEdDir  = v; segOn("#eddir button","data-dir",v); }
function updEdRows(){
  var isTime = curEdKind === "time";
  document.getElementById("ednrow").classList.toggle("hidden", !isTime);
  document.getElementById("eddir").classList.toggle("hidden", isTime || curEdFx === "none");
  document.getElementById("edpctrow").classList.toggle("hidden", isTime || curEdFx !== "tempo");
  var labs = document.querySelectorAll("#eddir .dl");
  if(labs.length === 2){
    /* direction names the target state, not a change: 吵 / 安靜, 快 / 慢 */
    labs[0].textContent = t(curEdFx === "tempo" ? "act_faster" : "act_louder");
    labs[1].textContent = t(curEdFx === "tempo" ? "act_slower" : "act_quieter");

}
