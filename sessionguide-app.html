<!DOCTYPE html>
<!-- version: v260902 — 每次部署到 madzine.work 前更新此版本號與 #wordmark -->
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#121212">
<meta name="description" content="Session Guide - band leader cue system for live improvisation.">
<title>Session Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400&family=Noto+Sans+TC:wght@300;400&family=Noto+Sans+JP:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#121212;
  --bg-elev:#1c1c1c;
  --panel:#232323;
  --line:#303030;
  --fg:#f2f2f2;
  --fg2:#a8a8a8;
  --fg3:#6e6e6e;
  --acc:#e8846c;
  --acc-dim:#6b4a41;
  --acc-glow:#ff9c80;
  --warn:#c8443a;
  --font:"Barlow Condensed","Noto Sans TC","Noto Sans JP","PingFang TC",-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
  --gap:8px;
  --pad:10px;
  /* height the pinned timeline takes off the bottom of the viewport. Every
     full-height box (#app and the three overlays) subtracts it, so the timeline
     is the only thing that ever owns that strip — nothing has to be layered
     over it and nothing can cover it. Zero until a room is open. */
  --tl-h:0px;
}
body.tl-on{--tl-h:calc(96px + env(safe-area-inset-bottom,0px))}
/* edit mode grows the same variable instead of floating a panel: #app shrinks
   by exactly as much as the timeline gains, so the two never overlap */
body.tl-on.tl-edit{--tl-h:calc(min(500px,66vh) + env(safe-area-inset-bottom,0px))}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;touch-action:manipulation}
body{
  background:var(--bg);
  color:var(--fg);
  font-family:var(--font);
  font-weight:300;
  line-height:1.2;
  font-size:17px;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;
  overscroll-behavior:none;
}
button,input{font-family:var(--font);font-weight:300;line-height:1.2;color:inherit;touch-action:manipulation}
button{background:none;border:none;cursor:pointer}

#app{
  /* dynamic viewport height: iOS Safari shrinks the visible area when the
     toolbars are shown, and position:fixed alone reports the LARGE viewport. */
  position:fixed;left:0;right:0;top:0;
  height:calc(100vh - var(--tl-h));height:calc(100svh - var(--tl-h));height:calc(100dvh - var(--tl-h));
  display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 8px) calc(env(safe-area-inset-right,0px) + 12px) calc(env(safe-area-inset-bottom,0px) + 10px) calc(env(safe-area-inset-left,0px) + 12px);
}
/* the timeline already carries the home-indicator inset, so #app must not pay
   for it a second time once the strip is up */
body.tl-on #app{padding-bottom:10px}

/* ---------- top bar ---------- */
#topbar{
  display:flex;align-items:center;justify-content:space-between;
  gap:8px;height:26px;flex:0 0 auto;
}
#wordmark{font-size:14px;letter-spacing:.14em;color:var(--fg3);line-height:26px;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
#topright{display:flex;align-items:center;gap:10px}
#connstate{font-size:14px;color:var(--fg2);line-height:26px;white-space:nowrap}
.hue-btn{
  font-size:16px;letter-spacing:.12em;color:var(--fg2);
  border:1px solid var(--line);border-radius:5px;
  padding:0 11px;line-height:26px;min-height:26px;
}
.hue-btn.on{color:var(--acc);border-color:var(--acc-dim)}

/* ---------- screens ---------- */
.screen{flex:1 1 auto;min-height:0;display:none;flex-direction:column}
.screen.show{display:flex}

/* home */
#home{justify-content:center;gap:14px;padding-bottom:6vh}
#home .brand{text-align:center;margin-bottom:18px}
#home .brand .t{font-size:52px;letter-spacing:.06em;line-height:1.05}
#home .brand .s{font-size:15px;color:var(--fg3);letter-spacing:.2em;margin-top:6px;line-height:1.2}
.big-btn{
  display:block;width:100%;min-height:64px;
  background:var(--bg-elev);border:1px solid var(--line);border-radius:10px;
  font-size:22px;letter-spacing:.04em;color:var(--fg);
  padding:12px;line-height:1.2;
}
.big-btn .sub{display:block;font-size:14px;color:var(--fg3);margin-top:4px;line-height:1.2}
/* self-download: the app is one file, so the page hands out its own source */
#srcbox{text-align:center;margin-top:10px}
#srcdl{display:inline-flex;align-items:center;justify-content:center;min-height:44px;
  padding:0 14px;font-size:17px;letter-spacing:.08em;color:var(--fg2);
  border-bottom:1px solid var(--line);cursor:pointer}
#srcdl:active{color:var(--acc)}
#srcnote{font-size:17px;color:var(--fg2);line-height:1.35;margin-top:4px;padding:0 8px}
.big-btn.primary{border-color:var(--acc-dim);color:var(--acc)}
.big-btn:active{background:var(--panel)}

/* language switch (home corner) */
#langbar{
  position:absolute;
  left:calc(env(safe-area-inset-left,0px) + 12px);
  bottom:calc(env(safe-area-inset-bottom,0px) + 10px);
  display:flex;gap:6px;
}
.lang-btn{
  font-size:16px;letter-spacing:.1em;color:var(--fg3);
  background:var(--bg-elev);border:1px solid var(--line);border-radius:6px;
  min-height:44px;min-width:52px;padding:0 12px;line-height:1.2;
}
.lang-btn.on{color:var(--acc);border-color:var(--acc-dim)}
.lang-btn:active{background:var(--panel)}

/* join */
#join{justify-content:center;align-items:center;gap:14px;overflow-y:auto}
#join .lab{font-size:18px;color:var(--fg);letter-spacing:.14em;line-height:1.2;flex:0 0 auto}
#nameinput{
  width:100%;max-width:320px;text-align:center;
  font-size:22px;letter-spacing:.04em;
  background:var(--bg-elev);border:1px solid var(--line);border-radius:10px;
  padding:10px;color:var(--fg);line-height:1.2;min-height:48px;flex:0 0 auto;
}
#nameinput:focus{outline:none;border-color:var(--acc-dim)}
#joinrole{width:100%;max-width:320px;flex:0 0 auto}
#codeinput{
  width:100%;max-width:320px;text-align:center;
  font-size:64px;letter-spacing:.22em;
  background:var(--bg-elev);border:1px solid var(--line);border-radius:10px;
  padding:10px 0 10px 12px;color:var(--fg);line-height:1.2;
  text-transform:uppercase;flex:0 0 auto;
}
#codeinput:focus{outline:none;border-color:var(--acc-dim)}
#joinmsg{font-size:18px;color:var(--fg2);min-height:22px;line-height:1.2;flex:0 0 auto}
.row-btns{display:flex;gap:var(--gap);width:100%;flex:0 0 auto}

/* ---------- main ---------- */
/* the leader column scrolls when the viewport is short, so the tempo /
   meter / metronome cards scroll away instead of squeezing the cell grid.
   The sentence + START bar sits OUTSIDE that scroller and is always reachable. */
#main{gap:var(--gap);padding-top:6px}
#mainscroll{
  flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:var(--gap);
  overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
}
.card{
  background:var(--bg-elev);border:1px solid var(--line);border-radius:10px;
  padding:var(--pad);flex:0 0 auto;
}
.card + .card{margin-top:0}

/* room strip */
#roomstrip{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 12px}
#roomstrip .idbox{display:flex;align-items:baseline;gap:10px;min-width:0}
#roomcode{font-size:34px;letter-spacing:.2em;color:var(--acc);line-height:1.15;white-space:nowrap}
#roomlabel{font-size:14px;color:var(--fg3);letter-spacing:.16em;line-height:1.2}
#leavebtn{flex:0 0 auto;font-size:16px;color:var(--fg2);border:1px solid var(--line);border-radius:6px;padding:0 14px;min-height:44px;line-height:1.2}

/* tempo */
#tempo{display:flex;align-items:center;gap:10px}
#bpmbox{flex:0 0 auto;text-align:center;min-width:118px}
#bpmval{font-size:66px;line-height:.95;letter-spacing:.02em}
#bpmunit{font-size:14px;color:var(--fg3);letter-spacing:.22em;line-height:1.2;margin-top:2px}
#nudge{display:flex;flex-direction:column;gap:6px;flex:0 0 auto}
.nudge-btn{
  width:52px;min-height:44px;border:1px solid var(--line);border-radius:8px;
  background:var(--panel);font-size:22px;color:var(--fg);line-height:1.2;
}
.nudge-btn:active{background:var(--acc-dim)}
#tapbtn{
  flex:1 1 auto;min-height:88px;border:1px solid var(--acc-dim);border-radius:10px;
  background:var(--panel);color:var(--acc);
  font-size:30px;letter-spacing:.22em;line-height:1.2;
}
#tapbtn:active,#tapbtn.hit{background:var(--acc);color:#121212}
#tapinfo{font-size:18px;color:var(--fg2);line-height:1.2;margin-top:5px;text-align:center}

/* read-only tempo / meter (a conductor who is not the host) */
/* the read-only tempo card collapses into a single compact strip so it does
   not leave a large empty block where the TAP button used to be */
.card.ro{border-color:#2a2a2a}
.card.ro#tempocard{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px var(--pad)}
.card.ro #nudge,.card.ro #tapbtn{display:none}
.card.ro #tempo{flex:0 0 auto;gap:8px}
.card.ro #bpmbox{display:flex;align-items:baseline;gap:8px;min-width:0;text-align:left}
.card.ro #bpmval{font-size:40px;line-height:1}
.card.ro #bpmunit{margin-top:0}
.card.ro #tapinfo{flex:1 1 auto;margin-top:0;text-align:right}
.card.ro #meterrow{pointer-events:none}
.card.ro .meter-btn{opacity:.4}
.card.ro .meter-btn.on{opacity:1}

/* meter row */
#meterrow{display:flex;gap:6px}
.meter-btn{
  flex:1 1 0;min-height:44px;border:1px solid var(--line);border-radius:8px;
  background:var(--panel);font-size:19px;color:var(--fg2);line-height:1.2;
}
.meter-btn.on{border-color:var(--acc);color:var(--acc);background:var(--bg-elev)}

/* metronome */
#metrocard{display:flex;flex-direction:column;gap:8px}
#dots{display:flex;align-items:center;justify-content:center;gap:10px;min-height:30px}
.dot{
  width:20px;height:20px;border-radius:50%;
  background:var(--panel);border:1px solid var(--line);
  flex:0 0 auto;transition:background .04s linear;
}
.dot.first{width:26px;height:26px}
.dot.on{background:var(--fg)}
.dot.first.on{background:var(--acc);border-color:var(--acc)}
.dot.acc.on{background:var(--fg2)}
#transport{display:flex;gap:6px}
.tr-btn{
  flex:1 1 0;min-height:44px;border:1px solid var(--line);border-radius:8px;
  background:var(--panel);font-size:18px;color:var(--fg2);line-height:1.2;letter-spacing:.04em;
}
.tr-btn.on{border-color:var(--acc);color:var(--acc)}

/* grid: three zones, one per sentence slot type.
   1 how long (time)   2 at once / gradually (mode)   3+4 what (action)
   Slot 3/4 is itself three permanent groups: named actions, dynamics, tempo. */
#gridwrap{flex:1 0 auto;display:flex;flex-direction:column;gap:var(--gap)}
.gsec{display:flex;flex-direction:column;gap:6px;flex:0 0 auto}
.ghead{font-size:17px;color:var(--fg2);letter-spacing:.02em;line-height:1.2;padding-left:2px}
.gnote{font-size:15px;color:var(--fg3);letter-spacing:.02em;line-height:1.25;padding-left:2px}
.ggrid{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap);grid-auto-rows:minmax(56px,auto)}
.ggrid.c4{grid-template-columns:1fr 1fr 1fr 1fr;grid-auto-rows:minmax(48px,auto)}
.ggrid.c2{grid-auto-rows:minmax(48px,auto)}
/* dynamics: 10 cells, 5 per row — 68 px wide, well over the 44 px floor at 390 px */
.ggrid.cdyn{grid-template-columns:repeat(5,1fr);gap:6px;grid-auto-rows:minmax(46px,auto)}
/* tempo: the fast / slow pair, then the six amounts three per row */
.ggrid.ctdir{grid-template-columns:1fr 1fr;gap:6px;grid-auto-rows:minmax(46px,auto)}
.ggrid.ctmp{grid-template-columns:repeat(3,1fr);gap:6px;grid-auto-rows:minmax(46px,auto)}
.cell{
  border:1px solid var(--line);border-radius:10px;background:var(--bg-elev);
  font-size:21px;color:var(--fg);line-height:1.2;padding:8px 6px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  min-height:56px;position:relative;
}
.cell .n{font-size:14px;color:var(--fg3);letter-spacing:.16em;line-height:1.2}
/* time cells: small pills. mode cells: wider pills. actions: the loud block row */
.cell.time{background:var(--panel);border-color:#3d3d3d;font-size:18px;min-height:48px;border-radius:24px;padding:6px 4px}
.cell.mode{background:var(--panel);border-color:#3d3d3d;font-size:19px;min-height:48px;border-radius:10px;border-style:dashed}
.cell.act{background:var(--bg-elev)}
.cell.act.dyn,.cell.act.tmp{min-height:46px;font-size:22px;padding:6px 2px}
.cell.act.dyn .slot,.cell.act.tmp .slot{top:2px;right:5px;font-size:13px}
/* tempo direction is a modifier, not an action: same dashed pill as the mode cells */
.cell.tdir{background:var(--panel);border-color:#3d3d3d;font-size:19px;min-height:46px;border-radius:10px;border-style:dashed}
.cell.sel{border-color:var(--acc);background:var(--acc-dim);color:var(--fg);border-style:solid}
/* badge on a picked action: 1 = the first action, 2 = the one after it */
.cell .slot{
  position:absolute;top:4px;right:8px;font-size:14px;line-height:1.2;
  color:var(--acc-glow);letter-spacing:.08em;
}
.cell.addc{color:var(--fg2);border-style:dashed;font-size:18px}
/* CSS-drawn hairpin: widening = crescendo, narrowing = diminuendo */
.cell:active{background:var(--panel)}
.cell.editing{border-style:dashed;border-color:var(--acc)}

/* ---------- slot 3/4 action step: read at a distance, in the dark ----------
   this is the second tap of every cue, so every string inside #secact is set
   at display size. the grid rows grow with the type; long labels wrap instead
   of shrinking. */
#secact{display:flex;flex-direction:column;gap:12px;flex:0 0 auto}
#secact .gsec{gap:6px}
#secact .ghead{font-size:24px;letter-spacing:.03em;color:var(--fg2)}
#secact .gnote{font-size:17px;color:var(--fg3)}
#secact .ggrid{grid-auto-rows:minmax(76px,auto)}
#secact .ggrid.cdyn,#secact .ggrid.ctmp,#secact .ggrid.ctdir{grid-auto-rows:minmax(62px,auto)}
#secact .cell.act{
  font-size:28px;line-height:1.1;min-height:76px;padding:10px 8px;
  overflow-wrap:anywhere;
}
#secact .cell.act .lab{text-align:center}
#secact .cell.act .n{font-size:19px;letter-spacing:.1em}
#secact .cell.act .slot{top:5px;right:9px;font-size:20px}
#secact .cell.act.dyn,#secact .cell.act.tmp{font-size:30px;min-height:62px;padding:6px 2px}
#secact .cell.act.dyn .slot,#secact .cell.act.tmp .slot{top:2px;right:5px;font-size:16px}
#secact .cell.tdir{font-size:26px;min-height:62px}
#secact .cell.addc{font-size:22px}

/* ---------- sentence + START bar (never scrolls away) ---------- */
#composebar{
  flex:0 0 auto;display:flex;flex-direction:column;gap:6px;
  background:var(--bg-elev);border:1px solid var(--line);border-radius:10px;
  padding:8px var(--pad);
}
#sentence{
  font-size:18px;color:var(--fg);line-height:1.3;min-height:24px;
  overflow:hidden;text-overflow:ellipsis;
}
#sentence.dim{color:var(--fg2)}
#sentence.warn{color:var(--acc-glow)}
/* second action: a separate row of its own, so START keeps the widest, filled,
   largest block in the bar and never gets squeezed by a third button */
#nextbtn{
  width:100%;min-height:44px;border-radius:10px;
  background:var(--panel);border:1px solid var(--acc-dim);
  font-size:17px;letter-spacing:.04em;color:var(--acc);line-height:1.2;
}
#nextbtn:active{background:var(--acc-dim);color:var(--fg)}
#composebtns{display:flex;gap:var(--gap)}
#clearbtn{
  flex:0 0 34%;min-height:48px;border:1px solid var(--line);border-radius:10px;
  background:var(--panel);font-size:18px;color:var(--fg2);line-height:1.2;
}
#startbtn{
  flex:1 1 auto;min-height:48px;border-radius:10px;
  background:var(--acc);border:1px solid var(--acc);color:#121212;
  font-size:22px;letter-spacing:.14em;line-height:1.2;
}
#startbtn:active{background:var(--acc-glow);border-color:var(--acc-glow)}
/* disabled: no fill, dashed outline, struck-through weight — not just faded */
#startbtn.off{
  background:transparent;border:2px dashed var(--fg3);color:var(--fg3);
  cursor:default;letter-spacing:.08em;
}
#nextbtn.off{
  background:transparent;border:2px dashed var(--fg3);color:var(--fg3);
  cursor:default;
}

/* short viewports (iPhone Safari with toolbars, ~664 px and below):
   compress the non-interactive display elements so the cell grid keeps
   at least two visible rows. Touch targets stay at 44 px. */
@media (max-height:700px){
  #roomcode{font-size:28px}
  #bpmval{font-size:52px}
  #bpmbox{min-width:100px}
  #tapbtn{min-height:70px;font-size:26px}
  #tapinfo{margin-top:3px}
  #dots{min-height:24px}
  .dot{width:16px;height:16px}
  .dot.first{width:22px;height:22px}
  #metrocard{gap:6px}
  #codeinput{font-size:48px}
  #join{gap:12px}
  #composebar{padding:6px 8px;gap:4px}
  #sentence{font-size:17px;min-height:22px}
  /* the second-action row keeps the 44 px touch floor; only its type steps down */
  #nextbtn{font-size:16px}
  /* the action step keeps its display type on short screens: only the box
     heights and padding come down, never the font size */
  #secact{gap:10px}
  #secact .ghead{font-size:21px}
  #secact .gnote{font-size:16px}
  #secact .ggrid{grid-auto-rows:minmax(64px,auto)}
  #secact .ggrid.cdyn,#secact .ggrid.ctmp,#secact .ggrid.ctdir{grid-auto-rows:minmax(54px,auto)}
  #secact .cell.act{font-size:26px;min-height:64px;padding:6px 6px}
  #secact .cell.act.dyn,#secact .cell.act.tmp{font-size:27px;min-height:54px;padding:4px 2px}
  #secact .cell.tdir{font-size:23px;min-height:54px}
  #secact .cell.act .n{font-size:17px}
  #secact .cell.addc{font-size:20px}
  /* NOTE: the overlay / ramp short-screen rules live in the second
     @media (max-height:700px) block at the end of the overlay section — they have
     to come *after* the base overlay rules or they lose the cascade on equal
     specificity and silently do nothing. */
  :root{--pad:8px}
  /* the strip gives back 10 px on short screens: the track loses height, the
     44 px transport row does not. Declared after the base rule at the top of
     the sheet, so it wins the cascade on equal specificity. */
  body.tl-on{--tl-h:calc(86px + env(safe-area-inset-bottom,0px))}
  body.tl-on.tl-edit{--tl-h:calc(min(440px,66vh) + env(safe-area-inset-bottom,0px))}
  #timeline{gap:4px}
  #tltrack{height:26px}
  /* there used to be a #tlnow{font-size:20px} here. It never applied: the base
     #tlnow rule is declared LATER in this sheet at equal specificity, so it won
     the cascade at every height — the same trap the overlay comment above warns
     about. Removed rather than moved: a short screen is almost always a laptop
     in landscape, i.e. a WIDE one, and the clock there should be reading off the
     width scale like everything else on the strip, not shrinking. */
}

/* follower panel */
#folinfo{display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;flex:1 1 auto;min-height:0}
#folstate{font-size:24px;color:var(--fg2);letter-spacing:.08em;line-height:1.3;text-align:center}
#folsub{font-size:17px;color:var(--fg2);line-height:1.3;text-align:center}

/* ---------- overlays ---------- */
/* an overlay stops where the timeline starts: the strip must stay readable while
   a cue fills the screen. fitOverlayLabel() / fitFlashText() measure the box live,
   so the cue type follows the shorter height on its own. */
.overlay{
  position:fixed;left:0;right:0;top:0;
  height:calc(100vh - var(--tl-h));height:calc(100svh - var(--tl-h));height:calc(100dvh - var(--tl-h));
  z-index:40;display:none;
  flex-direction:column;align-items:center;justify-content:center;
  padding:24px;text-align:center;background:var(--bg);
}
.overlay.show{display:flex}
/* the cue label is as loud as the bar number: same font-size cap for both, stacked
   number over label. fitOverlayLabel() scales the label down when a long cue would
   not fit the space the other rows leave. */
#countnum{font-size:min(26vh,38vw);line-height:.86;letter-spacing:-.02em;font-weight:400}
#countlab{font-size:min(26vh,38vw);line-height:1.02;letter-spacing:.02em;font-weight:400;
  color:var(--fg2);margin-top:6px;max-width:92vw;word-break:break-word}
/* stage-readable subtitle: viewport-scaled, never below the 24 px floor a dark
   room at distance needs. Stays a clear step under .nextline. */
#countsub{font-size:clamp(24px,min(4.2vh,6vw),40px);color:var(--fg2);letter-spacing:.16em;margin-top:14px;line-height:1.2}
/* slot 4 preview: what happens the instant the countdown / ramp lands. Display
   type, roughly a third of the cue cap (min(26vh,38vw)), so it reads from the
   back of the room; fitOverlayLabel() sees this height and shrinks the cue to fit. */
.nextline{display:none;font-size:clamp(52px,min(16vh,24vw),192px);letter-spacing:.06em;color:var(--fg3);margin-top:14px;line-height:1.15}
.nextline.on{display:block}
#countdots{display:flex;align-items:center;justify-content:center;gap:10px;min-height:30px;margin-top:14px;flex-wrap:wrap}
#ovcount.last{background:#3a1512}
#ovcount.last .dot{background:#2a0f0d;border-color:#7a3a31}
#ovcount.last .dot.on{background:var(--fg);border-color:var(--fg)}
#ovcount.last .dot.first.on{background:var(--acc-glow);border-color:var(--acc-glow)}
#ovcount.last #countnum{color:#ff6a55}
#ovcount.last.blink #countnum{opacity:.15}
#ovcount .cancel{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);font-size:17px;color:var(--fg3);border:1px solid var(--line);border-radius:8px;padding:10px 20px;min-height:44px;line-height:1.2}
#ovflash{background:var(--acc);color:#121212;transition:opacity .35s linear}
#ovflash.fade{opacity:0}
/* cue flash: pulses for the whole time the overlay is shown, until endFlash()
   fades it out; ~2.3 Hz, kept under the 3 Hz photosensitivity ceiling */
#ovflash.intro{animation:introflash .44s steps(1,end) infinite}
@keyframes introflash{
  0%,49%{background:#121212}
  50%,100%{background:var(--acc)}
}
/* opening attention pulses for countdown/ramp: finite, ends on the static bg
   so the numbers stay readable; 6 cycles over 3 s = 2 Hz */
#ovcount.intro,#ovramp.intro{animation:introov 3s steps(1,end)}
@keyframes introov{
  0%,8%{background:var(--acc)}
  9%,16%{background:var(--bg)}
  17%,24%{background:var(--acc)}
  25%,33%{background:var(--bg)}
  34%,41%{background:var(--acc)}
  42%,49%{background:var(--bg)}
  50%,58%{background:var(--acc)}
  59%,66%{background:var(--bg)}
  67%,74%{background:var(--acc)}
  75%,83%{background:var(--bg)}
  84%,91%{background:var(--acc)}
  92%,100%{background:var(--bg)}
}
/* cue text is meant to fill the screen; this is only the starting cap — fitFlashText()
   scales it down per label so long cues still land inside the viewport */
#flashtxt{font-size:min(75vh,85vw);line-height:1.02;letter-spacing:.02em;font-weight:400;word-break:break-word}
/* source nickname stays visually subordinate to the cue text */
#flashfrom{font-size:clamp(22px,min(3.2vh,4.6vw),40px);letter-spacing:.14em;color:rgba(18,18,18,.55);margin-top:14px;line-height:1.2;max-width:90%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- ramp overlay ---------- */
/* same rule as #countlab: display-sized cue text, shrunk by fitOverlayLabel()
   when the bar / remaining / dots rows do not leave enough room */
#ramptxt{font-size:min(22vh,30vw);line-height:1.02;letter-spacing:.02em;font-weight:400;
  max-width:92vw;word-break:break-word}
#rampdir{font-size:22px;letter-spacing:.18em;color:var(--fg2);margin-top:8px;line-height:1.2}
#rampbar{
  position:relative;width:min(78vw,320px);height:38px;margin-top:20px;
  background:#2e2e2e;overflow:hidden;
}
#rampbar.up{clip-path:polygon(0 46%,100% 0,100% 100%,0 54%)}
#rampbar.down{clip-path:polygon(0 0,100% 46%,100% 54%,0 100%)}
#rampfill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--acc)}
#ramprem{font-size:38px;letter-spacing:.06em;margin-top:14px;line-height:1.15}
/* same stage-readable step as #countsub: the two overlays stay in one type scale */
#rampsub{font-size:clamp(24px,min(4.2vh,6vw),40px);color:var(--fg2);letter-spacing:.16em;margin-top:8px;line-height:1.2}
#rampdots{display:flex;align-items:center;justify-content:center;gap:10px;min-height:30px;margin-top:14px;flex-wrap:wrap}
#rampfrom{font-size:15px;color:var(--fg3);letter-spacing:.14em;margin-top:12px;line-height:1.2}
#ovramp .cancel{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);font-size:17px;color:var(--fg3);border:1px solid var(--line);border-radius:8px;padding:10px 20px;min-height:44px;line-height:1.2}

/* short screens, overlays only. This block has to sit after every base overlay
   rule above: the earlier @media (max-height:700px) block is declared before them,
   so an override placed there would lose the cascade on equal specificity. */
@media (max-height:700px){
  /* keep number and label the same size, just a lower starting cap so the
     next / dots / sub / cancel rows stay on screen; fitOverlayLabel() takes it from here */
  #countnum,#countlab{font-size:min(24vh,32vw)}
  /* the slot-4 line and the subtitle stay display type on short screens — only the
     cap and the gaps come down, so the stack still clears the dots / cancel rows */
  .nextline{font-size:clamp(44px,min(14vh,20vw),128px);margin-top:10px}
  #countsub{font-size:clamp(22px,min(3.6vh,5vw),30px);margin-top:10px}
  #countdots{margin-top:10px;min-height:24px}
  #flashfrom{font-size:clamp(20px,min(3vh,4.2vw),28px);margin-top:10px}
  #ramptxt{font-size:min(18vh,24vw)}
  #rampbar{height:32px;margin-top:14px}
  #ramprem{font-size:32px;margin-top:10px}
  #rampsub{font-size:clamp(22px,min(3.6vh,5vw),30px);margin-top:6px}
  #rampdots{margin-top:10px;min-height:24px}
  #rampfrom{margin-top:8px}
}

/* ---------- global timeline ----------
   Pinned to the bottom of the viewport, above every overlay (z 45 > 40) and
   outside #mainscroll, so it is visible and in the same place whatever the
   screen is doing. It is deliberately more compact than #composebar (96 px vs
   146 px): the cell grid above it is what loses the room. */
#timeline{
  position:fixed;left:0;right:0;bottom:0;z-index:45;
  height:var(--tl-h);
  display:none;flex-direction:column;gap:6px;
  background:var(--bg-elev);border-top:1px solid var(--line);
  padding:6px calc(env(safe-area-inset-right,0px) + 12px)
          calc(env(safe-area-inset-bottom,0px) + 6px) calc(env(safe-area-inset-left,0px) + 12px);
}
body.tl-on #timeline{display:flex}
/* four fixed claims and one elastic one. At 390 the row has 366 px to give:
   clock 64 + transport 144 + edit 44 + three 6 px gaps = 270, and #tlcue takes
   whatever is left (~96 px). The gap dropped 8 -> 6 and the edit button became
   an icon purely to hand those pixels to the section label. */
#tlbar{display:flex;align-items:center;gap:6px;height:44px;flex:0 0 auto}
/* ---------- strip type scale ----------
   Everything in this row is read from across a room, mid-set, with one glance —
   so the sizes are a function of the width the screen actually has instead of
   one fixed px that has to satisfy a 390 phone and a 1280 laptop at once.
   Shape is always clamp(phone floor, fixed base + vw growth, desktop ceiling):
   the floor is what 390 gets, the ceiling is where growth stops being legible.
   The ROW does not grow with them — #tlbar stays 44 px and every one of these
   sits on a fixed line-height inside it, so bigger type never lifts the track. */
/* elapsed reads at the left end of the strip, as the running clock of the set */
#tlclock{display:flex;flex-direction:column;justify-content:center;min-width:64px;flex:0 0 auto}
#tlnow{font-size:clamp(22px,16px + 1.1vw,32px);line-height:1.1;letter-spacing:.02em;color:var(--acc);white-space:nowrap}
/* the set length is reference, not readout: it stays the smallest thing here,
   but never below the 14 px non-interactive floor */
#tltotal{font-size:clamp(14px,10px + .6vw,20px);line-height:1.2;letter-spacing:.06em;color:var(--fg3);white-space:nowrap}
#tltransport{display:flex;gap:6px;flex:0 0 auto}
.tl-btn{
  width:44px;height:44px;flex:0 0 auto;
  border:1px solid var(--line);border-radius:8px;background:var(--panel);
  display:flex;align-items:center;justify-content:center;
}
.tl-btn svg{width:18px;height:18px;display:block;fill:var(--fg2)}
.tl-btn.on{border-color:var(--acc)}
.tl-btn.on svg{fill:var(--acc)}
.tl-btn:active{background:var(--acc-dim)}
/* the section label: what the playhead is standing in, in the player's own
   words. Sits right of the transport because that is where the eye already is
   after pressing start. display:block (not flex) so text-overflow can clip it —
   one line only, since a second line would push the track down. */
/* the largest type on the strip: of everything in this row, the section name is
   the one thing a player looks up mid-phrase. It also owns all the slack — the
   four neighbours are fixed-width — so a wide screen spends its extra pixels
   here first, which is exactly where the growth term belongs. line-height stays
   a fixed 42 px (44 minus borders) so the box height is independent of the type
   size, and ellipsis still clips the one line at 390. */
#tlcue{
  flex:1 1 auto;min-width:0;height:44px;
  border:1px solid var(--line);border-radius:8px;background:var(--panel);
  padding:0 8px;font-size:clamp(20px,14px + 1.6vw,34px);line-height:42px;letter-spacing:.02em;
  color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  display:flex;align-items:center;gap:6px;cursor:pointer;
}
#tlcue:active{background:var(--acc-dim)}
/* the label clips, the icon never does: it is the only affordance saying this
   box opens the fullscreen wall clock */
#tlcue .txt{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#tlcue .ico{flex:0 0 auto;width:15px;height:15px;display:block;fill:var(--fg3)}
/* icon, not the word: the label to its left needs every pixel the row has */
#tleditbtn{
  flex:0 0 auto;width:44px;height:44px;padding:0;
  display:flex;align-items:center;justify-content:center;
  border:1px solid var(--line);border-radius:8px;background:var(--panel);
}
#tleditbtn svg{width:18px;height:18px;display:block;fill:var(--fg2)}
#tleditbtn.on{border-color:var(--acc)}
#tleditbtn.on svg{fill:var(--acc)}
#tleditbtn:active{background:var(--acc-dim)}
/* the track: sections laid out by flex-grow, so width is proportional to the
   seconds each one holds and nothing has to be measured in pixels */
#tltrack{
  position:relative;flex:0 0 auto;height:34px;
  border:1px solid var(--line);border-radius:6px;overflow:hidden;
  background:var(--panel);touch-action:none;
}
#tlsegs{position:absolute;inset:0;display:flex}
.tlseg{height:100%;min-width:2px;border-right:1px solid rgba(0,0,0,.5)}
.tlseg:last-child{border-right:none}
#tlempty{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:14px;color:var(--fg3);letter-spacing:.06em;pointer-events:none;
}
#tlhead{position:absolute;top:0;bottom:0;left:0;width:2px;margin-left:-1px;background:var(--fg)}
#tlhead::after{
  content:"";position:absolute;left:-8px;top:0;width:18px;height:8px;
  background:var(--fg);border-radius:0 0 3px 3px;
}
/* read-only: a device that is not the host follows the host playhead and owns
   no transport, exactly as it owns no BPM */
body.tl-ro #tltransport,body.tl-ro #tleditbtn{display:none}
/* ---------- timeline edit mode ---------- */
#tledit{display:none;flex:1 1 auto;min-height:0;flex-direction:column;gap:6px}
body.tl-edit #tledit{display:flex}
#tllist{
  flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;display:flex;flex-direction:column;gap:6px;
}
/* two lines per section, not one: colour + seconds + delete already spend the
   whole 366 px, so the name field gets a line of its own. A hairline instead of
   a panel keeps every row in the same visual frame as the rest of the strip,
   and the 26 px indent puts the field under the swatch it belongs to. */
.tlrow{display:flex;flex-direction:column;gap:6px;flex:0 0 auto;
  padding-bottom:6px;border-bottom:1px solid var(--line)}
.tlrow:last-child{border-bottom:none;padding-bottom:0}
.tlrow-top{display:flex;align-items:center;gap:6px}
.tlrow-bot{display:flex;align-items:center;gap:6px;padding-left:26px}
.tlname{
  flex:1 1 auto;min-width:0;height:44px;padding:0 10px;
  font-size:16px;line-height:1.2;color:var(--fg);
  background:var(--panel);border:1px solid var(--line);border-radius:8px;
}
.tlname:focus{outline:none;border-color:var(--acc)}
.tlrow .idx{flex:0 0 auto;width:20px;text-align:center;font-size:14px;color:var(--fg3);line-height:1.2}
.tlsw{flex:0 0 auto;width:44px;height:44px;border:1px solid var(--line);border-radius:8px}
.tlstep{
  flex:0 0 auto;width:44px;height:44px;
  border:1px solid var(--line);border-radius:8px;background:var(--panel);
  font-size:22px;color:var(--fg);line-height:1;
}
.tlstep:active{background:var(--acc-dim)}
.tlsec{flex:1 1 auto;min-width:0;text-align:center;font-size:18px;color:var(--fg);line-height:1.2}
.tldel{
  flex:0 0 auto;min-height:44px;padding:0 12px;
  font-size:16px;line-height:1.2;color:var(--warn);
  border:1px solid #4a2320;border-radius:8px;background:var(--panel);
}
#tladd{
  flex:0 0 auto;min-height:44px;border:1px dashed var(--acc-dim);border-radius:8px;
  background:var(--panel);color:var(--acc);font-size:17px;line-height:1.2;
}


/* ---------- fullscreen timeline ----------
   The same strip, blown up to the whole viewport. Nothing is duplicated: these
   are the elements the strip already owns, only the type scale and the stacking
   order change, so the section name and the set clock read from the back of the
   room instead of off a 96 px band.
   A cue takes the screen back the moment one fires (body.cue-on): the command is
   the only thing that matters while it is up, and a wall clock the same size
   would compete for the same glance. z-index drops under the overlays for the
   same reason — the strip can never sit on top of a cue. */
body.tl-full #timeline{
  top:0;height:100vh;height:100svh;height:100dvh;
  z-index:38;gap:12px;border-top:none;background:var(--bg);
  padding:calc(env(safe-area-inset-top,0px) + 14px) calc(env(safe-area-inset-right,0px) + 16px)
          calc(env(safe-area-inset-bottom,0px) + 14px) calc(env(safe-area-inset-left,0px) + 16px);
}
body.tl-full.cue-on #timeline{display:none}
/* with the strip gone the cue owns the whole viewport, so it stops subtracting
   a strip height it no longer has to clear */
body.tl-full .overlay{height:100vh;height:100svh;height:100dvh}
body.tl-full #tlbar{flex:1 1 auto;min-height:0;height:auto;flex-direction:column;gap:12px}
/* the section name is the point of the mode: it takes every pixel the clock and
   the transport do not need, centred, wrapping instead of clipping */
body.tl-full #tlcue{
  order:1;flex:1 1 auto;width:100%;height:auto;min-height:0;
  border:none;background:none;padding:0;
  align-items:center;justify-content:center;text-align:center;
  font-size:min(20vh,17vw);line-height:1.05;letter-spacing:.02em;
}
body.tl-full #tlcue .txt{white-space:normal;overflow:visible;overflow-wrap:anywhere;text-overflow:clip}
body.tl-full #tlcue .ico{display:none}
body.tl-full #tlclock{
  order:2;flex:0 0 auto;width:100%;
  flex-direction:row;align-items:baseline;justify-content:center;gap:14px;
}
body.tl-full #tlnow{font-size:min(15vh,22vw);line-height:1}
body.tl-full #tltotal{font-size:clamp(20px,5vw,34px)}
body.tl-full #tltransport{order:3;flex:0 0 auto;width:100%;justify-content:center;gap:12px}
body.tl-full .tl-btn{width:78px;height:64px}
body.tl-full .tl-btn svg{width:26px;height:26px}
/* the section rows are the strip's own panel; the wall clock has no room for
   them and no reason to hold them */
body.tl-full #tleditbtn{display:none}
body.tl-full #tltrack{flex:0 0 auto;height:56px}
/* the way out sits in the corner every full-screen view is closed from, clear
   of the label that also toggles the mode */
#tlfullexit{
  display:none;position:absolute;z-index:2;
  top:calc(env(safe-area-inset-top,0px) + 10px);
  right:calc(env(safe-area-inset-right,0px) + 12px);
  width:48px;height:48px;align-items:center;justify-content:center;
  border:1px solid var(--line);border-radius:8px;background:var(--panel);
}
#tlfullexit svg{width:20px;height:20px;display:block;fill:var(--fg2)}
#tlfullexit:active{background:var(--acc-dim)}
body.tl-full #tlfullexit{display:flex}

/* ---------- modal / hue ---------- */
#scrim{position:fixed;inset:0;z-index:50;display:none;background:rgba(0,0,0,.6)}
#scrim.show{display:block}
#huepop{
  position:fixed;z-index:60;display:none;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;
  flex-direction:column;align-items:center;gap:8px;
}
#huepop.show{display:flex}
#huecanvas{touch-action:none;display:block}
#hueinfo{font-size:17px;color:var(--fg2);letter-spacing:.04em;line-height:1.3;max-width:220px;text-align:center}


/* ---------- saves ----------
   One entry is a whole room's worth of content, so the panel is a list of
   entries and three verbs, nothing else. It reuses #scrim, exactly as the hue
   wheel does. */
#roomstrip .rs-btns{display:flex;gap:6px;flex:0 0 auto}
#savebtn{font-size:16px;color:var(--fg2);border:1px solid var(--line);border-radius:6px;
  padding:0 14px;min-height:44px;line-height:1.2}
#savebtn:active{background:var(--panel)}
#savepop{
  position:fixed;z-index:60;display:none;
  left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(92vw,420px);max-height:82vh;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;
  flex-direction:column;gap:10px;
}
#savepop.show{display:flex}
#savetitle{font-size:20px;letter-spacing:.12em;color:var(--fg2);line-height:1.2}
#saverow{display:flex;gap:6px;flex:0 0 auto}
#savename{
  flex:1 1 auto;min-width:0;min-height:48px;padding:0 10px;
  font-size:18px;line-height:1.2;color:var(--fg);
  background:var(--bg-elev);border:1px solid var(--line);border-radius:8px;
}
#savename:focus{outline:none;border-color:var(--acc)}
#savedo{
  flex:0 0 auto;min-height:48px;padding:0 16px;font-size:18px;line-height:1.2;
  color:var(--acc);background:var(--bg-elev);border:1px solid var(--acc-dim);border-radius:8px;
}
#savemsg{font-size:16px;color:var(--acc);line-height:1.2;min-height:19px}
#saveempty{font-size:17px;color:var(--fg3);line-height:1.35;padding:2px}
#savelist{
  flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;display:flex;flex-direction:column;gap:8px;
}
.saverow{display:flex;flex-direction:column;gap:6px;flex:0 0 auto;
  padding-bottom:8px;border-bottom:1px solid var(--line)}
.saverow:last-child{border-bottom:none;padding-bottom:0}
.saverow .nm{font-size:19px;color:var(--fg);line-height:1.2;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.saverow .at{font-size:14px;color:var(--fg3);line-height:1.2}
.saverow .btns{display:flex;gap:6px}
.saverow .btns button{
  flex:1 1 0;min-height:44px;font-size:16px;line-height:1.2;color:var(--fg2);
  background:var(--bg-elev);border:1px solid var(--line);border-radius:8px;
}
.saverow .btns .ld{color:var(--acc);border-color:var(--acc-dim)}
.saverow .btns .dl{color:var(--warn);border-color:#4a2320}
/* armed = one tap in, waiting for the second. Nothing here is undoable, and a
   native confirm() would blank the screen mid-set. */
.saverow .btns button.armed{border-color:var(--acc);color:var(--acc);background:var(--acc-dim)}
#savefile{display:flex;gap:6px;flex:0 0 auto}
#savefile button{
  flex:1 1 0;min-height:44px;font-size:16px;line-height:1.2;color:var(--fg2);
  background:var(--bg-elev);border:1px solid var(--line);border-radius:8px;
}
#saveclose{
  flex:0 0 auto;min-height:48px;font-size:18px;line-height:1.2;color:var(--fg2);
  background:var(--bg-elev);border:1px solid var(--line);border-radius:8px;
}

.seg{display:flex;gap:6px}
.seg button{
  flex:1 1 0;min-height:44px;border:1px solid var(--line);border-radius:8px;
  background:var(--bg-elev);font-size:18px;color:var(--fg2);line-height:1.2;
}
.seg button.on{border-color:var(--acc);color:var(--acc)}

/* ---------- inline cell edit (edit mode) ----------
   the cell itself turns into one row: name field + done + delete. No modal, no
   nested option panels — the only thing a user cell carries now is its text. */
.cellform{grid-column:1 / -1;display:flex;gap:6px;align-items:stretch}
.cellform input{
  flex:1 1 auto;min-width:0;min-height:48px;font-size:18px;color:var(--fg);
  background:var(--bg-elev);border:1px solid var(--acc-dim);border-radius:10px;
  padding:8px 10px;line-height:1.2;
}
.cellform input:focus{outline:none;border-color:var(--acc)}
.cellform button{
  flex:0 0 auto;min-height:48px;min-width:64px;padding:0 12px;
  border:1px solid var(--line);border-radius:10px;background:var(--panel);
  font-size:17px;line-height:1.2;color:var(--fg2);
}
.cellform .cf-ok{background:var(--acc);color:#121212;border-color:var(--acc)}
.cellform .cf-del{color:var(--warn);border-color:#4a2320}
.hidden{display:none !important}
</style>
</head>
<body>

<div id="app">
  <div id="topbar">
    <div id="wordmark">SESSION GUIDE — MADZINE · v260902</div>
    <div id="topright">
      <div id="connstate"></div>
      <button class="hue-btn" id="huebtn">HUE</button>
    </div>
  </div>

  <!-- HOME -->
  <div class="screen show" id="home">
    <div class="brand">
      <div class="t">Session Guide</div>

function normLang(v){
  if(!v) return null;
  v = String(v).toLowerCase();
  if(v.indexOf("zh")===0) return "zh-TW";
  if(v.indexOf("ja")===0 || v.indexOf("jp")===0) return "ja";
  if(v.indexOf("en")===0) return "en";
  return null;
}
function initLang(){
  var q = null;
  try{
    var m = /[?&]lang=([^&]+)/.exec(window.location.search);
    if(m) q = normLang(decodeURIComponent(m[1]));
  }catch(err){}
  if(q){ try{ localStorage.setItem("sg_lang", q); }catch(e2){} return q; }
  var stored = null;
  try{ stored = normLang(localStorage.getItem("sg_lang")); }catch(e3){}
  if(stored) return stored;
  return normLang(navigator.language || (navigator.languages||[])[0]) || "en";
}
var lang = initLang();

/* t(key, value) — {n} and {label} are both replaced by value */
function t(k, v){
  var dict = I18N[lang] || I18N.en;
  var s = dict[k];
  if(s === undefined) s = I18N.en[k];
  if(s === undefined) return k;
  return (v === undefined) ? s : s.replace(/\{n\}|\{label\}/g, v);
}
/* tf(key, {n:.., a:.., b:..}) — sentence templates carry the word order of each
   language, so a clause is never assembled by concatenating fragments. */
function tf(k, map){
  var dict = I18N[lang] || I18N.en;
  var s = dict[k];
  if(s === undefined) s = I18N.en[k];
  if(s === undefined) return k;
  return s.replace(/\{(n|a|b)\}/g, function(_, g){
    return (map && map[g] !== undefined && map[g] !== null) ? String(map[g]) : "";
  });
}

/* =========================================================
   HUE THEME  (HSB, hue 0..1, saturation multiplier 0..2)
   Ported from AnyAni src/hue.rs compute_accent_colors:
   accent  S x 1.000 B 0.92
   dim     S x 0.500 B 0.60
   glow    S x 1.333 B 1.00
   Backgrounds are pure grey (chroma 0), never tinted.
   ========================================================= */
var BASE_S = 0.54;               // coral pink reference saturation
var DEFAULT_HUE = 12/360;        // MADZINE brand H=12
var DEFAULT_SAT = 1.0;           // multiplier

var hue = readNum("sg_hue", DEFAULT_HUE);
var satMul = readNum("sg_sat", DEFAULT_SAT);

function readNum(k, d){
  var v = parseFloat(localStorage.getItem(k));
  return isFinite(v) ? v : d;
}
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }

function hsb(h,s,b){
  h = ((h % 1) + 1) % 1;
  s = clamp(s,0,1); b = clamp(b,0,1);
  var i = Math.floor(h*6), f = h*6 - i;
  var p = b*(1-s), q = b*(1-s*f), t = b*(1-s*(1-f));
  var r,g,bl;
  switch(i%6){
    case 0: r=b; g=t; bl=p; break;
    case 1: r=q; g=b; bl=p; break;
    case 2: r=p; g=b; bl=t; break;
    case 3: r=p; g=q; bl=b; break;
    case 4: r=t; g=p; bl=b; break;
    default: r=b; g=p; bl=q; break;
  }
  return "rgb("+Math.round(r*255)+","+Math.round(g*255)+","+Math.round(bl*255)+")";
}
function applyTheme(){
  var s = BASE_S * satMul;
  var root = document.documentElement.style;
  root.setProperty("--acc",      hsb(hue, s*1.000, 0.92));
  root.setProperty("--acc-dim",  hsb(hue, s*0.500, 0.60));
  root.setProperty("--acc-glow", hsb(hue, s*1.333, 1.00));
  var m = document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute("content","#121212");
  drawWheel();
  /* sections now own both hue and saturation, so turning the global wheel does
     not change a single pixel of the strip. The repaint stays anyway: the strip
     also carries --acc-tinted chrome around the sections, and one cheap style
     write per drag frame is a far smaller cost than a stale set list. */
  tlRepaint();
}

/* ---------- HUE wheel canvas ----------
   One wheel, one canvas, one set of handlers — what changes is the TARGET it
   writes to. hueSeg === null means the global theme; otherwise it is a single
   timeline section, which owns an absolute hue of its own. Duplicating the
   wheel for the second case would mean two copies of the ring maths to keep in
   step, so the target is a variable instead.

   A section owns BOTH numbers now: its own hue and its own saturation. So the
   wheel is the same instrument in both modes — ring writes hue, centre writes
   saturation — and only the object being written changes. */
var hueSeg = null;
function hueValue(){ return hueSeg ? hueSeg.h : hue; }
/* saturation of whatever the wheel is pointed at, as a multiplier of BASE_S */
function hueSatValue(){ return hueSeg ? hueSeg.s : satMul; }
var hueCanvas = document.getElementById("huecanvas");
var hctx = hueCanvas.getContext("2d");
var HC = 220, HR_OUT = 104, HR_IN = 64;   // css px
function drawWheel(){
  var d = 2; // retina scale (canvas is 440 for 220 css px)
  hctx.setTransform(d,0,0,d,0,0);
  hctx.clearRect(0,0,HC,HC);
  var cx = HC/2, cy = HC/2;
  var segs = 360, step = Math.PI*2/segs;
  var s = clamp(BASE_S*hueSatValue(),0,1);
  for(var i=0;i<segs;i++){
    var a0 = i*step - Math.PI/2;
    var a1 = a0 + step + 0.012;
    hctx.beginPath();
    hctx.arc(cx,cy,HR_OUT,a0,a1,false);
    hctx.arc(cx,cy,HR_IN,a1,a0,true);
    hctx.closePath();
    hctx.fillStyle = hsb(i/segs, 0.30, 0.92);
    hctx.fill();
  }
  // center circle = whatever colour the wheel is currently editing
  hctx.beginPath();
  hctx.arc(cx,cy,HR_IN-6,0,Math.PI*2);
  hctx.fillStyle = hsb(hueValue(), s, 0.92);
  hctx.fill();
  /* the centre is a drag control in BOTH modes: global theme saturation, or the
     saturation of the one section being edited. The affordance is therefore
     always drawn — a centre that sometimes takes a drag and sometimes does not
     is an instrument the hand cannot learn. */
  // chevrons (drawn lines, no unicode glyphs)
  hctx.strokeStyle = "rgba(0,0,0,0.70)";
  hctx.lineWidth = 2; hctx.lineCap = "round"; hctx.lineJoin = "round";
  var w = 13, yTop = cy-26, yBot = cy+26;
  hctx.beginPath();
  hctx.moveTo(cx-w, yTop+7); hctx.lineTo(cx, yTop); hctx.lineTo(cx+w, yTop+7);
  hctx.moveTo(cx-w, yBot-7); hctx.lineTo(cx, yBot); hctx.lineTo(cx+w, yBot-7);
  hctx.stroke();
  hctx.fillStyle = "rgba(0,0,0,0.70)";
  hctx.font = '300 15px "Barlow Condensed", sans-serif';
  hctx.textAlign = "center"; hctx.textBaseline = "middle";
  hctx.fillText("SATURATION", cx, cy);
  // hue marker: white solid dot + dark shadow
  var ang = hueValue()*Math.PI*2 - Math.PI/2;
  var mr = (HR_OUT+HR_IN)/2;
  var mx = cx + Math.cos(ang)*mr, my = cy + Math.sin(ang)*mr;
  hctx.beginPath(); hctx.arc(mx+1,my+1,9,0,Math.PI*2);
  hctx.fillStyle = "rgba(0,0,0,0.45)"; hctx.fill();
  hctx.beginPath(); hctx.arc(mx,my,8,0,Math.PI*2);
  hctx.fillStyle = "#ffffff"; hctx.fill();
}

var hueZone = 0; // 0 none, 1 ring, 2 center
var lastY = 0;
function huePos(e){
  var r = hueCanvas.getBoundingClientRect();
  var p = (e.touches && e.touches[0]) ? e.touches[0] : e;
  return { x:p.clientX - r.left - HC/2, y:p.clientY - r.top - HC/2, cy:p.clientY };
}
function hueDown(e){
  e.preventDefault();
  var p = huePos(e), d = Math.sqrt(p.x*p.x+p.y*p.y);
  hueZone = d > HR_IN-6 ? 1 : 2;   // same two zones whatever the wheel is editing
  lastY = p.cy;
  if(hueZone===1) hueMove(e); else e.stopPropagation();
}
function hueMove(e){
  if(!hueZone) return;
  e.preventDefault();
  var p = huePos(e);
  if(hueZone===1){
    var a = Math.atan2(p.y,p.x) + Math.PI/2;
    var h = ((a/(Math.PI*2))%1+1)%1;
    if(hueSeg){
      hueSeg.h = h;
      drawWheel(); tlRepaint();       // only the strip moves, the theme stays put
      return;
    }
    hue = h;
  }else{
    var dy = p.cy - lastY;
    lastY = p.cy;
    /* in section mode this must NOT touch satMul, sg_sat or --acc: the point of
       a per-section colour is that retinting one block of the set leaves the
       app, and every other block, exactly where it was */
    if(hueSeg){
      var cur = isFinite(hueSeg.s) ? hueSeg.s : satMul;   // never drag off undefined
      hueSeg.s = clamp(cur - dy*0.01, 0, TL_SAT_MAX);
      drawWheel(); tlRepaint();
      return;
    }
    satMul = clamp(satMul - dy*0.01, 0, 2);
  }
  applyTheme();
}
function hueUp(){
  if(!hueZone) return;
  if(hueSeg) saveTimeline();
  else if(hueZone===1) localStorage.setItem("sg_hue", String(hue));
  else localStorage.setItem("sg_sat", String(satMul));
  hueZone = 0;
}
hueCanvas.addEventListener("pointerdown", function(e){
  try{ hueCanvas.setPointerCapture(e.pointerId); }catch(err){}   // capture is an optimisation, not a precondition
  hueDown(e);
});
hueCanvas.addEventListener("pointermove", hueMove);
hueCanvas.addEventListener("pointerup", hueUp);
hueCanvas.addEventListener("pointercancel", hueUp);

var huebtn = document.getElementById("huebtn");
var huepop = document.getElementById("huepop");
var scrim  = document.getElementById("scrim");
/* anchor is whatever was tapped: the header button (global theme) or a section
   swatch (that section only). seg === null keeps the old behaviour exactly. */
function openHue(anchor, seg){
  hueSeg = seg || null;
  var info = document.getElementById("hueinfo");
  /* the key is written back onto the element so a language change while the
     wheel is open still lands on the right hint */
  info.setAttribute("data-i18n", hueSeg ? "hue_hint_seg" : "hue_hint");
  info.textContent = t(hueSeg ? "hue_hint_seg" : "hue_hint");
  huepop.classList.add("show");
  if(!hueSeg) huebtn.classList.add("on");
  scrim.classList.add("show");
  /* measured after .show, because the popup only has a box once it is laid out
     — a section swatch sits low on a 390x844 screen and the wheel has to flip
     above it rather than run off the bottom */
  var r = anchor.getBoundingClientRect();
  var w = huepop.offsetWidth, h = huepop.offsetHeight;
  var left = clamp(hueSeg ? r.left : r.right - w, 8, Math.max(8, window.innerWidth - w - 8));
  var top  = r.bottom + 8;
  if(top + h > window.innerHeight - 8) top = r.top - 8 - h;
  huepop.style.left = left+"px";

}
function closeHue(){
  huepop.classList.remove("show");
  huebtn.classList.remove("on");

}
huebtn.addEventListener("click", function(e){
  e.stopPropagation();
  if(huepop.classList.contains("show") && !hueSeg) closeHue();
  else openHue(huebtn, null);
