var actx = null;
function initAudio(){
  if(actx) { if(actx.state==="suspended") actx.resume(); return; }
  var AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return;
  actx = new AC();
  if(actx.state==="suspended") actx.resume();
}
function click(when, strong){
  if(!actx) return;
  var o = actx.createOscillator(), g = actx.createGain();
  o.type = "square";
  o.frequency.value = strong ? 1600 : 900;
  g.gain.setValueAtTime(0.0001, when);
  g.gain.exponentialRampToValueAtTime(strong?0.32:0.16, when+0.002);
  g.gain.exponentialRampToValueAtTime(0.0001, when+0.045);
  o.connect(g); g.connect(actx.destination);
  o.start(when); o.stop(when+0.06);
}

/* =========================================================
   CELLS / GRID
   ========================================================= */
var gridTime  = document.getElementById("gridtime");
var gridMode  = document.getElementById("gridmode");
var gridActs  = document.getElementById("gridacts");
var gridDyn   = document.getElementById("griddyn");
var gridTdir  = document.getElementById("gridtdir");
var gridTempo = document.getElementById("gridtempo");

function bindCell(b, id, onTap){
  var lpTimer=null, moved=false;
  b.addEventListener("pointerdown", function(){
    moved = false;
    /* long press is a shortcut into edit mode for that one cell; only user
       cells pass an id, so a fixed cell can never be reached this way */
    lpTimer = setTimeout(function(){ lpTimer=null; if(id && isHost()) startCellEdit(id); }, 600);
  });
  b.addEventListener("pointermove", function(){ moved = true; });
  b.addEventListener("pointerup", function(){
    if(lpTimer){ clearTimeout(lpTimer); lpTimer=null; if(!moved) onTap(); }
  });
  b.addEventListener("pointercancel", function(){ clearTimeout(lpTimer); lpTimer=null; });
}
function gridOf(c){
  if(c.kind === "time") return gridTime;
  if(c.kind === "mode") return gridMode;
  if(c.kind === "tdir") return gridTdir;
  if(c.fixed === "dyn")   return gridDyn;
  if(c.fixed === "tempo") return gridTempo;
  return gridActs;
}
/* the cell being renamed is replaced in place by one input + done + delete */
var focusEditInput = false;
function cellForm(c){
  var wrap = document.createElement("div");
  wrap.className = "cellform";
  var isTime = c.kind === "time";
  var inp = document.createElement("input");
  inp.type = "text";
  inp.maxLength = isTime ? 2 : 12;
  inp.autocomplete = "off"; inp.spellcheck = false;
  if(isTime){
    inp.inputMode = "numeric";
    inp.value = String(clamp(parseInt(c.n,10)||4,1,64));
  }else{
    inp.value = c.label || "";
  }
  inp.placeholder = t(isTime ? "cell_bars_ph" : "cell_name_ph");
  inp.addEventListener("keydown", function(e){
    if(e.key === "Enter") commitCellEdit(c.id, inp.value);
  });
  var ok = document.createElement("button");
  ok.className = "cf-ok"; ok.textContent = t("cell_done");
  ok.addEventListener("click", function(){ commitCellEdit(c.id, inp.value); });
  var del = document.createElement("button");
  del.className = "cf-del"; del.textContent = t("cell_delete");
  del.addEventListener("click", function(){ deleteCell(c.id); });
  wrap.appendChild(inp); wrap.appendChild(ok); wrap.appendChild(del);
  return wrap;
}
function renderCell(c){
  var grid = gridOf(c);
  if(S.editMode && isHost() && S.editId === c.id && isUserCell(c)){
    grid.appendChild(cellForm(c));
    focusEditInput = true;
    return;
  }
  var kind = (c.kind === "time" || c.kind === "mode" || c.kind === "tdir") ? c.kind : "act";
  var b = document.createElement("button");
  b.className = "cell " + kind + (c.fixed ? " " + (c.fixed === "dyn" ? "dyn" : "tmp") : "");
  /* mode, tempo direction and the two fixed groups are structural: only user
     cells ever enter the editable set */
  if(S.editMode && isUserCell(c)) b.className += " editing";
  if(isPicked(c)) b.className += " sel";
  var lab = document.createElement("div");
  lab.className = "lab"; lab.textContent = cellText(c);
  b.appendChild(lab);
  /* the badge counts actions, not sentence slots: the locked one is 1, the
     round in progress is 2 once something is locked and 1 before that */
  if(kind === "act" && (S.cmp.actId === c.id || S.cmp.lockedActId === c.id)){
    var nums = [];
    if(S.cmp.lockedActId === c.id) nums.push("1");
    if(S.cmp.actId === c.id) nums.push(S.cmp.lockedActId ? "2" : "1");
    var sl = document.createElement("div");
    sl.className = "slot";
    sl.textContent = nums.join(" ");
    b.appendChild(sl);
  }
  bindCell(b, isUserCell(c) ? c.id : null, function(){ cellTap(c); });
  grid.appendChild(b);
}
function renderGrid(){
  gridTime.innerHTML = ""; gridMode.innerHTML = ""; gridActs.innerHTML = "";
  gridDyn.innerHTML = ""; gridTdir.innerHTML = ""; gridTempo.innerHTML = "";
  focusEditInput = false;
  S.cells.forEach(renderCell);
  FIXED_CELLS.forEach(renderCell);
  if(S.editMode){
    gridTime.appendChild(addButton("time"));
    gridActs.appendChild(addButton("act"));
  }
  if(focusEditInput){
    var inp = document.querySelector(".cellform input");
    if(inp){ try{ inp.focus(); inp.select(); }catch(err){} }
  }
  renderCompose();
}
function isPicked(c){
  if(c.kind === "time") return S.cmp.timeId === c.id;
  if(c.kind === "mode") return S.cmp.modeId === c.id;
  /* the direction row shows the round in progress; the locked segment keeps
     its own direction internally and is shown through the sentence line */
  if(c.kind === "tdir") return S.cmp.tdirId === c.id;
  return S.cmp.actId === c.id || S.cmp.lockedActId === c.id;
}
function addButton(kind){
  var b = document.createElement("button");
  b.className = "cell addc " + kind;
  b.textContent = t(kind === "time" ? "add_time" : "add_act");
  b.addEventListener("click", function(){ addCell(kind); });
  return b;
}
function addCell(kind){
  var c = (kind === "time")
    ? {id:"t"+Date.now(), kind:"time", n:4}
    : {id:"a"+Date.now(), kind:"act", label:t("new_act_label"), fx:"none"};
  S.cells.push(c); saveCells();
  S.editId = c.id;
  renderGrid();
}
/* ---------- inline cell edit ---------- */
function startCellEdit(id){
  if(!isHost()) return;                        // cell editing is host-only
  var c = cellById(id);
  if(!isUserCell(c)) return;
  if(!S.editMode) setEditMode(true);
  S.editId = id;
  clearCompose();
  renderGrid();
}
function commitCellEdit(id, val){
  var c = cellById(id);
  if(isUserCell(c)){
    if(c.kind === "time"){
      c.n = clamp(parseInt(val,10)||4, 1, 64);
      delete c.label;                          // bars cells follow the language
    }else{
      c.label = String(val).trim().slice(0,12) || c.label || t("new_act_label");
      c.fx = "none";
    }
    saveCells();
  }
  S.editId = null;
  clearCompose();                              // an edited cell may be in the sentence
  renderGrid();
}
function deleteCell(id){
  S.cells = S.cells.filter(function(x){ return x.id !== id; });
  saveCells();
  S.editId = null;
  clearCompose();
  renderGrid();
}

/* =========================================================
   SENTENCE COMPOSITION  (nothing is broadcast before START)
   ========================================================= */
function clearCompose(){
  S.cmp = {timeId:null, modeId:null, actId:null, tdirId:null,
           lockedActId:null, lockedTdirId:null};
  S.warnKey = null; S.warnUntil = 0;
}
function warn(key){
  S.warnKey = key; S.warnUntil = now() + 3000;
  renderCompose();
}
function cellTap(c){
  if(S.editMode && isHost()){ if(isUserCell(c)) startCellEdit(c.id); return; }
  if(!canCue()) return;
  S.warnKey = null;
  if(c.kind === "time" || c.kind === "mode"){
    /* a locked second action only exists under "gradual over N bars"; letting
       either of those two slots change now would strand it in a combination the
       engine cannot run, so they freeze until the sentence is cleared */
    if(S.cmp.lockedActId){ warn("warn_locked_gradual"); return; }
    if(c.kind === "time") S.cmp.timeId = (S.cmp.timeId === c.id) ? null : c.id;
    else                  S.cmp.modeId = (S.cmp.modeId === c.id) ? null : c.id;
  }else if(c.kind === "tdir"){
    S.cmp.tdirId = (S.cmp.tdirId === c.id) ? null : c.id;
  }else{
    /* one round holds one action: any action cell REPLACES the round's pick.
       A second action is only ever added through the explicit button, so an
       intensity tap can never be silently pushed into the "then" clause. */
    S.cmp.actId = (S.cmp.actId === c.id) ? null : c.id;        // tap again = cancel
  }
  renderGrid();
}
/* ---------- the second action ----------
   The engine takes exactly two segments (cmd + cmd.next), so the button locks
   the round in progress and is refused once a segment is already locked.

   A second action is only offered under "gradual over N bars". The other two
   shapes cannot carry one: the first segment is an instant event and the second
   fires in the same frame, so both cues race for the same full-screen flash and
   only the second one is ever seen. A gradual first segment is a stretch of time
   with the second action landing on its end — the two never collide. */
function canAddNext(){ return !!S.cmp.actId && !S.cmp.lockedActId; }
function addNextAct(){
  if(!canAddNext()) return;
  var a = cmpAct();
  if(a && a.fixed === "tempo" && !S.cmp.tdirId){ warn("warn_need_tempo_dir"); return; }
  /* the button stays pressable so this can explain itself; a dead button would
     leave the reason invisible */
  if(!isGradual() || !S.cmp.timeId){ warn("warn_next_gradual_only"); return; }
  S.cmp.lockedActId  = S.cmp.actId;
  S.cmp.lockedTdirId = S.cmp.tdirId;
  S.cmp.actId = null; S.cmp.tdirId = null;      // a fresh round picks segment 2
  S.warnKey = null;
  renderGrid();
}
function cmpTime(){  return S.cmp.timeId ? cellById(S.cmp.timeId) : null; }
function cmpMode(){  return S.cmp.modeId ? cellById(S.cmp.modeId) : null; }
function cmpAct(){   return S.cmp.actId  ? cellById(S.cmp.actId)  : null; }
/* the two segments in sending order: the locked pair first, the round in
   progress second. Before anything is locked the round IS the first segment. */
function seg1Act(){  return S.cmp.lockedActId ? cellById(S.cmp.lockedActId) : cmpAct(); }
function seg1Tdir(){ return S.cmp.lockedActId ? S.cmp.lockedTdirId : S.cmp.tdirId; }
function seg2Act(){  return S.cmp.lockedActId ? cmpAct() : null; }
function seg2Tdir(){ return S.cmp.tdirId; }
function isGradual(){ var m = cmpMode(); return !!m && m.mode === "gradual"; }
function barsOf(c){ return clamp(parseInt(c && c.n,10) || 4, 1, 64); }

/* the sentence as one readable line, assembled from per-language templates */
function sentenceText(){
  var a1 = seg1Act();
  if(!a1) return "";
  var lab1 = actLabel(a1, seg1Tdir());
  var tc = cmpTime(), s;
  if(!tc)              s = tf("sent_now",   {a:lab1});
  else if(isGradual()) s = tf("sent_grad",  {n:barsOf(tc), a:lab1});
  else                 s = tf("sent_after", {n:barsOf(tc), a:lab1});
  /* once a segment is locked the line reads in its unfinished form, so the
     placeholder shows exactly where the second action will land */
  if(S.cmp.lockedActId){
    var a2 = seg2Act();
    s = tf("sent_then", {a:s, b: a2 ? actLabel(a2, seg2Tdir()) : t("sent_pending")});
  }
  return s;
}
/* a tempo cell carries a ratio applied to the tempo in force when it lands;
   everything else is display only and rides as fx "none" with ratio 1 */
function actPayload(c, tdirId){
  if(c.fixed === "tempo"){
    var down = dirDownOf(tdirId);
    return {label:actLabel(c, tdirId), fx:"tempo",
            dir:down ? "down" : "up", ratio:(down ? c.down : c.up)};
  }
  return {label:actLabel(c, tdirId), fx:"none", dir:"up", ratio:1};
}
function renderCompose(){
  var bar  = document.getElementById("composebar");
  var line = document.getElementById("sentence");
  var btn  = document.getElementById("startbtn");
  var nb   = document.getElementById("nextbtn");
  bar.classList.toggle("hidden", !canCue());
  btn.textContent = t("start");
  /* a locked segment with nothing picked yet is an unfinished sentence: the
     line already shows it, but it cannot be sent */
  var hasFirst = !!seg1Act();
  var pending  = !!S.cmp.lockedActId && !S.cmp.actId;
  var ready    = hasFirst && !pending;
  btn.classList.toggle("off", !ready);
  btn.disabled = !ready;
  /* a tempo amount without a direction stays clickable so warn() can explain */
  var canNext = canAddNext();
  nb.classList.toggle("off", !canNext);
  nb.disabled = !canNext;
  var msg = S.warnKey ? t(S.warnKey) : (hasFirst ? sentenceText() : t("hint_pick_act"));
  line.classList.toggle("warn", !!S.warnKey);
  line.classList.toggle("dim", !S.warnKey && !ready);
  if(line.textContent !== msg) line.textContent = msg;
}
/* START is the only path out of this device */
function sendSentence(){
  var a1 = seg1Act(), d1 = seg1Tdir();
  var a2 = seg2Act(), d2 = seg2Tdir();
  if(!a1){ warn("hint_pick_act"); return; }
  if(S.cmp.lockedActId && !a2){ warn("sent_pending"); return; }
  var tc = cmpTime();
  if(isGradual() && !tc){ warn("warn_need_bars"); return; }   // gradual needs a duration
  if(a2 && (!isGradual() || !tc)){ warn("warn_next_gradual_only"); return; }
  /* each segment answers for its own direction */
  if(a1.fixed === "tempo" && !d1){ warn("warn_need_tempo_dir"); return; }
  if(a2 && a2.fixed === "tempo" && !d2){ warn("warn_need_tempo_dir"); return; }
  var cmd = actPayload(a1, d1);
  cmd.mode = !tc ? "now" : (isGradual() ? "gradual" : "after");
  cmd.n    = tc ? barsOf(tc) : 0;
  cmd.next = a2 ? actPayload(a2, d2) : null;
  if(!isHost() && (cmd.fx === "tempo" || (cmd.next && cmd.next.fx === "tempo"))){
    warn("tempo_host_only"); return;
  }
  if(runCmd(cmd, "", false) === false){ warn("tempo_host_only"); return; }
  clearCompose();
  renderGrid();
}
document.getElementById("startbtn").addEventListener("click", sendSentence);
document.getElementById("nextbtn").addEventListener("click", addNextAct);
document.getElementById("clearbtn").addEventListener("click", function(){
  clearCompose(); renderGrid();
});
function setEditMode(v){
  S.editMode = !!v;
  var b = document.getElementById("editbtn");
  b.classList.toggle("on", S.editMode);
  b.textContent = t(S.editMode ? "edit_off" : "edit_on");
  if(!S.editMode) S.editId = null;
  clearCompose();
}
document.getElementById("editbtn").addEventListener("click", function(){
  if(!isHost()) return;                        // cell editing is host-only
  setEditMode(!S.editMode);
  renderGrid();
});

/* =========================================================
   CUES / COUNTDOWN
   ========================================================= */
/* ---------------------------------------------------------
   Authority model
   The host owns every timestamp. A conductor that is not the host sends a
   request without any timestamp and the host stamps it on arrival.
   Chosen over "sender converts with its own clockOffset" because the host
   must snap countdowns to its own bar grid anyway (startCountdown reads
   S.metroStart, which lives in host time), so a client-supplied startAt
   would be recomputed and any offset error would only add jitter.
   --------------------------------------------------------- */
function onCueRequest(m, from){
  if(!isHost()) return;
  if(m.k==="cmd" && m.cmd) runCmd(sanitizeCmd(m.cmd), from, true);
  else if(m.k==="cancelcount") cancelCountdown();
  else if(m.k==="cancelramp")  cancelRamp();
}
/* ratio, not a percentage: a tempo cue can be x2 / x3 / x4 as well as +-10..30% */
function sanitizeRatio(v){
  var r = parseFloat(v);
  return (isFinite(r) && r > 0) ? clamp(r, 0.1, 10) : 1;
}
function sanitizeAct(c){
  if(!c) return null;
  return {
    label:String(c.label || "").slice(0,24),
    fx:   (c.fx==="tempo") ? "tempo" : "none",
    dir:  c.dir==="down" ? "down" : "up",
    ratio:sanitizeRatio(c.ratio)
  };
}
function sanitizeCmd(c){
  var out = sanitizeAct(c);
  out.mode = (c.mode==="gradual" || c.mode==="after") ? c.mode : "now";
  out.n    = clamp(parseInt(c.n,10) || 4, 1, 64);
  /* slot 4 carries no time of its own, and only a gradual first segment can hold
     one at all — an older build or a tampered payload gets it stripped here
     rather than reaching the two-cues-in-one-frame path */
  out.next = (out.mode === "gradual" && c.next) ? sanitizeAct(c.next) : null;
  return out;
}
/* returns false when refused, true when accepted */
function runCmd(cmd, from, remote){
  var wantsTempo = cmd.fx === "tempo" || (cmd.next && cmd.next.fx === "tempo");
  if(!isHost()){
    if(wantsTempo) return false;                 // tempo is the host's alone
    req({t:"req", k:"cmd", cmd:cmd});
    return true;
  }
  if(remote && wantsTempo) return false;
  var src = from || myName();
  if(cmd.mode === "gradual") return startGradual(cmd, src);
  if(cmd.mode === "after")   return startCountdown(cmd, src);
  fireNow(cmd, src);                             // next is null unless mode is gradual
  return true;
}
function tempoTarget(ratio, base){
  return clamp(Math.round(base * sanitizeRatio(ratio)), 30, 300);
}
function fireNow(cmd, src){
  if(cmd.fx === "tempo"){
    applyTempoJump(tempoTarget(cmd.ratio, Math.round(bpmAt(now()))));
  }
  fireCue(cmd.label, src);
}
function applyTempoJump(target){
  S.bpm = target;
  localStorage.setItem("sg_bpm", String(S.bpm));
  setConstBpm(now(), target);
  nextClickBeat = -1;
  document.getElementById("bpmval").textContent = S.bpm;
  send(stateMsg());
}
function fireCue(text, from){                    // host only, reached via runCmd
  var dur = clamp(Math.round(barDur()*2), 3500, 6000);
  var src = from || myName();
  send({t:"flash", text:text, dur:dur, from:src});
  startFlash(text, dur, src);
}
/* restarts the opening attention animation even if the class is already set:
   remove, force a reflow, re-add — otherwise back-to-back cues only flash once */
function introFlash(ov){
  ov.classList.remove("intro");
  void ov.offsetWidth;
  ov.classList.add("intro");
}
/* the cue must be readable across a dark room, so it is grown until it nearly
   fills the screen: start at the cap, take one proportional guess from the
   measured box, then bisect a few times because wrapping changes the ratio */
var FLASH_MIN_FS = 12;                       // px, floor for pathologically long cues
function flashBox(){
  var vw = window.innerWidth, vh = window.innerHeight;
  return {w: vw*0.92, h: vh*0.78, cap: Math.min(vh*0.75, vw*0.85)};
}
function fitFlashText(){
  var el = document.getElementById("flashtxt");
  if(!el || !el.textContent) return;
  var box = flashBox();
  el.style.maxWidth = box.w + "px";
  function fitsAt(fs){
    el.style.fontSize = fs + "px";
    return el.scrollWidth <= box.w + 1 && el.scrollHeight <= box.h + 1;
  }
  if(fitsAt(box.cap)) return;                // short cues keep the full cap size
  /* proportional first guess off the overflowing box, then bisect to converge */
  var guess = box.cap * Math.min(box.w/Math.max(el.scrollWidth,1),
                                 box.h/Math.max(el.scrollHeight,1));
  var lo = FLASH_MIN_FS, hi = box.cap;
  if(guess > lo && guess < hi){ if(fitsAt(guess)) lo = guess; else hi = guess; }
  for(var i = 0; i < 10 && hi - lo > 0.5; i++){
    var mid = (lo + hi)/2;
    if(fitsAt(mid)) lo = mid; else hi = mid;
  }
  el.style.fontSize = lo + "px";
}
function startFlash(text, dur, from){
  S.flashText = text || "";
  S.flashFrom = from || "";
  S.flashUntil = now() + (dur || 2000);
  var ov = document.getElementById("ovflash");
  document.getElementById("flashtxt").textContent = S.flashText;
  document.getElementById("flashfrom").textContent = S.flashFrom;
  ov.classList.remove("fade");
  ov.classList.add("show");
  fitFlashText();                            // measure only once the overlay is laid out
  introFlash(ov);                            // pulses for the whole display time
}
function endFlash(){
  var ov = document.getElementById("ovflash");
  ov.classList.add("fade");
  setTimeout(function(){ ov.classList.remove("show"); ov.classList.remove("fade"); ov.classList.remove("intro"); }, 360);
  S.flashUntil = 0;
}

/* ---------- overlay cue labels ----------
   #countlab and #ramptxt are set as large as the countdown number, so a long cue
   would push the dots / sub / cancel rows off screen. Same shape as fitFlashText()
   (measure, one proportional guess, then bisect), but the height budget is what the
   *other* rows of that overlay actually leave: the cap comes from the stylesheet
   (so the max-height media query is respected for free) and the leftover box is
   measured live. Callers only run this when the label text changed — never per frame. */
var OVLAB_MIN_FS = 14;                       // px, matches the non-interactive floor
function fitOverlayLabel(el, ov){
  if(!el || !ov || !ov.classList.contains("show")) return;
  el.style.fontSize = "";                    // back to the stylesheet cap before measuring
  if(!el.textContent) return;
  var cap = parseFloat(getComputedStyle(el).fontSize) || 0;
  if(!cap) return;
  var ovs = getComputedStyle(ov);
  var inner = ov.clientHeight - (parseFloat(ovs.paddingTop)||0) - (parseFloat(ovs.paddingBottom)||0);
  var others = 0, reserve = 0, kids = ov.children;
  for(var i=0;i<kids.length;i++){
    var k = kids[i], ks = getComputedStyle(k);
    if(ks.display === "none") continue;
    if(ks.position === "absolute"){           // the cancel button is pinned to the bottom
      reserve = Math.max(reserve, k.offsetHeight + (parseFloat(ks.bottom)||0) + 12);
      continue;
    }
    if(k === el) continue;
    others += k.offsetHeight + (parseFloat(ks.marginTop)||0) + (parseFloat(ks.marginBottom)||0);
  }
  var els = getComputedStyle(el);
  others += (parseFloat(els.marginTop)||0) + (parseFloat(els.marginBottom)||0);
  /* the stack is vertically centred, so the free space splits evenly top and bottom:
     the block has to clear the pinned button on both sides to stay above it */
  var boxH = Math.max(OVLAB_MIN_FS*2, inner - reserve*2 - others);
  shrinkToBox(el, cap, window.innerWidth*0.92, boxH);
}
/* binary-searches the largest font size at which el still fits boxW x boxH. The
   stylesheet value is the cap — it is never exceeded, only walked down from. */
function shrinkToBox(el, cap, boxW, boxH){
  function fitsAt(fs){
    el.style.fontSize = fs + "px";
    return el.scrollWidth <= boxW+1 && el.scrollHeight <= boxH+1;
  }
  if(fitsAt(cap)){ el.style.fontSize = ""; return; }   // short text keeps the full cap
  var guess = cap * Math.min(boxW/Math.max(el.scrollWidth,1),
                             boxH/Math.max(el.scrollHeight,1));
  var lo = OVLAB_MIN_FS, hi = cap;
  if(guess > lo && guess < hi){ if(fitsAt(guess)) lo = guess; else hi = guess; }
  for(var b = 0; b < 10 && hi - lo > 0.5; b++){
    var mid = (lo + hi)/2;
    if(fitsAt(mid)) lo = mid; else hi = mid;
  }
  el.style.fontSize = lo + "px";
}
/* Slot 4 is display type, but it is a preview of what comes after the cue — so it
   must never outrank the cue itself. Two rules, in this order:
     1. it may take at most half of the height the cue and it have to split, so a
        long "then <label>" cannot starve the cue down to OVLAB_MIN_FS;
     2. after the cue has been fitted, it is clamped to the cue's own size, so the
        type hierarchy holds even when the cue was shrunk by its own long text.
   The share is measured against what is left after the fixed rows and the cancel
   reserve, not the raw overlay height, so it degrades with the viewport. */
var NEXTLINE_MAX_SHARE = 0.5;
function nextLineBox(el, ov, labEl){
  var ovs = getComputedStyle(ov);
  var inner = ov.clientHeight - (parseFloat(ovs.paddingTop)||0) - (parseFloat(ovs.paddingBottom)||0);
  var others = 0, reserve = 0, kids = ov.children;
  for(var i=0;i<kids.length;i++){
    var k = kids[i], ks = getComputedStyle(k);
    if(ks.display === "none") continue;
    if(ks.position === "absolute"){          // the cancel button is pinned to the bottom
      reserve = Math.max(reserve, k.offsetHeight + (parseFloat(ks.bottom)||0) + 12);
      continue;
    }
    if(k === el || k === labEl) continue;    // the two that share what is left
    others += k.offsetHeight + (parseFloat(ks.marginTop)||0) + (parseFloat(ks.marginBottom)||0);
  }
  var els = getComputedStyle(el);
  others += (parseFloat(els.marginTop)||0) + (parseFloat(els.marginBottom)||0);
  return Math.max(OVLAB_MIN_FS*2, (inner - reserve*2 - others)*NEXTLINE_MAX_SHARE);
}
/* fits the slot-4 line and the cue together — always call this rather than
   fitOverlayLabel() alone when the overlay has a .nextline */
function fitOverlayPair(labEl, nxEl, ov){
  if(!ov || !ov.classList.contains("show")) return;
  var live = nxEl && nxEl.classList.contains("on") && nxEl.textContent;
  if(!live){
    if(nxEl) nxEl.style.fontSize = "";
    fitOverlayLabel(labEl, ov);
    return;
  }
  nxEl.style.fontSize = "";
  var cap = parseFloat(getComputedStyle(nxEl).fontSize) || 0;
  var boxW = window.innerWidth*0.92;
  if(cap) shrinkToBox(nxEl, cap, boxW, nextLineBox(nxEl, ov, labEl));
  fitOverlayLabel(labEl, ov);
  /* rule 2: the preview never ends up larger than the cue it previews */
  var labFs = parseFloat(getComputedStyle(labEl).fontSize) || 0;
  var nxFs  = parseFloat(getComputedStyle(nxEl).fontSize) || 0;
  if(labFs && nxFs > labFs){
    /* set outright rather than re-running shrinkToBox: this size is strictly
       smaller than the one that already fit, so it cannot overflow either axis */
    nxEl.style.fontSize = labFs + "px";
    fitOverlayLabel(labEl, ov);            // the cue gets the freed height back
  }
}

/* "N bars later": snapped to the metronome bar grid in absolute beat units, so
   a tempo ramp running underneath does not shift the musical landing point */
function startCountdown(cmd, from){
  var t0 = now() + 150;
  var n = meter().n, startBeat;
  if(S.metroRunning && S.metroStart){
    var rel = beatAt(t0) - S.metroBeat0;
    startBeat = S.metroBeat0 + Math.ceil(rel/n - 1e-9)*n;
    t0 = timeOfBeat(startBeat);
  }else{
    startBeat = beatAt(t0);
  }
  var fx = (cmd.fx === "tempo") ? {type:"tempo", dir:cmd.dir, ratio:cmd.ratio} : null;
  var src = from || myName();
  S.ramp = null; hideRamp(); endFlash();           // countdown and gradual are exclusive
  /* no slot 4 here: a second action only exists under "gradual", so a countdown
     never has one to preview */
  S.count = {startAt:t0, startBeat:startBeat, bars:cmd.n, label:cmd.label,
             from:src, fx:fx};
  send({t:"count", startAt:t0, startBeat:startBeat, bars:cmd.n,
        label:cmd.label, from:src, fx:fx});
  return true;
}
function cancelCountdown(){
  if(!isHost()){ req({t:"req", k:"cancelcount"}); return; }
  S.count = null; hideCount(); send({t:"countcancel"});
}
document.getElementById("countcancel").addEventListener("click", cancelCountdown);
/* shows "then <label>" while a ramp is running; hidden when it has no slot 4.
   Returns true when the line actually changed, so the caller knows the cue below
   has to be refitted against the new leftover height */
function setNextLine(el, label){
  if(!el) return false;
  var txt = label ? tf("next_up", {a:label}) : "";
  if(el.textContent === txt) return false;
  el.textContent = txt;
  el.classList.toggle("on", !!txt);
  return true;
}
function hideCount(){
  var ov = document.getElementById("ovcount");
  ov.classList.remove("show","last","blink","intro");
  /* drop the fitted size with the text: the next cue measures itself from the cap */
  if(countlab){ countlab.textContent = ""; countlab.style.fontSize = ""; }
  lastCountBeat = -1;
  for(var i=0;i<countDotEls.length;i++) countDotEls[i].classList.remove("on");
}

/* ---------- gradual change: starts now, runs across N bars ---------- */
function startGradual(cmd, from){
  var startAt = now() + 150;                 // "from now", no bar snapping
  var src = from || myName();
  var startBeat, bpmFrom = 0, bpmTo = 0;
  S.count = null; hideCount(); endFlash();
  if(cmd.fx === "tempo"){
    var base = Math.round(bpmAt(startAt));
    bpmTo = tempoTarget(cmd.ratio, base);
    var r = startTempoRamp(startAt, cmd.n, bpmTo);
    startBeat = r.startBeat; bpmFrom = r.from;
    S.bpm = bpmTo;                           // the nominal tempo after the ramp
    localStorage.setItem("sg_bpm", String(S.bpm));
    nextClickBeat = -1;
  }else{
    startBeat = beatAt(startAt);
  }
  var rlab = cmd.next ? (cmd.next.label || "") : "";
  S.ramp = {startAt:startAt, startBeat:startBeat, bars:cmd.n, label:cmd.label,
            dir:(cmd.fx === "none" ? null : cmd.dir), from:src, fx:cmd.fx,
            bpmFrom:bpmFrom, bpmTo:bpmTo, next:cmd.next || null, nextLabel:rlab};
  send(stateMsg());                          // carries the new timebase first
  send({t:"ramp", startAt:startAt, startBeat:startBeat, bars:cmd.n, label:cmd.label,
        dir:S.ramp.dir, from:src, fx:cmd.fx, bpmFrom:bpmFrom, bpmTo:bpmTo,
        nextLabel:rlab});
  return true;
}
function cancelRamp(){
  if(!isHost()){ req({t:"req", k:"cancelramp"}); return; }
  if(S.ramp && S.ramp.fx === "tempo" && rampActive()){
    S.bpm = Math.round(bpmAt(now()));        // freeze where the ramp got to
    localStorage.setItem("sg_bpm", String(S.bpm));
    setConstBpm(now(), S.bpm);
    nextClickBeat = -1;
    send(stateMsg());
  }
  S.ramp = null; hideRamp(); send({t:"rampcancel"});
}
document.getElementById("rampcancel").addEventListener("click", cancelRamp);
function hideRamp(){
  var ov = document.getElementById("ovramp");
  ov.classList.remove("show","intro");
  setNextLine(rampnextEl, "");
  if(rampnextEl) rampnextEl.style.fontSize = "";
  if(ramptxt){ ramptxt.textContent = ""; ramptxt.style.fontSize = ""; }
  document.getElementById("rampfill").style.width = "0%";
  lastRampBeat = -1;
  for(var i=0;i<rampDotEls.length;i++) rampDotEls[i].classList.remove("on");
}

/* =========================================================
   MAIN LOOP
   ========================================================= */
var lastBeat = -1, nextClickBeat = -1, lastCountBeat = -1, lastRampBeat = -1;
var ovcount = document.getElementById("ovcount");
var countnum = document.getElementById("countnum");
var countlab = document.getElementById("countlab");
var countcancelBtn = document.getElementById("countcancel");
var ovramp = document.getElementById("ovramp");
var ramptxt = document.getElementById("ramptxt");
var rampdirEl = document.getElementById("rampdir");
var rampbar = document.getElementById("rampbar");
var rampfill = document.getElementById("rampfill");
var rampremEl = document.getElementById("ramprem");
var rampnextEl = document.getElementById("rampnext");
var rampfromEl = document.getElementById("rampfrom");
var rampcancelBtn = document.getElementById("rampcancel");

/* update() is idempotent: every value is derived from timestamps, so it is safe
   to drive it from both rAF (smooth) and a setInterval net (survives rAF throttling). */
var lastBpmShown = -1;
function update(){
  /* nt, not t: t() is the translation function and must stay reachable here */
  var nt = now();
  var n = meter().n;
  var beatNow = beatAt(nt);          // single source of musical position

  /* a finished tempo ramp is closed off so the timebase is flat again */
  if(rampActive() && nt >= TB.t0 + TB.T){
    rebaseTB(TB.t0 + TB.T);
    if(isHost()){
      S.bpm = Math.round(TB.bpm1);
      localStorage.setItem("sg_bpm", String(S.bpm));
      send(stateMsg());
    }
  }
  var shown = Math.round(bpmAt(nt));
  if(shown !== lastBpmShown){
    lastBpmShown = shown;
    document.getElementById("bpmval").textContent = shown;
  }

  /* metronome visuals */
  if(S.metroRunning && S.metroStart && nt >= S.metroStart){
    var beats = Math.floor(beatNow - S.metroBeat0);
    var idx = ((beats % n) + n) % n;
    if(beats !== lastBeat){
      lastBeat = beats;
      for(var i=0;i<dotEls.length;i++) dotEls[i].classList.toggle("on", i===idx);
    }
    /* click scheduling, 150 ms lookahead — beat times come from the analytic
       inverse of the beat integral, so clicks bend with the ramp */
    if(S.sound && actx){
      if(nextClickBeat < 0) nextClickBeat = Math.max(0, beats+1);
      while(true){
        var bt = timeOfBeat(S.metroBeat0 + nextClickBeat);
        if(!isFinite(bt) || bt - nt > 150) break;
        var bi = ((nextClickBeat % n) + n) % n;
        var when = actx.currentTime + Math.max(0,(bt - nt))/1000;
        click(when, bi===0);
        nextClickBeat++;
        if(nextClickBeat > beats + 64) break;
      }
    }
  } else if(lastBeat !== -1){
    lastBeat = -1;
    for(var j=0;j<dotEls.length;j++) dotEls[j].classList.remove("on");
  }

  /* countdown — measured in beats, never in milliseconds */
  if(S.count){
    var cRel = beatNow - S.count.startBeat;
    var cTotal = S.count.bars*n;
    var remB = cTotal - cRel;
    if(remB <= 0){
      var lbl = S.count.label, lfrom = S.count.from || "", cfx = S.count.fx;
      S.count = null; hideCount();
      if(cfx && cfx.type === "tempo" && isHost()){
        applyTempoJump(tempoTarget(cfx.ratio, Math.round(bpmAt(nt))));
      }
      startFlash(lbl || t("flash_default"), clamp(Math.round(barDur()*2),1500,6000), lfrom);
    }else{
      /* the countdown is snapped to the next bar line, so during the pre-roll
         fraction remB is slightly above the full length; clamp so a 4-bar
         countdown never flashes "5". */
      var left = clamp(Math.ceil(remB/n), 1, S.count.bars);
      /* opening attention pulses, only on the hidden -> shown transition;
         "show" itself is re-added every frame and must stay idempotent */
      if(!ovcount.classList.contains("show")) introFlash(ovcount);
      ovcount.classList.add("show");
      countcancelBtn.classList.toggle("hidden", !canCue());
      if(countnum.textContent !== String(left)) countnum.textContent = left;
      var clab = S.count.label || "";
      /* refit only when the text actually changes — measuring every frame would
         reflow the overlay 60 times a second */
      if(countlab.textContent !== clab){
        countlab.textContent = clab;
        fitOverlayLabel(countlab, ovcount);
      }
      /* countdown metronome dots — same timebase as the countdown itself, so
         they run even when the metronome transport is stopped */
      var cbeats = Math.floor(cRel);
      if(cbeats !== lastCountBeat){
        lastCountBeat = cbeats;
        var cidx = cbeats < 0 ? -1 : ((cbeats % n) + n) % n;
        for(var k=0;k<countDotEls.length;k++) countDotEls[k].classList.toggle("on", k===cidx);
      }
      var last = left === 1;
      ovcount.classList.toggle("last", last);
      if(last){
        ovcount.classList.toggle("blink", Math.floor(remB*2) % 2 === 1);
      }else{
        ovcount.classList.remove("blink");
      }
    }
  }

  /* gradual change: local progress from the host anchor, no per-beat traffic */
  if(S.ramp){
    var rRel = beatNow - S.ramp.startBeat;
    var rTotal = S.ramp.bars*n;
    var rRemB = rTotal - rRel;
    if(rRemB <= 0){
      var rnext = S.ramp.next || null, rfrom = S.ramp.from || "";
      S.ramp = null; hideRamp();
      if(isHost() && rnext) fireNow(rnext, rfrom);   // slot 4, at the end of the ramp
    }else{
      if(!ovramp.classList.contains("show")) introFlash(ovramp);   // same as ovcount
      ovramp.classList.add("show");
      rampcancelBtn.classList.toggle("hidden", !canCue());
      var isDown = S.ramp.dir === "down";
      var hasDir = !!S.ramp.dir;
      var rFit = false;
      if(ramptxt.textContent !== S.ramp.label){ ramptxt.textContent = S.ramp.label; rFit = true; }
      /* only a tempo cue carries a direction now, so the hairpin bar and the
         fast / slow wording are one and the same case */
      var dirTxt = (S.ramp.fx === "tempo")
        ? (t(isDown ? "act_slower" : "act_faster") + "  "
           + Math.round(S.ramp.bpmFrom) + " - " + Math.round(S.ramp.bpmTo) + " BPM")
        : t("bars_over", S.ramp.bars);
      if(rampdirEl.textContent !== dirTxt) rampdirEl.textContent = dirTxt;
      if(setNextLine(rampnextEl, S.ramp.nextLabel)) rFit = true;
      rampbar.classList.toggle("up", hasDir && !isDown);
      rampbar.classList.toggle("down", hasDir && isDown);
      var prog = clamp(rRel/rTotal, 0, 1);
      rampfill.style.width = (prog*100).toFixed(1) + "%";
      var rLeft = Math.max(1, Math.ceil(rRemB/n));
      var remTxt = t("bars_unit", rLeft);
      if(rampremEl.textContent !== remTxt) rampremEl.textContent = remTxt;
      if(rampfromEl.textContent !== (S.ramp.from||"")) rampfromEl.textContent = S.ramp.from||"";
      /* fitted last: the direction / bar / remaining / source rows are all in place
         by now, so the leftover height the cue text gets is the real one */
      if(rFit) fitOverlayPair(ramptxt, rampnextEl, ovramp);
      var rbeats = Math.floor(rRel);
      if(rbeats !== lastRampBeat){
        lastRampBeat = rbeats;
        var ridx = rbeats < 0 ? -1 : ((rbeats % n) + n) % n;
        for(var q=0;q<rampDotEls.length;q++) rampDotEls[q].classList.toggle("on", q===ridx);
      }
    }
  }

  /* the warning line clears itself; the sentence itself never expires */
  if(S.warnKey && nt > S.warnUntil){ S.warnKey = null; renderCompose(); }

  /* flash */
  if(S.flashUntil && nt >= S.flashUntil) endFlash();
}
function tick(){ update(); requestAnimationFrame(tick); }

/* =========================================================
   RENDER / INIT
   ========================================================= */
function renderAll(){
  lastBpmShown = -1;                       // update() refreshes it from the timebase
  document.getElementById("bpmval").textContent = Math.round(bpmAt(now()));
  document.getElementById("roomlabel").textContent = t((S.role==="local") ? "mode_label" : "room_label");
  document.getElementById("roomcode").textContent =
    (S.role==="local") ? t("local_code") : (S.code || "————");
  renderMeters(); renderDots(); renderSound(); renderGrid(); renderRoleBtn();
  document.getElementById("metrobtn").textContent = t(S.metroRunning ? "metro_stop" : "metro_start");
  document.getElementById("metrobtn").classList.toggle("on", S.metroRunning);
  document.getElementById("editbtn").textContent = t(S.editMode ? "edit_off" : "edit_on");
  document.getElementById("folstate").textContent = t("fol_wait");
  if(S.role==="follower"){
    document.getElementById("folsub").textContent =
      (S.name ? S.name + " · " : "") + S.bpm + " BPM · " + meter().name;
  }
  renderTapInfo();
}

/* wake lock */
var wakeLock = null;
function requestWakeLock(){
  if(!("wakeLock" in navigator)) return;
  navigator.wakeLock.request("screen").then(function(w){
    wakeLock = w;
    w.addEventListener("release", function(){ wakeLock = null; });
  }).catch(function(){});
}
document.addEventListener("visibilitychange", function(){
  if(document.visibilityState==="visible" && !wakeLock && S.role!=="none") requestWakeLock();
});

/* unlock audio on first interaction */
document.addEventListener("pointerdown", function once(){
  if(S.sound) initAudio();
}, {passive:true});

document.addEventListener("gesturestart", function(e){ e.preventDefault(); });

/* rotating the device changes the fitting box, so refit whatever cue is showing */
window.addEventListener("resize", function(){
  var ov = document.getElementById("ovflash");
  if(ov && ov.classList.contains("show")) fitFlashText();
  if(ovcount.classList.contains("show")) fitOverlayLabel(countlab, ovcount);
  fitOverlayPair(ramptxt, rampnextEl, ovramp);      // no-ops unless that overlay is showing
});

applyTheme();
if(needMigrateSave){ try{ saveCells(); }catch(err){} }   // v1 -> v2, written once
applyLang();     // also runs renderAll()
/* The source link points at this very file rather than a hard-coded name: the
   app is index.html in the repo and sessionguide-app.html on the site, so any
   fixed path would break on one of them. */
(function(){
  var a = document.getElementById("srcdl");
  if(!a) return;
  var p = location.pathname;
  a.href = /\/$/.test(p) ? p + "index.html" : p;
})();
requestAnimationFrame(tick);
setInterval(update, 100);

})();
</script>
