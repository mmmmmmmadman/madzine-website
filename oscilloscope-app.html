<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;500&family=Noto+Sans+JP:wght@300;400&family=Noto+Sans+TC:wght@300;400;500&display=swap">
<script>
  // theme before first paint: own key, else the site's madzine-mode, else system
  (function () {
    var t = null;
    try { t = localStorage.getItem('osc_theme') || localStorage.getItem('madzine-mode'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', t);
  })();
  // HUE accent system (same port of AnyAni hue.rs as modular-fighters/index.html): every accent
  // token is HSB at the chosen hue, each role keeps the S / B of the coral tokens, S × saturation.
  (function () {
    var DEFAULT_HUE = 12 / 360, DEFAULT_SAT = 1;
    var ROLES = {
      dark:  { acc: [0.5345, 0.9098], text: [0.5345, 0.9098], dim: [0.3925, 0.4196], glow: [0.4980, 1.0] },
      light: { acc: [0.5345, 0.9098], text: [0.6536, 0.7020], dim: [0.1852, 0.9529], glow: [0.6359, 0.8510] }
    };
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function hex2(v) { var h = Math.round(clamp(v, 0, 1) * 255).toString(16); return h.length < 2 ? '0' + h : h; }
    function hsb(h, s, b) {
      h = ((h % 1) + 1) % 1 * 360;
      var c = b * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = b - c, r, g, bl;
      if (h < 60) { r = c; g = x; bl = 0; } else if (h < 120) { r = x; g = c; bl = 0; }
      else if (h < 180) { r = 0; g = c; bl = x; } else if (h < 240) { r = 0; g = x; bl = c; }
      else if (h < 300) { r = x; g = 0; bl = c; } else { r = c; g = 0; bl = x; }
      return '#' + hex2(r + m) + hex2(g + m) + hex2(bl + m);
    }
    function role(th, k, hue, sat) { var sb = ROLES[th][k]; return hsb(hue, clamp(sb[0] * sat, 0, 1), sb[1]); }
    function compute(hue, sat) {
      var out = {};
      ['dark', 'light'].forEach(function (th) {
        out[th] = { acc: role(th, 'acc', hue, sat), text: role(th, 'text', hue, sat), dim: role(th, 'dim', hue, sat), glow: role(th, 'glow', hue, sat),
                    acc2: role(th, 'acc', hue + 0.5, sat), text2: role(th, 'text', hue + 0.5, sat) };
      });
      return out;
    }
    function rules(c, onLight) {
      // --accent paints strokes on the screen and the wordmark; on the light theme it takes the text role (darker)
      var a = onLight ? c.text : c.acc, a2 = onLight ? c.text2 : c.acc2;
      return '--accent:' + a + ';--accent2:' + a2 + ';--accent-fill:' + c.acc + ';--accent-dim:' + c.dim + ';--accent-glow:' + c.glow + ';';
    }
    var state = { hue: DEFAULT_HUE, sat: DEFAULT_SAT, colors: null };
    try {
      var h = parseFloat(localStorage.getItem('osc_hue')), sa = parseFloat(localStorage.getItem('osc_sat'));
      if (isFinite(h) && h >= 0 && h <= 1) state.hue = h;
      if (isFinite(sa) && sa >= 0 && sa <= 2) state.sat = sa;
    } catch (e) {}
    var styleEl = document.createElement('style'); styleEl.id = 'hue-tokens'; document.head.appendChild(styleEl);
    function apply(hue, sat) {
      state.hue = ((hue % 1) + 1) % 1; state.sat = clamp(sat, 0, 2);
      var c = compute(state.hue, state.sat); state.colors = c;
      styleEl.textContent = 'html:root{' + rules(c.dark, false) + '}html:root[data-theme="light"]{' + rules(c.light, true) + '}';
      return c;
    }
    function save() { try { localStorage.setItem('osc_hue', String(state.hue)); localStorage.setItem('osc_sat', String(state.sat)); } catch (e) {} }
    apply(state.hue, state.sat);
    window.OscHue = { DEFAULT_HUE: DEFAULT_HUE, DEFAULT_SAT: DEFAULT_SAT, ROLES: ROLES, state: state, hsb: hsb, role: role, apply: apply, save: save };
  })();
</script>
<style>
/* Layout concept: one-screen instrument. A thin control rack on top, below it a "deck" of three
   panels (oscilloscope / spectrum / 3D Fourier box) the viewer can reorder, resize, stack or grid.
   Dark-first (a scope screen), with a light bench variant. Accent hue is live via the HUE ring. */
/* Dark-first instrument. Theme is html[data-theme]; accent tokens are written by the HUE system in <head>. */
:root {
  --bg: oklch(0.17 0.006 40);
  --rack: oklch(0.21 0.007 40);
  --panel: oklch(0.2 0.007 40);
  --screen: oklch(0.14 0.006 40);
  --line: oklch(0.3 0.008 40);
  --grid: oklch(0.26 0.008 40);
  --ink: oklch(0.9 0.008 60);
  --ink-dim: oklch(0.62 0.01 50);
  --ink-faint: oklch(0.45 0.01 50);
  --accent: #e8846c; --accent2: #6cd0e8; --accent-fill: #e8846c; --accent-dim: #6b4a44; --accent-glow: #ff9f80;
  --accent-soft: color-mix(in srgb, var(--accent) 18%, transparent);
  --danger: hsl(0 55% 60%);
  --f-display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --f-body: "Noto Sans TC", "Noto Sans JP", "PingFang TC", "Microsoft JhengHei", sans-serif;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: oklch(0.95 0.006 70);
  --rack: oklch(0.985 0.004 80);
  --panel: oklch(0.975 0.004 80);
  --screen: oklch(0.93 0.008 70);
  --line: oklch(0.86 0.008 70);
  --grid: oklch(0.88 0.008 70);
  --ink: oklch(0.22 0.01 40);
  --ink-dim: oklch(0.48 0.01 40);
  --ink-faint: oklch(0.68 0.01 40);
  --accent-soft: color-mix(in srgb, var(--accent) 16%, transparent);
  --danger: hsl(0 60% 48%);
  color-scheme: light;
}

html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-weight: 300; font-size: 15px; line-height: 1.4;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px 14px;

  -webkit-font-smoothing: antialiased;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* ---------- bar + gear menu ---------- */
.bar { position: relative; display: flex; align-items: center; gap: 10px; min-height: 44px; }
.bar .word { font-family: var(--f-display); font-weight: 500; font-size: 20px; letter-spacing: 0.08em; color: var(--accent); line-height: 1; }
.barR { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.ico.big { width: 44px; height: 44px; border-radius: 6px; }
.ico.big svg { width: 24px; height: 24px; }
.ico.big[aria-pressed="true"] { color: var(--accent); background: var(--accent-soft); }
.ico.big[aria-expanded="true"] { color: var(--ink); background: var(--accent-soft); }
.pill { font-family: var(--f-display); font-size: 15px; letter-spacing: 0.04em; color: var(--ink-dim); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; max-width: 60vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill.warn { color: var(--danger); border-color: color-mix(in oklch, var(--danger) 50%, transparent); }

#huepop { position: absolute; right: 0; top: calc(100% + 6px); z-index: 30; padding: 10px; background: var(--rack); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 12px 32px rgb(0 0 0 / 0.28); }
#huewheel { display: block; width: 236px; height: 236px; touch-action: none; cursor: pointer; }
.bar .word a { color: inherit; text-decoration: none; }

/* ---------- deck ---------- */
.deck { flex: 1; min-height: 360px; display: flex; gap: 10px; min-width: 0; }
.deck[data-mode="row"] { flex-direction: row; }
.panel {
  background: var(--panel); border: 1px solid var(--line); border-radius: 6px; display: flex; flex-direction: column;
  min-width: 0; min-height: 0; flex: 1 1 0; position: relative; overflow: hidden;
}
.panel.dragging { outline: 2px solid var(--accent); opacity: 0.85; }
.panel.over { outline: 2px dashed var(--accent); }
.ph { display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 6px; border-bottom: 1px solid var(--line); min-height: 38px; }
.ph h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 17px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink); white-space: nowrap; }
.ph h2 .ja { color: var(--accent2); margin-left: 6px; letter-spacing: 0.14em; font-weight: 300; }
.ph .ro { margin-left: auto; font-family: var(--f-display); font-size: 15px; color: var(--ink-dim); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.ph .ro b { color: var(--ink); font-weight: 400; }
.ico { width: 26px; height: 26px; display: inline-flex; align-items: center; justify-content: center; border-radius: 4px; color: var(--ink-dim); }
.ico:hover { color: var(--ink); background: var(--accent-soft); }
.ico svg { width: 14px; height: 14px; }
.grip { cursor: grab; touch-action: none; }
.grip:active { cursor: grabbing; }

.panel canvas { flex: 1; min-height: 0; width: 100%; display: block; background: var(--screen); }

@media (max-width: 760px) {
  .deck { flex-direction: column; }
  .deck .panel { min-height: 230px; flex: 1 1 auto; }
  .slider input[type=range] { width: 110px; }
}
@media (prefers-reduced-motion: reduce) { .btn, .seg button, .ico { transition: none; } }
</style>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const root = document.documentElement;
const TAU = Math.PI * 2;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------------- state ---------------- */
const state = {
  src: 'mic', freq: 220, gain: 0.6, audible: false,
  ygain: 1, K: 12, showComp: true, showRecon: true, logFreq: true,
  theta: 0, thetaTarget: 0,
  layout: { order: ['scope', 'spec', 'flip'] },
};
const LS_KEY = 'osc_state_v1';
try {
  const saved = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
  if (saved && typeof saved === 'object') {
    if (saved.layout && Array.isArray(saved.layout.order) && saved.layout.order.length === 3 && ['scope', 'spec', 'flip'].every(k => saved.layout.order.includes(k))) state.layout.order = saved.layout.order.slice();
    for (const k of ['ygain', 'K', 'showComp', 'showRecon', 'logFreq', 'src', 'freq', 'gain']) if (k in saved) state[k] = saved[k];
    if (state.src === 'file') state.src = 'sine';
  }
} catch (e) {}
function persist() {
  try {
    const { ygain, K, showComp, showRecon, logFreq, src, freq, gain, layout } = state;
    localStorage.setItem(LS_KEY, JSON.stringify({ ygain, K, showComp, showRecon, logFreq, src, freq, gain, layout: { order: layout.order } }));
  } catch (e) {}
}

/* ---------------- FFT ---------------- */
class FFT {
  constructor(n) {
    this.n = n; this.rev = new Uint32Array(n);
    const bits = Math.round(Math.log2(n));
    for (let i = 0; i < n; i++) { let r = 0; for (let b = 0; b < bits; b++) r |= ((i >> b) & 1) << (bits - 1 - b); this.rev[i] = r; }
    this.cos = new Float32Array(n / 2); this.sin = new Float32Array(n / 2);
    for (let i = 0; i < n / 2; i++) { this.cos[i] = Math.cos(-TAU * i / n); this.sin[i] = Math.sin(-TAU * i / n); }
  }
  run(re, im) {
    const n = this.n, rev = this.rev;
    for (let i = 0; i < n; i++) { const j = rev[i]; if (j > i) { let t = re[i]; re[i] = re[j]; re[j] = t; t = im[i]; im[i] = im[j]; im[j] = t; } }
    for (let size = 2; size <= n; size <<= 1) {
      const half = size >> 1, step = n / size;
      for (let i = 0; i < n; i += size) {
        for (let j = 0, k = 0; j < half; j++, k += step) {

    ctx.stroke(); ctx.globalAlpha = 1;

  const yClamp = v => Math.max(-1.15, Math.min(1.15, v));
  const Y0 = -1.08; // floor
  // floor grid
  ctx.lineWidth = 1;
  for (let i = 0; i <= 8; i++) { const x = -1 + 2 * i / 8; line([P(x, Y0, ZW), P(x, Y0, ZHI)], css.grid, 1, 0.9); }
  for (let i = 0; i <= 8; i++) { const z = ZW + (ZHI - ZW) * i / 8; line([P(-1, Y0, z), P(1, Y0, z)], css.grid, 1, 0.9); }
  // frame edges
  line([P(-1, Y0, ZW), P(1, Y0, ZW), P(1, Y0, ZHI), P(-1, Y0, ZHI), P(-1, Y0, ZW)], css.line, 1);
  line([P(-1, Y0, ZW), P(-1, 1.08, ZW)], css.line, 1);
  line([P(-1, 0, ZW), P(1, 0, ZW)], css.line, 1, 0.8 * ct + 0.2);
  // frequency ticks on the floor (right edge)
  ctx.font = fontD(13); ctx.fillStyle = css.dim; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const fTicks = state.logFreq ? [50, 100, 200, 500, 1000, 2000, 5000, 10000, 20000] : [2000, 4000, 8000, 12000, 16000, 20000];
  ctx.globalAlpha = 0.25 + 0.75 * st;
  for (const f of fTicks) { if (f > freqMax()) continue; const z = ZLO + fpos(f) * (ZHI - ZLO); const p = P(1.0, Y0, z), q = P(1.06, Y0, z); line([p, q], css.dim, 1, 0.25 + 0.75 * st); const l = P(1.17, Y0, z); ctx.fillText(fmtHz(f), l[0], l[1]); }
  ctx.globalAlpha = 1;
  // time ticks along front edge
  const totalMs = NSEG / sampleRate * 1000;
  ctx.globalAlpha = 0.25 + 0.75 * ct;
  for (let i = 0; i <= 4; i++) { const x = -1 + 2 * i / 4; const l = P(x, Y0 - 0.1, ZW - 0.1); ctx.fillText(`${(totalMs * i / 4).toFixed(1)}`, l[0], l[1]); }
  ctx.globalAlpha = 1;
  // axis titles
  const title = (a, b, text, alpha, color) => {
    if (alpha < 0.03) return;
    const pa = P(...a), pb = P(...b); const ang = Math.atan2(pb[1] - pa[1], pb[0] - pa[0]);
    ctx.save(); ctx.globalAlpha = alpha; ctx.translate((pa[0] + pb[0]) / 2, (pa[1] + pb[1]) / 2); ctx.rotate(Math.abs(ang) > Math.PI / 2 ? ang + Math.PI : ang);
    ctx.font = fontD(15, 500); ctx.fillStyle = color; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, 0, 0); ctx.restore();
  };
  title([-1, Y0 - 0.26, ZW - 0.1], [1, Y0 - 0.26, ZW - 0.1], 'TIME  ms', ct, css.accent);
  title([1.35, Y0, ZLO], [1.35, Y0, ZHI], 'FREQUENCY  Hz', st, css.accent2);
  title([-1.1, -1, ZW - 0.12], [-1.1, 1, ZW - 0.12], 'AMPLITUDE', 1, css.dim);
  // spectrum wall at x = XWALL (start of time): linear amplitude of the smoothed spectrum over frequency,
  // decimated to one point per small step of depth (max of the bins inside the step)
  const wallA = 0.25 + 0.75 * st;
  {
    const binHz = sampleRate / NBUF, pts = [P(XWALL, 0, ZLO)];
    let zPrev = -10, acc = -1000;
    for (let k = 1; k < NBUF / 2; k++) {
      const f = k * binHz; if (f > freqMax()) break; if (state.logFreq && f < freqMin) continue;
      const z = zOfF(f); if (specDb[k] > acc) acc = specDb[k];
      if (z - zPrev >= 0.006) { pts.push(P(XWALL, yClamp(Math.pow(10, acc / 20) * state.ygain), z)); zPrev = z; acc = -1000; }
    }
    pts.push(P(XWALL, 0, ZHI));
    ctx.globalAlpha = 0.22 * wallA; ctx.fillStyle = css.accent2; ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;
    line(pts.slice(1, -1), css.accent2, 1.2, wallA);
  }
  // components: sort far -> near for painter's order
  const M = 192;
  if (state.showComp && comps.length) {
    const order = comps.map(c => ({ c, d: P(0, 0, zOfF(c.f))[2] })).sort((a, b) => b.d - a.d);
    const w = TAU / sampleRate;
    for (const { c } of order) {
      const a = c.amp * state.ygain, z = zOfF(c.f), col = hueCol(compHue(c.f));
      const pts = [];
      for (let i = 0; i <= M; i++) { const n = segStart + i / M * (NSEG - 1); pts.push(P(-1 + 2 * i / M, yClamp(a * Math.cos(w * c.f * n + c.ph)), z)); }
      line(pts, col, 1.3, 0.55 + 0.4 * ct);
      // spectrum bar reading, grows as the box turns edge-on
      if (st > 0.2) { line([P(1, 0, z), P(1, yClamp(a), z)], col, 2.4, (st - 0.2) / 0.8); ctx.globalAlpha = (st - 0.2) / 0.8; ctx.fillStyle = col; const t = P(1, yClamp(a), z); ctx.beginPath(); ctx.arc(t[0], t[1], 2.6, 0, TAU); ctx.fill(); ctx.globalAlpha = 1; }
    }
  }
  // waveform plane (front at theta = 0)
  {
    const pts = [];
    for (let i = 0; i <= M; i++) { const n = Math.min(NSEG - 1, Math.round(i / M * (NSEG - 1))); pts.push(P(-1 + 2 * i / M, yClamp(seg[n] * state.ygain), ZW)); }
    line(pts, css.accent, 3.6, 0.22);
    line(pts, css.accent, 1.9, 1);
  }
  const deg = Math.round(state.theta);
  $('#roFlip').innerHTML = `<b>${deg}°</b> · ${comps.length} 個分量`;
}

/* ---------------- flip animation ---------------- */
let lastFrame = performance.now();
function stepFlip(dt) {
  const d = state.thetaTarget - state.theta;
  if (Math.abs(d) < 0.05 || reduceMotion) state.theta = state.thetaTarget;
  else state.theta += d * (1 - Math.exp(-dt * 4.2));   // eased approach, a full flip takes about 1.3 s
}

/* ---------------- main loop ---------------- */
function frame(now) {
  const dt = Math.min(0.1, (now - lastFrame) / 1000); lastFrame = now;
  if (!document.hidden) {
    readCss(); analyze(); stepFlip(dt);
    drawScope(); drawSpec(); drawFlip();
  }
  requestAnimationFrame(frame);
}

/* ---------------- controls ---------------- */
const FMIN = 27.5, FMAX = 4186;
const sliderToFreq = v => FMIN * Math.pow(FMAX / FMIN, v / 1000);
const freqToSlider = f => Math.round(1000 * Math.log(f / FMIN) / Math.log(FMAX / FMIN));
function syncFreqOut() { $('#freqOut').innerHTML = `${state.freq < 100 ? state.freq.toFixed(1) : Math.round(state.freq)} Hz<small>${noteName(state.freq)}</small>`; }
$('#freq').value = freqToSlider(state.freq); syncFreqOut();
$('#freq').addEventListener('input', e => {
  state.freq = sliderToFreq(+e.target.value); syncFreqOut(); persist();
  if (ac && liveNodes.length) { let i = 0; for (const n of liveNodes) if (n.frequency) { const r = state.src === 'chord' ? CHORD[i++][0] : 1; n.frequency.setTargetAtTime(state.freq * r, ac.currentTime, 0.01); } }
});
$('#gain').value = Math.round(state.gain * 100); $('#gainOut').textContent = state.gain.toFixed(2);
$('#gain').addEventListener('input', e => { state.gain = +e.target.value / 100; $('#gainOut').textContent = state.gain.toFixed(2); if (srcGain) srcGain.gain.setTargetAtTime(state.gain, ac.currentTime, 0.01); persist(); });
const ygMap = v => Math.pow(2, (v - 25) / 25); // 0..100 -> 0.5x .. 8x
$('#ygain').value = Math.round(25 + 25 * Math.log2(state.ygain)); $('#ygainOut').textContent = state.ygain.toFixed(1) + '×';
$('#ygain').addEventListener('input', e => { state.ygain = ygMap(+e.target.value); $('#ygainOut').textContent = state.ygain.toFixed(1) + '×'; persist(); });
$('#kcomp').value = state.K; $('#kcompOut').textContent = state.K;
$('#kcomp').addEventListener('input', e => { state.K = +e.target.value; $('#kcompOut').textContent = state.K; persist(); });
const toggle = (id, key) => { const b = $(id); b.setAttribute('aria-pressed', String(state[key])); b.addEventListener('click', () => { state[key] = !state[key]; b.setAttribute('aria-pressed', String(state[key])); persist(); }); };
toggle('#tComp', 'showComp'); toggle('#tRecon', 'showRecon'); toggle('#tLog', 'logFreq');

function syncSrcSeg() { $$('#srcSeg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.src === state.src))); }
syncSrcSeg();
$('#srcSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; if (b.dataset.src === 'file' && state.src === 'file') { $('#fileIn').click(); return; } selectSource(b.dataset.src); });
$('#audioBtn').addEventListener('click', () => setAudible(!state.audible));

// 3D canvas: a tap flips between the waveform view (0°) and the spectrum view (90°); a horizontal drag scrubs the angle
{
  let drag = null;
  const cv = canv.flip;
  cv.addEventListener('pointerdown', e => { drag = { x: e.clientX, th: state.theta, t: performance.now(), moved: false }; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointermove', e => {
    if (!drag) return;
    const dx = e.clientX - drag.x; if (Math.abs(dx) > 6) drag.moved = true;
    if (drag.moved) state.theta = state.thetaTarget = Math.max(0, Math.min(90, drag.th + dx * 0.35));
  });
  const end = e => {
    if (!drag) return;
    if (!drag.moved && performance.now() - drag.t < 500) state.thetaTarget = state.thetaTarget > 45 ? 0 : 90;
    else if (drag.moved) state.thetaTarget = state.theta;
    drag = null;
  };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', () => { drag = null; });
}

/* ---------------- HUE wheel (port of modular-fighters/index.html, itself a port of AnyAni hue.rs) ---------------- */
{
  const hueBtn = $('#huebtn'), huePop = $('#huepop'), wheelCv = $('#huewheel'), iconCv = $('#hueicon');
  const WHEEL = 236, OUTER = 110, RING = 26, INNER = OUTER - RING, CENTER_R = INNER - 4, ICON = 32;
  let ringTex = null, ringDpr = 0, hueZone = null, hueLastY = 0, hueRaf = 0;
  const smoothstep = (e0, e1, x) => { let t = (x - e0) / (e1 - e0); t = t < 0 ? 0 : (t > 1 ? 1 : t); return t * t * (3 - 2 * t); };
  function buildRingTex(d) {
    const size = Math.round(WHEEL * d), cv = document.createElement('canvas'); cv.width = size; cv.height = size;
    const c = cv.getContext('2d'), img = c.createImageData(size, size), px = img.data, center = size / 2, oR = OUTER * d, iR = INNER * d;
    for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
      const dx = x + 0.5 - center, dy = y + 0.5 - center, dd = Math.sqrt(dx * dx + dy * dy);
      const a = smoothstep(oR + 1.5, oR - 0.5, dd) * smoothstep(iR - 1.5, iR + 0.5, dd);
      if (a <= 0) continue;
      let ang = Math.atan2(dy, dx) + Math.PI / 2; if (ang < 0) ang += TAU;
      const col = OscHue.hsb(ang / TAU, 0.30, 0.92), o = (y * size + x) * 4;
      px[o] = parseInt(col.substr(1, 2), 16); px[o + 1] = parseInt(col.substr(3, 2), 16); px[o + 2] = parseInt(col.substr(5, 2), 16); px[o + 3] = Math.round(a * 255);
    }
    c.putImageData(img, 0, 0); ringTex = cv; ringDpr = d;
  }
  function sizeCanvas(cv, cssPx) { const d = window.devicePixelRatio || 1, w = Math.round(cssPx * d); if (cv.width !== w) { cv.width = w; cv.height = w; } return d; }
  function drawWheel() {
    const d = sizeCanvas(wheelCv, WHEEL); if (!ringTex || ringDpr !== d) buildRingTex(d);
    const c = wheelCv.getContext('2d'), cx = WHEEL / 2, cy = WHEEL / 2, st = OscHue.state;
    c.setTransform(d, 0, 0, d, 0, 0); c.clearRect(0, 0, WHEEL, WHEEL); c.drawImage(ringTex, 0, 0, WHEEL, WHEEL);
    c.fillStyle = st.colors.dark.acc; c.beginPath(); c.arc(cx, cy, CENTER_R, 0, TAU); c.fill();
    const ma = st.hue * TAU - Math.PI / 2, mr = OUTER - RING / 2, mx = cx + Math.cos(ma) * mr, my = cy + Math.sin(ma) * mr;
    c.fillStyle = 'rgba(0,0,0,' + (50 / 255) + ')'; c.beginPath(); c.arc(mx, my, 6, 0, TAU); c.fill();
    c.fillStyle = '#ffffff'; c.beginPath(); c.arc(mx, my, 5, 0, TAU); c.fill();
    c.strokeStyle = 'rgba(0,0,0,0.7)'; c.lineWidth = 2; c.lineCap = 'round'; c.lineJoin = 'round'; c.beginPath();
    c.moveTo(cx - 10, cy - 18); c.lineTo(cx, cy - 28); c.lineTo(cx + 10, cy - 18);
    c.moveTo(cx - 10, cy + 18); c.lineTo(cx, cy + 28); c.lineTo(cx + 10, cy + 18); c.stroke();
    c.fillStyle = 'rgba(0,0,0,0.7)'; c.font = '300 14px "Barlow Condensed","Noto Sans JP",system-ui,sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText('SATURATION', cx, cy + 1);
  }
  function drawIcon() {
    const d = sizeCanvas(iconCv, ICON); if (!ringTex || ringDpr !== d) buildRingTex(d);
    const c = iconCv.getContext('2d'), k = ICON / WHEEL, cx = ICON / 2, st = OscHue.state;
    c.setTransform(d, 0, 0, d, 0, 0); c.clearRect(0, 0, ICON, ICON); c.drawImage(ringTex, 0, 0, ICON, ICON);
    c.fillStyle = st.colors.dark.acc; c.beginPath(); c.arc(cx, cx, CENTER_R * k, 0, TAU); c.fill();
    const ma = st.hue * TAU - Math.PI / 2, mr = (OUTER - RING / 2) * k, mx = cx + Math.cos(ma) * mr, my = cx + Math.sin(ma) * mr;
    c.fillStyle = 'rgba(0,0,0,' + (50 / 255) + ')'; c.beginPath(); c.arc(mx, my, 2.4, 0, TAU); c.fill();
    c.fillStyle = '#ffffff'; c.beginPath(); c.arc(mx, my, 2, 0, TAU); c.fill();
  }
  function setHue(h, sat) {
    OscHue.apply(h, sat);
    if (hueRaf) return;
    hueRaf = requestAnimationFrame(() => { hueRaf = 0; if (!huePop.hidden) drawWheel(); drawIcon(); });
  }
  const openHue = () => { huePop.hidden = false; hueBtn.classList.add('open'); hueBtn.setAttribute('aria-expanded', 'true'); drawWheel(); };
  const closeHue = () => { if (huePop.hidden) return; huePop.hidden = true; hueZone = null; hueBtn.classList.remove('open'); hueBtn.setAttribute('aria-expanded', 'false'); };
  hueBtn.addEventListener('click', () => { if (huePop.hidden) { openHue(); } else closeHue(); });
  document.addEventListener('pointerdown', e => { if (huePop.hidden) return; if (huePop.contains(e.target) || hueBtn.contains(e.target)) return; closeHue(); }, true);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeHue(); });
  const wheelPos = e => { const r = wheelCv.getBoundingClientRect(); return { dx: e.clientX - (r.left + r.width / 2), dy: e.clientY - (r.top + r.height / 2) }; };
  const hueFromPos = p => { let a = Math.atan2(p.dy, p.dx) + Math.PI / 2; if (a < 0) a += TAU; return (a / TAU) % 1; };
  wheelCv.addEventListener('pointerdown', e => {
    const p = wheelPos(e), dd = Math.sqrt(p.dx * p.dx + p.dy * p.dy);
    if (dd <= CENTER_R) hueZone = 'center'; else if (dd >= INNER - 4 && dd <= OUTER + 4) hueZone = 'ring'; else { hueZone = null; return; }
    e.preventDefault(); try { wheelCv.setPointerCapture(e.pointerId); } catch (err) {}
    hueLastY = e.clientY; if (hueZone === 'ring') setHue(hueFromPos(p), OscHue.state.sat);
  });
  wheelCv.addEventListener('pointermove', e => {
    if (!hueZone) return; e.preventDefault();
    if (hueZone === 'ring') setHue(hueFromPos(wheelPos(e)), OscHue.state.sat);
    else { const dy = e.clientY - hueLastY; hueLastY = e.clientY; setHue(OscHue.state.hue, Math.max(0, Math.min(2, OscHue.state.sat - dy * 0.01))); }
  });
  const endHueDrag = () => { if (!hueZone) return; hueZone = null; OscHue.save(); };
  wheelCv.addEventListener('pointerup', endHueDrag); wheelCv.addEventListener('pointercancel', endHueDrag);
  drawIcon();
}

/* ---------------- theme ---------------- */
{
  const b = $('#themeBtn');
  const sync = () => { b.textContent = root.getAttribute('data-theme') === 'light' ? '黑底' : '白底'; };
  b.addEventListener('click', () => { const t = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light'; root.setAttribute('data-theme', t); try { localStorage.setItem('osc_theme', t); } catch (e) {} sync(); });
  sync();
}

/* ---------------- layout ---------------- */
const deck = $('#deck');
const panels = Object.fromEntries($$('.panel').map(p => [p.dataset.id, p]));
function applyLayout() {
  state.layout.order.forEach((id, i) => { panels[id].style.order = i; });
  persist();
}
// pointer drag reorder via grip
{
  let dragId = null;
  deck.addEventListener('pointerdown', e => {
    const g = e.target.closest('.grip'); if (!g) return;
    const p = g.closest('.panel'); dragId = p.dataset.id; p.classList.add('dragging'); g.setPointerCapture(e.pointerId); e.preventDefault();
  });
  deck.addEventListener('pointermove', e => {
    if (!dragId) return;
    const el = document.elementFromPoint(e.clientX, e.clientY); const over = el && el.closest('.panel');
    $$('.panel.over').forEach(p => p.classList.remove('over'));
    if (!over || over.dataset.id === dragId) return;
    const L = state.layout, a = L.order.indexOf(dragId), b = L.order.indexOf(over.dataset.id);
    L.order.splice(a, 1); L.order.splice(b, 0, dragId); applyLayout();
  });
  const end = () => { if (!dragId) return; panels[dragId].classList.remove('dragging'); $$('.panel.over').forEach(p => p.classList.remove('over')); dragId = null; };
  deck.addEventListener('pointerup', end); deck.addEventListener('pointercancel', end);
}
applyLayout();
readCss();

/* ---------------- gear menu / mic button ---------------- */
const menu = $('#menu'), gear = $('#gearBtn');
function openMenu(on) { menu.hidden = !on; gear.setAttribute('aria-expanded', String(on)); }
gear.addEventListener('click', () => { openMenu(menu.hidden); if (!menu.hidden) $('#huepop').hidden = true; });
pillEl.addEventListener('click', () => openMenu(true));
document.addEventListener('pointerdown', e => { if (!menu.hidden && !e.target.closest('#menu, #gearBtn, #pill')) openMenu(false); if (!menu.hidden && e.target.closest('#huebtn')) openMenu(false); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') openMenu(false); });
$('#micBtn').addEventListener('click', () => selectSource(state.src === 'mic' ? lastGen : 'mic'));

/* mic first: open the context now; if the browser keeps it suspended until a gesture, resume on the first tap */
(async () => {
  syncSrcSeg(); syncMicBtn();
  if (state.src === 'mic') {
    try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
    if (ac) {
      sampleRate = ac.sampleRate;
      analyser = ac.createAnalyser(); analyser.fftSize = NBUF; analyser.smoothingTimeConstant = 0;
      srcGain = ac.createGain(); outGain = ac.createGain(); outGain.gain.value = 0;
      srcGain.connect(analyser); srcGain.connect(outGain); outGain.connect(ac.destination);
      await buildSource();
      if (state.src === 'mic' && ac.state !== 'running') {
        setPill('點一下畫面啟動麥克風');
        const kick = async () => { try { await ac.resume(); } catch (e) {} if (ac.state === 'running') { setPill(''); document.removeEventListener('pointerdown', kick); document.removeEventListener('keydown', kick); } };
        document.addEventListener('pointerdown', kick); document.addEventListener('keydown', kick);
      }
    }
  } else selectSource(state.src);
  $$('#freq, #gain').forEach(i => { i.disabled = state.src === 'mic' || state.src === 'file'; });
})();
requestAnimationFrame(t => { lastFrame = t; frame(t); });
})();
</script>
</body>
