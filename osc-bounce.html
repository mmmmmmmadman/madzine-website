<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#161616">
<meta name="robots" content="noindex, nofollow">
<title>OSC BOUNCE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300&family=Noto+Sans+JP:wght@300&family=Noto+Sans+TC:wght@300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-base: #161616;
    --bg-area: #1d1d1d;
    --bg-elevated: #262626;
    --bg-track: #333333;
    --stroke: #3a3a3a;
    --fg-primary: #e8e8e8;
    --fg-secondary: #a6a6a6;
    --fg-dim: #707070;
    --accent: rgb(235, 150, 129);      /* HSB 12, 0.45, 0.92 */
    --accent-dim: rgb(153, 121, 113);  /* HSB 12, 0.26, 0.60 */
    --ink: #1a1a1a;
    --font: 'Barlow Condensed', 'Noto Sans JP', 'Noto Sans TC', system-ui, sans-serif;
    --font-help: 'Noto Sans JP', 'Noto Sans TC', 'Barlow Condensed', system-ui, sans-serif;
    --top-h: 56px;
    --palette-h: 76px;
    --gap: 8px;
  }
  /* Traditional Chinese: Chinese glyphs from Noto Sans TC, not the Japanese forms */
  html:lang(zh) {
    --font: 'Barlow Condensed', 'Noto Sans TC', 'Noto Sans JP', system-ui, sans-serif;
    --font-help: 'Noto Sans TC', 'Noto Sans JP', 'Barlow Condensed', system-ui, sans-serif;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg-base);
    color: var(--fg-primary);
    font-family: var(--font);
    font-weight: 300;
    line-height: 1.2;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  * { box-sizing: border-box; }
  button {
    font-family: var(--font);
    font-weight: 300;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }

  #stage {
    position: fixed;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  /* ---------- top bar ---------- */
  /* #topbar and #palette are wrappers: their bounding boxes define the play area */
  #topbar {
    position: fixed;
    left: 0;
    right: 0;
    top: 0;
    padding: env(safe-area-inset-top) calc(var(--gap) + env(safe-area-inset-right)) 0 calc(var(--gap) + env(safe-area-inset-left));
    display: flex;
    flex-direction: column;
    z-index: 2;
  }
  #topbar .bar {
    height: var(--top-h);
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .help {
    margin: 0;
    font-family: var(--font-help);
    font-weight: 300;
    font-size: 14px;
    line-height: 20px;
    letter-spacing: 0.02em;
    color: var(--fg-secondary);
    text-align: center;
    line-break: strict;
    pointer-events: none;
  }
  #help-top { padding-top: 6px; }
  #help-bottom { padding-bottom: 6px; }
  #title {
    font-size: 20px;
    letter-spacing: 0.12em;
    color: var(--accent);
    line-height: 24px;
  }
  #count {
    font-size: 16px;
    letter-spacing: 0.06em;
    color: var(--fg-secondary);
    line-height: 20px;
    transition: color 0.15s;
  }
  #count.reject { color: #ffffff; }
  #topbar .spacer { flex: 1 1 auto; }
  .textbtn {
    min-width: 88px;
    height: 44px;
    padding: 0 16px;
    background: transparent;
    border: 1px solid var(--stroke);
    border-radius: 8px;
    color: var(--fg-primary);
    font-size: 18px;
    letter-spacing: 0.12em;
    line-height: 20px;
    cursor: pointer;
  }
  .textbtn:active { background: var(--bg-track); border-color: var(--fg-dim); }
  #lang { min-width: 64px; padding: 0 12px; letter-spacing: 0.06em; }

  /* ---------- palette ---------- */
  #palette {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 0 calc(var(--gap) + env(safe-area-inset-right)) env(safe-area-inset-bottom) calc(var(--gap) + env(safe-area-inset-left));
    display: flex;
    flex-direction: column;
    z-index: 2;
  }
  #picks {
    height: var(--palette-h);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--gap);
  }
  .pick {
    flex: 0 1 132px;
    min-width: 0;
    height: 64px;
    padding: 0 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background: transparent;
    border: 1px solid var(--stroke);
    border-radius: 10px;
    color: var(--fg-secondary);
    font-size: 16px;
    letter-spacing: 0.06em;
    line-height: 20px;
    cursor: pointer;
  }
  .pick canvas { width: 40px; height: 40px; flex: 0 0 40px; display: block; }
  .pick.selected {
    background: var(--bg-elevated);
    border-color: var(--pick-color, var(--accent));
    color: var(--fg-primary);
  }
  @media (max-width: 420px) {
    :root { --top-h: 52px; --palette-h: 70px; }
    #topbar .bar { gap: 10px; }
    #help-top { padding-top: 4px; }
    #help-bottom { padding-bottom: 4px; }
    .pick { flex-direction: column; gap: 2px; padding: 4px 2px; }
    .pick canvas { width: 32px; height: 32px; flex: 0 0 32px; }
  }

  /* ---------- character panel ---------- */
  #panel {
    position: fixed;
    left: 0;
    top: 0;
    width: 232px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: var(--bg-elevated);
    border: 1px solid var(--stroke);
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    z-index: 5;
  }
  #panel[hidden] { display: none; }
  .fader {
    position: relative;
    width: 208px;
    height: 44px;
    border-radius: 8px;
    background: var(--bg-track);
    overflow: hidden;
    cursor: pointer;
    touch-action: none;
  }
  .fader .fill {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 0;
    overflow: hidden;
    background: var(--fader-color, var(--accent));
  }
  .fader .label {
    position: absolute;
    left: 0;
    top: 0;
    width: 208px;
    height: 44px;
    padding-left: 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 18px;
    letter-spacing: 0.12em;
    line-height: 20px;
    color: var(--fg-primary);
    pointer-events: none;
    white-space: nowrap;
  }
  .fader .fill .label { color: var(--ink); }
  /* icons use currentColor, so they turn dark inside the filled part with the text */
  .fader .label svg { width: 22px; height: 22px; flex: 0 0 22px; display: block; overflow: visible; }
  /* ---------- ball picker ---------- */
  .ballbtn { --pick-color: var(--fg-primary); margin-left: 8px; }
  #ballpanel {
    position: fixed;
    left: 0;
    top: 0;
    padding: 12px;
    display: grid;
    grid-template-columns: repeat(5, 116px);
    gap: 8px;
    background: var(--bg-elevated);
    border: 1px solid var(--stroke);
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    z-index: 6;
  }
  #ballpanel[hidden] { display: none; }
  .ballitem {
    height: 52px;
    padding: 0 8px;
    display: flex;
    align-items: center;
    gap: 8px;
    background: transparent;
    border: 1px solid var(--stroke);
    border-radius: 8px;
    color: var(--fg-secondary);
    font-size: 16px;
    letter-spacing: 0.06em;
    line-height: 20px;
    white-space: nowrap;
    cursor: pointer;
  }
  .ballitem canvas { width: 36px; height: 36px; flex: 0 0 36px; display: block; }
  .ballitem.selected { background: var(--bg-track); border-color: var(--fg-primary); color: var(--fg-primary); }
  @media (max-width: 660px) {
    #ballpanel { grid-template-columns: repeat(2, minmax(0, 1fr)); width: min(360px, calc(100vw - 16px)); }
  }

  #panel .row { display: flex; gap: 8px; width: 208px; }
  #panel .row .textbtn { flex: 1 1 0; min-width: 0; padding: 0; }
</style>
</head>
<body>
  <canvas id="stage"></canvas>

  <header id="topbar">
    <p id="help-top" class="help"></p>
    <div class="bar">
      <div id="title">OSC BOUNCE</div>
      <div id="count">0 / 16</div>
      <div class="spacer"></div>
      <button id="lang" class="textbtn" type="button">EN</button>
      <button id="clear" class="textbtn" type="button">CLEAR</button>
    </div>
  </header>

  <nav id="palette">
    <div id="picks"></div>
    <p id="help-bottom" class="help"></p>
  </nav>

  <div id="panel" hidden>
    <!-- Each label exists twice: light on the track, dark inside the fill (clipped by the fill width). -->
    <div class="fader" data-param="decay">
      <div class="label"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 3 V17 H17 M3 4 C4.5 11 8.5 15 17 15.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="word">LENGTH</span></div>
      <div class="fill"><div class="label"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 3 V17 H17 M3 4 C4.5 11 8.5 15 17 15.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="word">LENGTH</span></div></div>
    </div>
    <div class="fader" data-param="reverb">
      <div class="label"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="4" cy="10" r="1.8" fill="currentColor"/><path d="M7 6 A5 5 0 0 1 7 14 M9.8 3.1 A9 9 0 0 1 9.8 16.9 M13.6 2 A12.5 12.5 0 0 1 13.6 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span class="word">SPACE</span></div>
      <div class="fill"><div class="label"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="4" cy="10" r="1.8" fill="currentColor"/><path d="M7 6 A5 5 0 0 1 7 14 M9.8 3.1 A9 9 0 0 1 9.8 16.9 M13.6 2 A12.5 12.5 0 0 1 13.6 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span class="word">SPACE</span></div></div>
    </div>
    <div class="fader" data-param="delay">
      <div class="label"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="3.5" cy="10" r="2.6" fill="currentColor"/><circle cx="9.5" cy="10" r="1.9" fill="currentColor"/><circle cx="14.5" cy="10" r="1.3" fill="currentColor"/><circle cx="18.2" cy="10" r="0.8" fill="currentColor"/></svg><span class="word">ECHO</span></div>
      <div class="fill"><div class="label"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="3.5" cy="10" r="2.6" fill="currentColor"/><circle cx="9.5" cy="10" r="1.9" fill="currentColor"/><circle cx="14.5" cy="10" r="1.3" fill="currentColor"/><circle cx="18.2" cy="10" r="0.8" fill="currentColor"/></svg><span class="word">ECHO</span></div></div>
    </div>
    <div class="row">
      <button id="remove" class="textbtn" type="button">REMOVE</button>
      <button id="close" class="textbtn" type="button">CLOSE</button>
    </div>
  </div>

  <div id="ballpanel" hidden></div>

  <script data-src="sim.js">
/*
 * OSC Bounce - simulation core
 * Pure logic. No DOM, no Canvas, no Web Audio.
 * Coordinates are in "play area" units (CSS pixels of the play area, origin top-left).
 * Designed to map 1:1 onto a Swift struct/class later.
 */
(function (global) {
  'use strict';

  // ---------- constants ----------
  var MAX_CHARACTERS = 16;
  var STEP = 1 / 240;            // fixed simulation step in seconds
  var MAX_FRAME_DT = 0.1;        // ignore longer gaps (tab hidden, etc.)
  var RETRIGGER_GUARD = 0.1;     // seconds; same character cannot fire a new hit within this

  var DECAY_MIN = 0.05;          // seconds
  var DECAY_MAX = 2.5;           // seconds
  var DEFAULT_DECAY = 0.4;
  var DEFAULT_REVERB = 0.25;
  var DEFAULT_DELAY = 0.0;
  var PAN_RANGE = 0.7;

  // ---------- ball table (single place; looks are drawn by the UI from `id`) ----------
  // radius: px. hardness: 0 (softest) .. 1 (hardest). color: base color for drawing.
  // image: optional artwork path; UI falls back to Canvas drawing if missing/failed.
  // Sorted small -> large. Large balls can touch several characters at once.
  var BALLS = [
    { id: 'steel',    label: 'STEEL',    radius: 5,  hardness: 1.00, color: [196, 200, 206], image: null },
    { id: 'glass',    label: 'GLASS',    radius: 8,  hardness: 0.90, color: [170, 220, 230], image: null },
    { id: 'pingpong', label: 'PINGPONG', radius: 11, hardness: 0.75, color: [243, 154, 58],  image: null },
    { id: 'marble',   label: 'MARBLE',   radius: 15, hardness: 0.95, color: [236, 236, 240], image: null },
    { id: 'wood',     label: 'WOOD',     radius: 20, hardness: 0.65, color: [190, 138, 84],  image: null },
    { id: 'rubber',   label: 'RUBBER',   radius: 26, hardness: 0.45, color: [142, 91, 214],  image: null },
    { id: 'tennis',   label: 'TENNIS',   radius: 34, hardness: 0.32, color: [200, 224, 74],  image: null },
    { id: 'sponge',   label: 'SPONGE',   radius: 46, hardness: 0.12, color: [222, 178, 104], image: null },
    { id: 'cotton',   label: 'COTTON',   radius: 54, hardness: 0.00, color: [244, 244, 244], image: null },
    { id: 'stone',    label: 'STONE',    radius: 66, hardness: 0.85, color: [128, 124, 120], image: null }
  ];
  var DEFAULT_BALL = 3; // MARBLE

  // ---------- ball conversions ----------
  var BALL_R_MIN = Math.min.apply(null, BALLS.map(function (b) { return b.radius; }));
  var BALL_R_MAX = Math.max.apply(null, BALLS.map(function (b) { return b.radius; }));
  var REF_RADIUS = BALLS[DEFAULT_BALL].radius;
  var REF_SPEED = 300;            // px/s of the reference radius at full bounds
  var SIZE_SPEED_RATIO = 2.5;     // smallest ball is this many times faster than largest
  var SPEED_EXP = Math.log(SIZE_SPEED_RATIO) / Math.log(BALL_R_MAX / BALL_R_MIN);

  // radius -> base speed (px/s). Smaller = faster.
  function speedForRadius(r) {
    return REF_SPEED * Math.pow(REF_RADIUS / r, SPEED_EXP);
  }

  // Contact skin: once the ball touches a character, every other character within
  // this extra distance that the ball is moving toward is hit in the same step.
  // Keeps "a big ball lands on a cluster" from depending on sub-pixel timing.
  var CONTACT_SKIN_RATIO = 0.15;  // x ball radius
  var CONTACT_SKIN_MIN = 2;       // px
  var SEPARATION_ITERATIONS = 4;
  // hardness -> lowpass cutoff (Hz), exponential 500 Hz .. 12 kHz
  var CUTOFF_SOFT = 500, CUTOFF_HARD = 12000;
  function cutoffForHardness(h) {
    return CUTOFF_SOFT * Math.pow(CUTOFF_HARD / CUTOFF_SOFT, clamp(h, 0, 1));
  }
  // hardness -> attack (s), 5 ms (hard) .. 20 ms (soft)
  function attackForHardness(h) {
    return 0.005 + (1 - clamp(h, 0, 1)) * 0.015;
  }

  // ---------- bounds ----------
  var BOUNDS_MIN_PX = 140;        // minimum bounds width/height
  var BOUNDS_MIN_DIAMETERS = 3;   // and at least this many ball diameters
  var BOUNDS_MAX_SPEEDUP = 2.5;   // speed multiplier at the minimum bounds

  // C major pentatonic from C3 (MIDI 48) to C6 (MIDI 84)
  var PENTATONIC_STEPS = [0, 2, 4, 7, 9];
  var NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
  var SCALE = (function () {
    var notes = [];
    for (var octave = 3; octave <= 5; octave++) {
      for (var i = 0; i < PENTATONIC_STEPS.length; i++) {
        notes.push(12 * (octave + 1) + PENTATONIC_STEPS[i]);
      }
    }
    notes.push(84); // C6
    return notes.map(function (midi) {
      return {
        midi: midi,
        freq: 440 * Math.pow(2, (midi - 69) / 12),
        name: NOTE_NAMES[midi % 12] + (Math.floor(midi / 12) - 1)
      };
    });
  })();

  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

  // decay normalized 0..1 <-> seconds (exponential)
  function decayFromNorm(n) {
    return DECAY_MIN * Math.pow(DECAY_MAX / DECAY_MIN, clamp(n, 0, 1));
  }
  function normFromDecay(sec) {
    return Math.log(sec / DECAY_MIN) / Math.log(DECAY_MAX / DECAY_MIN);
  }

  // ---------- Sim ----------
  function Sim() {
    this.width = 1;
    this.height = 1;
    this.time = 0;              // simulation clock (seconds)
    this.accumulator = 0;
    this.nextId = 1;
    this.characters = [];       // { id, type, x, y, decayNorm, reverb, delay, lastHit }
    this.ballType = DEFAULT_BALL;
    this.ball = { x: 0.5, y: 0.5, vx: 0, vy: 0, r: BALLS[DEFAULT_BALL].radius };
    this.bounds = { left: 0, top: 0, right: 1, bottom: 1 };   // ball area inside the play area
    this.speed = speedForRadius(this.ball.r);
    this.charRadius = 32;
    this.onHit = null;          // function (character, hit) {}  hit = { cutoff, attack }
    this._initialized = false;
  }

  Sim.MAX_CHARACTERS = MAX_CHARACTERS;
  Sim.SCALE = SCALE;
  Sim.BALLS = BALLS;
  Sim.DEFAULT_DECAY_NORM = normFromDecay(DEFAULT_DECAY);
  Sim.decayFromNorm = decayFromNorm;
  Sim.speedForRadius = speedForRadius;
  Sim.BALL_R_MAX = BALL_R_MAX;
  Sim.cutoffForHardness = cutoffForHardness;
  Sim.attackForHardness = attackForHardness;

  // Set play area size. Positions and bounds are scaled proportionally and clamped.
  Sim.prototype.setBounds = function (w, h) {
    w = Math.max(1, w);
    h = Math.max(1, h);
    var oldW = this.width, oldH = this.height;
    this.charRadius = clamp(Math.min(w, h) * 0.075, 26, 46);

    if (!this._initialized) {
      this.width = w;
      this.height = h;
      this.bounds = { left: 0, top: 0, right: w, bottom: h };
      this.ball.x = w * 0.5;
      this.ball.y = h * 0.5;
      var a = 0.62; // fixed launch angle (radians)
      this.ball.vx = Math.cos(a);
      this.ball.vy = -Math.sin(a);
      this._initialized = true;
      this._updateSpeed();
      return;
    }

    var sx = w / oldW, sy = h / oldH;
    this.width = w;
    this.height = h;
    var R = this.charRadius;
    for (var i = 0; i < this.characters.length; i++) {
      var c = this.characters[i];
      c.x = clamp(c.x * sx, R, w - R);
      c.y = clamp(c.y * sy, R, h - R);
    }
    var bd = this.bounds;
    bd.left *= sx; bd.right *= sx;
    bd.top *= sy; bd.bottom *= sy;
    this.ball.x *= sx;
    this.ball.y *= sy;
    this._enforceBounds();
  };

  // ---------- ball type ----------
  Sim.prototype.setBallType = function (index) {
    index = clamp(Math.round(index), 0, BALLS.length - 1);
    this.ballType = index;
    this.ball.r = BALLS[index].radius;
    this._enforceBounds();   // also refreshes speed, keeps direction
  };

  Sim.prototype.ballDef = function () { return BALLS[this.ballType]; };

  // Sound color of the current ball (one note per character per hit).
  Sim.prototype.currentHit = function () {
    var def = BALLS[this.ballType];
    return {
      cutoff: cutoffForHardness(def.hardness),
      attack: attackForHardness(def.hardness)
    };
  };

  // ---------- bounds (ball walls) ----------
  Sim.prototype.minBoundsSize = function () {
    var m = Math.max(BOUNDS_MIN_PX, BOUNDS_MIN_DIAMETERS * 2 * this.ball.r);
    return { w: Math.min(m, this.width), h: Math.min(m, this.height) };
  };

  // side: 'left' | 'right' | 'top' | 'bottom'. value in play area coordinates.
  Sim.prototype.setEdge = function (side, value) {
    var bd = this.bounds, min = this.minBoundsSize();
    if (side === 'left') bd.left = clamp(value, 0, bd.right - min.w);
    else if (side === 'right') bd.right = clamp(value, bd.left + min.w, this.width);
    else if (side === 'top') bd.top = clamp(value, 0, bd.bottom - min.h);
    else if (side === 'bottom') bd.bottom = clamp(value, bd.top + min.h, this.height);
    this._enforceBounds();
  };

  Sim.prototype.resetBounds = function () {
    this.bounds = { left: 0, top: 0, right: this.width, bottom: this.height };
    this._enforceBounds();
  };

  Sim.prototype.isFullBounds = function () {
    var bd = this.bounds;
    return bd.left <= 0.5 && bd.top <= 0.5 && bd.right >= this.width - 0.5 && bd.bottom >= this.height - 0.5;
  };

  // Speed multiplier from bounds area: 1 at full area, BOUNDS_MAX_SPEEDUP at minimum area,
  // log-smooth in between.
  Sim.prototype.boundsSpeedMultiplier = function () {
    var bd = this.bounds, min = this.minBoundsSize();
    var full = this.width * this.height;
    var minArea = min.w * min.h;
    var area = Math.max(minArea, (bd.right - bd.left) * (bd.bottom - bd.top));
    if (minArea >= full) return 1;
    var u = clamp(Math.log(area / full) / Math.log(minArea / full), 0, 1);
    return Math.pow(BOUNDS_MAX_SPEEDUP, u);
  };

  // Keep bounds valid (inside play area, at least the minimum size), keep the ball inside,
  // and refresh the speed.
  Sim.prototype._enforceBounds = function () {
    var bd = this.bounds, min = this.minBoundsSize();
    bd.left = clamp(bd.left, 0, this.width);
    bd.right = clamp(bd.right, 0, this.width);
    bd.top = clamp(bd.top, 0, this.height);
    bd.bottom = clamp(bd.bottom, 0, this.height);
    if (bd.right - bd.left < min.w) {

        d = Math.sqrt(d2);
        if (d < 1e-6) { b.y = c.y - minDist; }

      c.prevHitR = c.hitR;
      c.hitR = this.ball.r;      // radius of the ball that made this hit

    reverbReturn.gain.value = 0.9;

   * p = {
   *   wave: 'sine'|'triangle'|'sawtooth'|'square', freq, decay (s),
   *   reverb 0..1, delay 0..1, pan -1..1,
   *   cutoff (Hz, optional)   ball-hardness lowpass,

  Audio.prototype.trigger = function (p) {

    var decay = Math.max(0.02, p.decay);
    var tEnd = t0 + attack + decay;

    var osc = ctx.createOscillator();
    osc.type = p.wave;
    osc.frequency.setValueAtTime(p.freq, t0);

    var nodes = [osc];
    var head = osc;

    // One lowpass: the lower of the ball-hardness cutoff and the
    // saw/pulse softening cutoff (6 x fundamental, max 8 kHz).
    var cutoff = p.cutoff > 0 ? p.cutoff : Infinity;
    if (p.wave === 'sawtooth' || p.wave === 'square') {

      lp.type = 'lowpass';
      lp.frequency.value = Math.max(40, Math.min(cutoff, ctx.sampleRate * 0.45));
      lp.Q.value = 0.5;
      head.connect(lp);
      head = lp;
      nodes.push(lp);

    var env = ctx.createGain();
    var peak = PEAK * (LEVEL[p.wave] || 1);

    nodes.push(env);

    if (ctx.createStereoPanner) {
      var pan = ctx.createStereoPanner();
      pan.pan.value = Math.max(-1, Math.min(1, p.pan || 0));
      head.connect(pan);
      head = pan;

    head.connect(this.master);

      ds.gain.value = p.delay;
      head.connect(ds);
      ds.connect(this.delayIn);
      nodes.push(ds);

      for (var i = 0; i < nodes.length; i++) {
        try { nodes[i].disconnect(); } catch (e) { /* already disconnected */ }

    osc.start(t0);
    osc.stop(tEnd + 0.03);
  };

    return Math.exp(-(age - PULSE_ATTACK) * PULSE_DECAY);

  // ---------- waveforms (phase 0..1 -> -1..1, positive = up) ----------
  function waveValue(wave, ph) {

    if (wave === 'sine') return Math.sin(ph * TAU);
    if (wave === 'triangle') return ph < 0.25 ? ph * 4 : (ph < 0.75 ? 2 - ph * 4 : ph * 4 - 4);
    if (wave === 'sawtooth') return 2 * ph - 1;
    return ph < 0.5 ? 1 : -1;

  var BREAKS = {
    triangle: [[0.25, 1, 1], [0.75, -1, -1]],
    sawtooth: [[0, 1, -1]],
    square:   [[0, -1, 1], [0.5, 1, -1]]
  };

  // Polyline of the head line for phase range p0 .. p0 + cycles, as [u, value]
  // with u 0..1 across the width. Corners and vertical jumps are exact.
  function headLine(wave, p0, cycles) {
    var pts = [], i;
    var p1 = p0 + cycles;
    if (wave === 'sine') {
      var n = Math.max(24, Math.ceil(cycles * 28));
      for (i = 0; i <= n; i++) {
        var p = p0 + cycles * i / n;
        pts.push([i / n, waveValue(wave, p)]);

      return pts;
    }
    var marks = [];
    var br = BREAKS[wave];
    for (var k = Math.floor(p0) - 1; k <= Math.ceil(p1) + 1; k++) {

        var bp = k + br[i][0];
        if (bp > p0 + 1e-9 && bp < p1 - 1e-9) marks.push({ p: bp, before: br[i][1], after: br[i][2] });

    marks.sort(function (a, b) { return a.p - b.p; });
    pts.push([0, waveValue(wave, p0)]);
    for (i = 0; i < marks.length; i++) {
      var u = (marks[i].p - p0) / cycles;
      pts.push([u, marks[i].before]);
      if (marks[i].after !== marks[i].before) pts.push([u, marks[i].after]);

    pts.push([1, waveValue(wave, p1 - 1e-9)]);

  }

  // lw: line width in face units; ey, my: eye and mouth rows relative to the center;
  // lid: 0 open .. 1 closed; t: time (for the dizzy spin).
  function eyeDot(g, ex, ey, er, lid, lw) {
    g.beginPath();
    if (lid > 0.75) {
      g.moveTo(ex - er, ey);
      g.lineTo(ex + er, ey);

          g.lineTo(ox + 0.02, cy - 0.04);

      if (e.eyes === 'arc') { mw *= 1.1; md *= 1.25; }

      g.quadraticCurveTo(0, my + md * 2, mw, my);
      g.stroke();

      mw = 0.13 * breathe; md = 0.075 * breathe;
      g.moveTo(-mw, my + 0.02);
      g.quadraticCurveTo(0, my + 0.02 + md * 2, mw, my + 0.02);
      g.stroke();
    } else if (e.mouth === 'open') {
      mw = 0.2 * breathe; md = 0.17 * breathe;
      g.moveTo(-mw, my - 0.01);
      g.quadraticCurveTo(0, my - 0.01 + md * 2, mw, my - 0.01);
      g.closePath();
      g.fill();
      g.stroke();
    } else if (e.mouth === 'o') {
      g.arc(0, my + 0.07, 0.085 * breathe, 0, TAU);
      g.stroke();
    } else if (e.mouth === 'flat') {
      g.moveTo(-0.1, my + 0.06);
      g.lineTo(0.1, my + 0.06);
      g.stroke();
    } else if (e.mouth === 'slant') {
      g.moveTo(-0.13, my + 0.1);
      g.lineTo(0.12, my + 0.03);
      g.stroke();
    } else if (e.mouth === 'tongue') {
      mw = 0.2 * breathe; md = 0.07 * breathe;
      g.moveTo(-mw, my);
      g.quadraticCurveTo(0, my + md * 2, mw, my);
      g.stroke();

      g.beginPath();
      g.arc(0.06, my + md - 0.01, 0.095, 0, Math.PI);
      g.closePath();
      g.fill();
    } else if (e.mouth === 'wavy') {
      var n = 14;
      for (var i = 0; i <= n; i++) {
        var u = i / n;
        var px = -0.17 + 0.34 * u, py = my + 0.06 + 0.04 * Math.sin(u * Math.PI * 3);
        if (i === 0) g.moveTo(px, py); else g.lineTo(px, py);

      g.lineWidth = lw * 0.85;
      g.stroke();
    }
  }

  /*
   * draw(g, def, x, y, r, anim)
   *   g     2D context
   *   def   entry of CHARACTERS
   *   x, y  center, r radius (bounce radius)
   *   anim  { t: seconds, lastHit, prevHit: seconds on the same clock as t,
   *           hitCount: hits so far, hitR / prevHitR: ball radius of the
   *           last / previous hit,
   *           seed: 0..1 per instance }

   */
  function draw(g, def, x, y, r, anim) {
    if (def._img && !def._imgFailed) {
      g.save();
      g.beginPath();
      g.arc(x, y, r, 0, TAU);
      g.clip();

      var sc = (2 * r) / Math.min(iw, ih);

    }

    var seed = anim ? anim.seed : 0;
    var count = anim && anim.hitCount ? anim.hitCount : 0;
    var hitR = anim && anim.hitR ? anim.hitR : 0;
    var prevHitR = anim && anim.prevHitR ? anim.prevHitR : 0;
    var age = anim ? t - anim.lastHit : -1;
    var agePrev = anim && anim.prevHit !== undefined ? t - anim.prevHit : -1;
    // max of the last two pulses: continuous even when hits come 0.1 s apart
    var pulse = Math.max(pulseEnv(age), pulseEnv(agePrev));

    // expression and the short swap transition at the hit
    var exprIndex = expressionFor(seed, count, hitR);
    var swap = 1;
    if (count > 0 && age >= 0 && age < 2 * SWAP_HALF) {
      if (age < SWAP_HALF) {
        // previous face shrinking
        exprIndex = expressionFor(seed, count - 1, prevHitR);
        swap = 1 - (1 - SWAP_MIN) * (age / SWAP_HALF);
      } else {
        swap = SWAP_MIN + (1 - SWAP_MIN) * ((age - SWAP_HALF) / SWAP_HALF);
      }
    }
    var expr = EXPRESSIONS[exprIndex];

    // faint body disc (the area the ball bounces off)
    g.beginPath();
    g.arc(x, y, r, 0, TAU);
    g.fillStyle = rgbStr(def.rgb, BODY_ALPHA);
    g.fill();

    var lwPx = Math.max(1.6, r * LINE_W);
    g.save();
    g.strokeStyle = def.color;
    g.fillStyle = def.color;
    g.lineWidth = lwPx;
    g.lineCap = 'round';
    g.lineJoin = 'round';

    // head line: the character's own waveform, scrolling at a constant rate
    // (phase depends on time only, so it is always continuous); taller on a hit,
    // with the bottom edge fixed so the line never reaches the eyes
    var phase = def.phase0 + t * FLOW + seed;
    var amp = def.amp * r * (1 + HIT_AMP * pulse);
    var pts = headLine(def.wave, phase, def.cycles);
    var x0 = x - WAVE_HALF_W * r, ww = 2 * WAVE_HALF_W * r;
    var wy = y + WAVE_BOTTOM * r - amp;
    g.beginPath();
    for (var i = 0; i < pts.length; i++) {
      var px = x0 + pts[i][0] * ww, py = wy - pts[i][1] * amp;
      if (i === 0) g.moveTo(px, py); else g.lineTo(px, py);
    }
    g.stroke();

    // face features in face units, scaled by the hit pulse and the swap transition
    var bob = BOB_AMP * Math.sin(TAU * (t / BOB_PERIOD + seed)) - HIT_LIFT * pulse;
    var glanceX = GLANCE_AMP * Math.sin(TAU * (t / GLANCE_PERIOD + seed * 1.37));
    var period = BLINK_MIN + seed * BLINK_SPREAD;
    var bph = ((t + seed * 7.3) % period + period) % period;
    var lid = bph < BLINK_LEN ? Math.sin(Math.PI * bph / BLINK_LEN) : 0;   // 0 open .. 1 closed
    if (pulse > 0) lid = 0;
    var breathe = 1 + SMILE_AMP * Math.sin(TAU * (t / SMILE_PERIOD + seed * 2.1));
    var s = swap * (1 + HIT_FEATURE * pulse);

    g.translate(x + def.faceDx * r, y + (FACE_CY + bob) * r);
    g.scale(r * s, r * s);
    drawFeatures(g, def, expr, lwPx / (r * s), lid, breathe, t, glanceX);
    g.restore();
  }

  // Per-instance seed from an integer id (golden-ratio spacing, deterministic).
  function seedForId(id) { return frac(id * 0.6180339887498949); }

  global.OSCFace = {
    CHARACTERS: CHARACTERS,
    EXPRESSIONS: EXPRESSIONS,
    draw: draw,
    seedForId: seedForId,
    expressionFor: expressionFor,
    headLine: headLine
  };
})(typeof window !== 'undefined' ? window : this);

  <script data-src="ui.js">
/*

(function () {

    stroke: '#2c2c2c',
    gridLine: 'rgba(255,255,255,0.05)',
    gridLineC: 'rgba(255,255,255,0.11)',

  };
  var LANG_KEY = 'oscbounce.lang';

  function detectLang() {
    var list = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || ''];
    var first = String(list[0] || '').toLowerCase();
    if (first.indexOf('ja') === 0) return 'ja';
    if (first.indexOf('zh') === 0) return 'zh';

    try {

    } catch (e) { /* storage unavailable (file://, private mode) */ }
    return detectLang();
  }
  function saveLang(v) {
    try { window.localStorage.setItem(LANG_KEY, v); } catch (e) { /* ignore */ }
  }

  var lang = loadLang();

  function applyLang() {
    var s = STRINGS[lang];
    document.documentElement.lang = s.htmlLang;
    langBtn.textContent = s.button;
    helpTop.textContent = s.helpTop;
    helpBottom.textContent = s.helpBottom;
    clearBtn.textContent = s.clear;
    removeBtn.textContent = s.remove;
    closeBtn.textContent = s.close;
    faders.forEach(function (f) {

    });

  var sim = new window.OSCSim();
  var audio = new window.OSCAudio();

  var selectedType = 0;
  var panelCharId = null;
  var area = { x: 0, y: 0, w: 1, h: 1 };
  var dpr = 1;
  var pointers = {};          // pointerId -> state
  var rejects = [];           // { x, y, t }
  var lastCount = -1;
  var rejectTimer = null;

  // ---------- palette ----------
  var pickButtons = [];
  CHARACTERS.forEach(function (def, index) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'pick';
    btn.style.setProperty('--pick-color', def.color);
    var icon = document.createElement('canvas');
    var label = document.createElement('span');
    label.textContent = def.label;
    btn.appendChild(icon);
    btn.appendChild(label);
    btn.addEventListener('click', function () { selectType(index); });
    picks.appendChild(btn);
    pickButtons.push({ btn: btn, icon: icon });
  });

  // ---------- ball button + ball picker ----------
  var ballBtn = document.createElement('button');
  ballBtn.type = 'button';
  ballBtn.className = 'pick ballbtn';
  var ballBtnIcon = document.createElement('canvas');
  var ballBtnLabel = document.createElement('span');
  ballBtnLabel.textContent = 'BALL';
  ballBtn.appendChild(ballBtnIcon);
  ballBtn.appendChild(ballBtnLabel);
  picks.appendChild(ballBtn);

  var ballPanel = document.getElementById('ballpanel');
  var ballItems = [];
  BALLS.forEach(function (def, index) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'ballitem';
    var icon = document.createElement('canvas');
    var label = document.createElement('span');
    label.textContent = def.label;
    b.appendChild(icon);
    b.appendChild(label);
    b.addEventListener('click', function () {
      sim.setBallType(index);
      closeBallPanel();
      drawBallIcons();
    });
    ballPanel.appendChild(b);
    ballItems.push({ btn: b, icon: icon });
  });

  // Icon radius keeps the size order of the balls and always fits the cell.
  // Square-root scale, so the smallest ball stays visible next to the largest.
  function iconBallRadius(def, size) {
    var maxR = size / 2 - 2;
    return Math.max(3, maxR * Math.sqrt(def.radius / window.OSCSim.BALL_R_MAX));
  }

  function paintIcon(canvasEl, fallbackSize, paint) {
    var size = canvasEl.clientWidth || fallbackSize;
    canvasEl.width = Math.round(size * dpr);
    canvasEl.height = Math.round(size * dpr);
    var g = canvasEl.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, size, size);
    paint(g, size);
  }

  function drawBallIcons() {
    var cur = sim.ballDef();
    paintIcon(ballBtnIcon, 40, function (g, size) {
      drawBall(g, cur, size / 2, size / 2, iconBallRadius(cur, size));
    });
    ballItems.forEach(function (it, i) {
      it.btn.classList.toggle('selected', i === sim.ballType);
      if (ballPanel.hidden) return;
      paintIcon(it.icon, 36, function (g, size) {
        drawBall(g, BALLS[i], size / 2, size / 2, iconBallRadius(BALLS[i], size));
      });
    });
  }

  function openBallPanel() {
    closePanel();
    ballPanel.hidden = false;
    drawBallIcons();
    var vw = window.innerWidth;
    var pw = ballPanel.offsetWidth, ph = ballPanel.offsetHeight;
    var tcs = getComputedStyle(topbar);
    var minY = (parseFloat(tcs.paddingTop) || 0) + 8;
    var pb = palette.getBoundingClientRect();
    var top = Math.max(minY, pb.top - ph - 8);
    var left = clamp((vw - pw) / 2, 8, Math.max(8, vw - pw - 8));
    ballPanel.style.left = Math.round(left) + 'px';
    ballPanel.style.top = Math.round(top) + 'px';
    ballBtn.classList.add('selected');
  }

  function closeBallPanel() {
    ballPanel.hidden = true;
    ballBtn.classList.remove('selected');
  }

  ballBtn.addEventListener('click', function () {
    if (ballPanel.hidden) openBallPanel(); else closeBallPanel();
  });

  function selectType(index) {
    selectedType = index;
    pickButtons.forEach(function (p, i) { p.btn.classList.toggle('selected', i === index); });
  }

  // Palette icons are animated (same drawing as the field, never hit).
  // Size is set here (on layout); paintPaletteIcons runs every frame.
  function drawPaletteIcons() {
    pickButtons.forEach(function (p) {
      var size = p.icon.clientWidth || 40;
      p.size = size;
      p.icon.width = Math.round(size * dpr);
      p.icon.height = Math.round(size * dpr);
      p.g = p.icon.getContext('2d');
    });
    paintPaletteIcons();
  }

  function paintPaletteIcons() {
    var t = sim.time;
    pickButtons.forEach(function (p, i) {
      if (!p.g) return;
      var size = p.size;
      p.g.setTransform(dpr, 0, 0, dpr, 0, 0);
      p.g.clearRect(0, 0, size, size);
      drawCharacter(p.g, CHARACTERS[i], size / 2, size / 2, size / 2 - 2,
                    { t: t, lastHit: -1000, seed: Face.seedForId(i + 101) });
    });
  }

  // ---------- layout ----------
  function layout() {
    dpr = window.devicePixelRatio || 1;
    var vw = window.innerWidth, vh = window.innerHeight;
    canvas.width = Math.round(vw * dpr);
    canvas.height = Math.round(vh * dpr);

    var tb = topbar.getBoundingClientRect();
    var pb = palette.getBoundingClientRect();
    var tcs = getComputedStyle(topbar);
    var padL = parseFloat(tcs.paddingLeft) || 8;
    var padR = parseFloat(tcs.paddingRight) || 8;

    area.x = padL;
    area.y = tb.bottom;
    area.w = Math.max(1, vw - padL - padR);
    area.h = Math.max(1, pb.top - tb.bottom);
    sim.setBounds(area.w, area.h);

    closePanel();
    closeBallPanel();
    drawPaletteIcons();
    drawBallIcons();
  }

  function toArea(e) {
    return { x: e.clientX - area.x, y: e.clientY - area.y };
  }
  function inArea(p) {
    return p.x >= 0 && p.y >= 0 && p.x <= area.w && p.y <= area.h;
  }

  // ---------- panel ----------
  function paramValue(c, name) {
    if (name === 'decay') return c.decayNorm;
    if (name === 'reverb') return c.reverb;
    return c.delay;
  }
  function setParam(c, name, v) {
    v = clamp(v, 0, 1);
    if (name === 'decay') c.decayNorm = v;
    else if (name === 'reverb') c.reverb = v;
    else c.delay = v;
  }
  function refreshFaders() {
    var c = sim.getCharacter(panelCharId);
    if (!c) return;
    faders.forEach(function (f) {
      f.querySelector('.fill').style.width = (paramValue(c, f.dataset.param) * 100) + '%';
    });
  }

  function openPanel(c) {
    panelCharId = c.id;
    var def = CHARACTERS[c.type];
    panel.style.setProperty('--fader-color', def.color);
    refreshFaders();
    panel.hidden = false;

    var pw = panel.offsetWidth, ph = panel.offsetHeight;
    var vw = window.innerWidth, vh = window.innerHeight;
    var tcs = getComputedStyle(topbar), pcs = getComputedStyle(palette);
    var margin = 8;
    var minX = (parseFloat(tcs.paddingLeft) || 0) + margin - 8;
    var maxX = vw - (parseFloat(tcs.paddingRight) || 0) + 8 - margin - pw;
    var minY = (parseFloat(tcs.paddingTop) || 0) + margin;
    var maxY = vh - (parseFloat(pcs.paddingBottom) || 0) - margin - ph;

    maxX = Math.max(minX, maxX);
    maxY = Math.max(minY, maxY);

    // Candidate sides in order: right, left, below, above.
    // The first one that fits entirely on screen wins. If none fits, the clamped
    // candidate that overlaps the character the least is used, so the panel
    // never needlessly covers the character it edits.
    var sx = area.x + c.x, sy = area.y + c.y;
    var R = sim.charRadius;
    var gap = R + 12;
    var candidates = [
      { left: sx + gap, top: sy - ph / 2 },
      { left: sx - gap - pw, top: sy - ph / 2 },
      { left: sx - pw / 2, top: sy + gap },
      { left: sx - pw / 2, top: sy - gap - ph }
    ];
    var best = null, bestOverlap = Infinity;
    for (var i = 0; i < candidates.length; i++) {
      var cand = candidates[i];
      // side placements (right/left) may slide vertically without covering the
      // character, so only their horizontal fit matters; above/below may slide
      // horizontally, so only their vertical fit matters.
      var fitsX = cand.left >= minX && cand.left <= maxX;
      var fitsY = cand.top >= minY && cand.top <= maxY;
      var fits = i < 2 ? fitsX : fitsY;
      var l = clamp(cand.left, minX, maxX);
      var t = clamp(cand.top, minY, maxY);
      if (fits) { best = { left: l, top: t }; break; }
      var ox = Math.max(0, Math.min(l + pw, sx + R) - Math.max(l, sx - R));
      var oy = Math.max(0, Math.min(t + ph, sy + R) - Math.max(t, sy - R));
      var overlap = ox * oy;
      if (overlap < bestOverlap) { bestOverlap = overlap; best = { left: l, top: t }; }
    }
    if (!best) best = { left: minX, top: minY };
    panel.style.left = Math.round(best.left) + 'px';
    panel.style.top = Math.round(best.top) + 'px';
  }

  function closePanel() {
    panelCharId = null;
    panel.hidden = true;
  }

  faders.forEach(function (f) {
    var name = f.dataset.param;
    function apply(e) {
      var c = sim.getCharacter(panelCharId);
      if (!c) return;
      var rect = f.getBoundingClientRect();
      setParam(c, name, (e.clientX - rect.left) / rect.width);
      refreshFaders();
    }
    f.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      f.setPointerCapture(e.pointerId);
      apply(e);
    });
    f.addEventListener('pointermove', function (e) {
      if (f.hasPointerCapture && f.hasPointerCapture(e.pointerId)) apply(e);
    });
  });

  removeBtn.addEventListener('click', function () {
    if (panelCharId !== null) sim.removeCharacter(panelCharId);
    closePanel();
  });

  closeBtn.addEventListener('click', function () {
    closePanel();
  });

  clearBtn.addEventListener('click', function () {
    sim.clear();
    closePanel();
  });

  langBtn.addEventListener('click', function () {
    lang = LANGS[(LANGS.indexOf(lang) + 1) % LANGS.length];
    saveLang(lang);
    applyLang();
    layout();   // help text height differs per language
  });

  // ---------- audio unlock + outside-click close ----------
  function unlockAudio() { audio.ensure(); }

  // Pressing anywhere outside the panel closes it. Presses on the stage canvas are
  // handled by the canvas handler instead (it closes the panel itself and decides
  // whether to place, switch, or just close).
  // The ball picker closes on any press outside it (except the BALL button, which
  // toggles it); a press on the stage that closes the picker does nothing else.
  var swallowPointerId = null;
  document.addEventListener('pointerdown', function (e) {
    unlockAudio();
    if (!panel.hidden && !panel.contains(e.target) && e.target !== canvas) {
      closePanel();
    }
    if (!ballPanel.hidden && !ballPanel.contains(e.target) && !ballBtn.contains(e.target)) {
      closeBallPanel();
      if (e.target === canvas) swallowPointerId = e.pointerId;
    }
  }, true);
  document.addEventListener('pointerup', unlockAudio, true);
  document.addEventListener('touchend', unlockAudio, { capture: true, passive: true });
  document.addEventListener('click', unlockAudio, true);

  // block zoom / context menus
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  document.addEventListener('dblclick', function (e) { e.preventDefault(); });
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  // ---------- stage pointer handling ----------
  function reject(p) {
    rejects.push({ x: p.x, y: p.y, t: performance.now() / 1000 });
    countEl.classList.add('reject');
    if (rejectTimer) clearTimeout(rejectTimer);
    rejectTimer = setTimeout(function () { countEl.classList.remove('reject'); }, 420);
  }

  // ---------- bounds handles ----------
  var HANDLE_LEN = 44;        // drawn bar length
  var HANDLE_THICK = 6;       // drawn bar thickness
  var HANDLE_HIT_LEN = 72;    // touch zone along the edge
  var HANDLE_HIT_THICK = 44;  // touch zone across the edge
  var DOUBLE_TAP = 0.35;      // seconds
  var lastHandleTap = -10;

  // Touch zones in play-area coordinates, shifted inward so the full 44 px is
  // inside the play area even when the bounds sit on the outer edge.
  function handleZones() {
    var bd = sim.bounds;
    var cx = (bd.left + bd.right) / 2, cy = (bd.top + bd.bottom) / 2;
    var t = HANDLE_HIT_THICK, L = HANDLE_HIT_LEN;
    function fit(x, y, w, h) {
      return { x: clamp(x, 0, area.w - w), y: clamp(y, 0, area.h - h), w: w, h: h };
    }
    return [
      { side: 'top',    r: fit(cx - L / 2, bd.top - t / 2, L, t) },
      { side: 'bottom', r: fit(cx - L / 2, bd.bottom - t / 2, L, t) },
      { side: 'left',   r: fit(bd.left - t / 2, cy - L / 2, t, L) },
      { side: 'right',  r: fit(bd.right - t / 2, cy - L / 2, t, L) }
    ];
  }

  function handleAt(p) {
    var zones = handleZones();
    for (var i = 0; i < zones.length; i++) {
      var r = zones[i].r;
      if (p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h) return zones[i].side;
    }
    return null;
  }

  function edgeValue(side) {
    var bd = sim.bounds;
    return side === 'top' ? bd.top : side === 'bottom' ? bd.bottom : side === 'left' ? bd.left : bd.right;
  }

  canvas.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    if (swallowPointerId === e.pointerId) { swallowPointerId = null; return; }
    var openId = panelCharId;   // panel that was open before this press
    closePanel();
    var p = toArea(e);
    if (!inArea(p)) return;

    // bounds handles take priority over characters and placement
    var side = handleAt(p);
    if (side) {
      var vertical = side === 'top' || side === 'bottom';
      pointers[e.pointerId] = {
        handle: side,
        grab: edgeValue(side) - (vertical ? p.y : p.x),
        startX: e.clientX,
        startY: e.clientY,
        moved: false
      };
      try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
      return;
    }

    var c = sim.hitTest(p.x, p.y, 4);
    var isNew = false;
    if (!c) {
      // empty spot: place a new character (its panel opens on release)
      if (!sim.canAdd()) { reject(p); return; }
      c = sim.addCharacter(selectedType, p.x, p.y);
      if (!c) { reject(p); return; }
      isNew = true;
    }
    pointers[e.pointerId] = {
      charId: c.id,
      startX: e.clientX,
      startY: e.clientY,
      offX: c.x - p.x,
      offY: c.y - p.y,
      moved: false,
      isNew: isNew,
      wasOpen: c.id === openId  // pressing the character whose panel was open
    };
    try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  });

  canvas.addEventListener('pointermove', function (e) {
    var st = pointers[e.pointerId];
    if (!st) return;
    if (!st.moved) {
      var dx = e.clientX - st.startX, dy = e.clientY - st.startY;
      if (dx * dx + dy * dy < TAP_SLOP * TAP_SLOP) return;
      st.moved = true;
    }
    var p = toArea(e);
    if (st.handle) {
      var vertical = st.handle === 'top' || st.handle === 'bottom';
      sim.setEdge(st.handle, (vertical ? p.y : p.x) + st.grab);
      return;
    }
    sim.moveCharacter(st.charId, p.x + st.offX, p.y + st.offY);
  });

  function endPointer(e, cancelled) {
    var st = pointers[e.pointerId];
    if (!st) return;
    delete pointers[e.pointerId];
    if (cancelled) return;
    if (st.handle) {
      // double tap on any handle resets all four edges
      if (!st.moved) {
        var now = performance.now() / 1000;
        if (now - lastHandleTap <= DOUBLE_TAP) {
          sim.resetBounds();
          lastHandleTap = -10;
        } else {
          lastHandleTap = now;
        }
      }
      return;
    }
    var c = sim.getCharacter(st.charId);
    if (!c) return;
    // Rules on release:
    //  new character (tap or drag)         -> open its panel at the final position
    //  tap on the character already open   -> stays closed (tap toggles it off)
    //  tap on another character            -> open that character's panel
    //  drag the character that was open    -> reopen at the final position
    //  drag any other character            -> no panel
    var open;
    if (st.isNew) open = true;
    else if (!st.moved) open = !st.wasOpen;
    else open = st.wasOpen;
    if (open) openPanel(c);
  }
  canvas.addEventListener('pointerup', function (e) { endPointer(e, false); });
  canvas.addEventListener('pointercancel', function (e) { endPointer(e, true); });

  // ---------- sound hookup ----------
  sim.onHit = function (c, hit) {
    var def = CHARACTERS[c.type];
    audio.trigger({
      wave: def.wave,
      freq: sim.noteForY(c.y).freq,
      decay: sim.decaySeconds(c),
      reverb: c.reverb,
      delay: c.delay,
      pan: sim.panForX(c.x),
      cutoff: hit.cutoff,
      attack: hit.attack
    });
  };

  // ---------- rendering ----------
  function roundRectPath(g, x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y);
    g.lineTo(x + w - r, y);
    g.arcTo(x + w, y, x + w, y + r, r);
    g.lineTo(x + w, y + h - r);
    g.arcTo(x + w, y + h, x + w - r, y + h, r);
    g.lineTo(x + r, y + h);
    g.arcTo(x, y + h, x, y + h - r, r);
    g.lineTo(x, y + r);
    g.arcTo(x, y, x + r, y, r);
    g.closePath();
  }

  function draggedNotes() {
    var map = {};
    for (var id in pointers) {
      var st = pointers[id];
      if (!st.moved) continue;
      var c = sim.getCharacter(st.charId);
      if (c) map[c.id] = c;
    }
    return map;
  }

  function render() {
    var vw = canvas.width / dpr, vh = canvas.height / dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = COLOR.bgBase;
    ctx.fillRect(0, 0, vw, vh);

    ctx.save();
    roundRectPath(ctx, area.x, area.y, area.w, area.h, AREA_RADIUS);
    ctx.fillStyle = COLOR.bgArea;
    ctx.fill();
    ctx.lineWidth = 1;
    ctx.strokeStyle = COLOR.stroke;
    ctx.stroke();
    ctx.clip();
    ctx.translate(area.x, area.y);

    var dragged = draggedNotes();
    var highlight = {};
    for (var id in dragged) {
      var dc = dragged[id];
      highlight[sim.noteIndexForY(dc.y)] = CHARACTERS[dc.type];
    }

    // pitch grid (lines only, no note names)
    var scale = window.OSCSim.SCALE;
    for (var i = 0; i < scale.length; i++) {
      var gy = Math.round(sim.yForNoteIndex(i)) + 0.5;
      var isC = scale[i].name.charAt(0) === 'C';
      ctx.beginPath();
      ctx.moveTo(0, gy);
      ctx.lineTo(area.w, gy);
      if (highlight[i]) {
        ctx.strokeStyle = rgbStr(highlight[i].rgb, 0.45);
        ctx.lineWidth = 2;
      } else {
        ctx.strokeStyle = isC ? COLOR.gridLineC : COLOR.gridLine;
        ctx.lineWidth = 1;
      }
      ctx.stroke();
    }

    // ball bounds: dim the outside, draw the boundary line
    var bd = sim.bounds;
    var full = sim.isFullBounds();
    if (!full) {
      ctx.beginPath();
      ctx.rect(0, 0, area.w, area.h);
      ctx.rect(bd.left, bd.top, bd.right - bd.left, bd.bottom - bd.top);
      ctx.fillStyle = 'rgba(0,0,0,0.28)';
      ctx.fill('evenodd');
    }
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = 'rgba(232,232,232,0.4)';
    ctx.strokeRect(bd.left + 0.75, bd.top + 0.75, bd.right - bd.left - 1.5, bd.bottom - bd.top - 1.5);

    // characters (unreachable ones are drawn translucent)
    var now = sim.time;
    var R = sim.charRadius;
    var chars = sim.characters;
    for (var k = 0; k < chars.length; k++) {
      var c = chars[k];
      var def = CHARACTERS[c.type];
      ctx.globalAlpha = sim.isReachable(c) ? 1 : 0.35;
      var age = now - c.lastHit;
      var s = 1;
      if (age >= 0 && age < 0.35) {
        s = 1 + 0.24 * Math.exp(-age * 14);
        var ringA = (1 - age / 0.35) * 0.5;
        ctx.beginPath();
        ctx.arc(c.x, c.y, R * (1.05 + age * 1.6), 0, Math.PI * 2);
        ctx.lineWidth = 2;
        ctx.strokeStyle = rgbStr(def.rgb, ringA);
        ctx.stroke();
      }
      if (c.id === panelCharId) {
        ctx.beginPath();
        ctx.arc(c.x, c.y, R + 6, 0, Math.PI * 2);
        ctx.lineWidth = 2;
        ctx.strokeStyle = COLOR.fgPrimary;
        ctx.stroke();
      }
      drawCharacter(ctx, def, c.x, c.y, R * s, {
        t: now, lastHit: c.lastHit, prevHit: c.prevHit, hitCount: c.hitCount,
        hitR: c.hitR, prevHitR: c.prevHitR, seed: Face.seedForId(c.id)
      });
    }
    ctx.globalAlpha = 1;

    // ball
    var b = sim.ball;
    drawBall(ctx, sim.ballDef(), b.x, b.y, b.r);

    // bounds handles: bar at the middle of each edge, kept fully visible
    var activeHandles = {};
    for (var pid in pointers) { if (pointers[pid].handle) activeHandles[pointers[pid].handle] = true; }
    var hcx = (bd.left + bd.right) / 2, hcy = (bd.top + bd.bottom) / 2;
    var inset = HANDLE_THICK / 2 + 3;
    var bars = [
      { side: 'top',    x: hcx, y: clamp(bd.top, inset, area.h - inset),    horiz: true },
      { side: 'bottom', x: hcx, y: clamp(bd.bottom, inset, area.h - inset), horiz: true },
      { side: 'left',   x: clamp(bd.left, inset, area.w - inset), y: hcy,  horiz: false },
      { side: 'right',  x: clamp(bd.right, inset, area.w - inset), y: hcy, horiz: false }
    ];
    for (var hb = 0; hb < bars.length; hb++) {
      var bar = bars[hb];
      var bw = bar.horiz ? HANDLE_LEN : HANDLE_THICK;
      var bh = bar.horiz ? HANDLE_THICK : HANDLE_LEN;
      roundRectPath(ctx, bar.x - bw / 2, bar.y - bh / 2, bw, bh, HANDLE_THICK / 2);
      ctx.fillStyle = activeHandles[bar.side] ? '#ffffff' : 'rgba(232,232,232,0.7)';
      ctx.fill();
    }

    // rejection feedback (full)
    var tNow = performance.now() / 1000;
    for (var j = rejects.length - 1; j >= 0; j--) {
      var rj = rejects[j];
      var ra = tNow - rj.t;
      if (ra > 0.4) { rejects.splice(j, 1); continue; }
      var a = 1 - ra / 0.4;
      var shake = Math.sin(ra * 60) * 6 * a;
      var rr = R * 0.6;
      ctx.save();
      ctx.translate(rj.x + shake, rj.y);
      ctx.strokeStyle = COLOR.reject + a + ')';
      ctx.lineWidth = 2.5;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(0, 0, rr, 0, Math.PI * 2);
      ctx.moveTo(-rr * 0.707, rr * 0.707);
      ctx.lineTo(rr * 0.707, -rr * 0.707);
      ctx.stroke();
      ctx.restore();
    }

    ctx.restore();

    if (chars.length !== lastCount) {
      lastCount = chars.length;
      countEl.textContent = lastCount + ' / ' + window.OSCSim.MAX_CHARACTERS;
    }
  }

  var lastFrame = null;
  function frame(ts) {
    if (lastFrame !== null) sim.update((ts - lastFrame) / 1000);
    lastFrame = ts;
    render();
    paintPaletteIcons();
    requestAnimationFrame(frame);
  }

  // ---------- boot ----------
  selectType(0);
  applyLang();
  layout();
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', function () { setTimeout(layout, 50); });
  // help text height changes once fonts load (the Chinese font loads on first use)
  if (document.fonts) {
    if (document.fonts.ready) document.fonts.ready.then(layout);
    if (document.fonts.addEventListener) {
      document.fonts.addEventListener('loadingdone', function () {
        // only when the bars actually changed height, so open panels stay open
        var tb = topbar.getBoundingClientRect(), pb = palette.getBoundingClientRect();
        if (Math.abs(tb.bottom - area.y) > 0.5 || Math.abs((pb.top - tb.bottom) - area.h) > 0.5) layout();
      });
    }
  }
  requestAnimationFrame(frame);
})();

</script>
</body>
</html>
