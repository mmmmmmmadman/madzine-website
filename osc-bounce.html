<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex, nofollow">
<title>OSC BOUNCE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300&family=Noto+Sans+JP:wght@300&family=Noto+Sans+TC:wght@300&display=swap" rel="stylesheet">
<style>
  /* White theme (OSC brothers: background white). All grays are pure gray (r = g = b).
     Contrast on white: fg-primary 17.4:1, fg-secondary 7.5:1, fg-dim 4.5:1,
     accent-text 4.9:1, stroke 3.5:1 (3.1:1 on bg-elevated; UI component boundary). */
  :root {
    --bg-base: #ffffff;
    --bg-area: #ffffff;
    --bg-elevated: #f2f2f2;
    --bg-track: #e2e2e2;
    --stroke: #8a8a8a;
    --fg-primary: #1a1a1a;
    --fg-secondary: #555555;
    --fg-dim: #767676;
    --accent: rgb(235, 150, 129);      /* HSB 12, 0.45, 0.92 (fills only) */
    --accent-dim: rgb(153, 121, 113);  /* HSB 12, 0.26, 0.60 */
    --accent-text: rgb(179, 86, 62);   /* HSB 12, 0.65, 0.70 - text on white, 4.9:1 */
    --ink: #1a1a1a;
    /* text inside a filled fader (character color fill). Pure black: SAW red
       rgb(242,5,5) gives 4.8:1 (ink #1a1a1a would be 4.0:1); SINE 10.5, TRI 6.5, PULSE 15.8 */
    --ink-on-fill: #000000;
    --shadow: rgba(0, 0, 0, 0.16);
    --fill-edge: rgba(0, 0, 0, 0.45);
    --font: 'Barlow Condensed', 'Noto Sans JP', 'Noto Sans TC', system-ui, sans-serif;
    --font-help: 'Barlow Condensed', 'Noto Sans JP', 'Noto Sans TC', system-ui, sans-serif;
    --top-h: 56px;
    --palette-h: 76px;
    --gap: 8px;
  }
  /* Latin always Barlow Condensed (it has no CJK glyphs, so CJK falls through).
     Japanese / English: kana and kanji from Noto Sans JP.
     Traditional Chinese: Chinese glyphs from Noto Sans TC, not the Japanese forms.
     Set per element (not only on html) so the hidden help-text measurer in ui.js,
     which carries its own lang attribute, gets the right font for that language. */
  :lang(ja), :lang(en) {
    --font: 'Barlow Condensed', 'Noto Sans JP', 'Noto Sans TC', system-ui, sans-serif;
    --font-help: 'Barlow Condensed', 'Noto Sans JP', 'Noto Sans TC', system-ui, sans-serif;
  }
  :lang(zh) {
    --font: 'Barlow Condensed', 'Noto Sans TC', 'Noto Sans JP', system-ui, sans-serif;
    --font-help: 'Barlow Condensed', 'Noto Sans TC', 'Noto Sans JP', system-ui, sans-serif;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg-base);
    color: var(--fg-primary);
    font-family: var(--font);
    font-weight: 300;
    line-height: 1.2;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  * { box-sizing: border-box; }
  button {
    font-family: var(--font);
    font-weight: 300;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }

  #stage {
    position: fixed;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  /* ---------- top bar ---------- */
  /* #topbar and #palette are wrappers: their bounding boxes define the play area */
  #topbar {
    position: fixed;
    left: 0;
    right: 0;
    top: 0;
    padding: env(safe-area-inset-top) calc(var(--gap) + env(safe-area-inset-right)) 0 calc(var(--gap) + env(safe-area-inset-left));
    display: flex;
    flex-direction: column;
    z-index: 2;
  }
  #topbar .bar {
    height: var(--top-h);
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .help {
    margin: 0;
    font-family: var(--font-help);
    font-weight: 300;
    font-size: 14px;
    line-height: 20px;
    letter-spacing: 0.02em;
    color: var(--fg-secondary);
    text-align: center;
    line-break: strict;
    pointer-events: none;
  }
  #help-top { padding-top: 6px; }
  #help-bottom { padding-bottom: 6px; }
  /* Every short label in the bar stays on one line; only the help text wraps. */
  #title, #count { white-space: nowrap; }
  #title {
    flex: 0 1 auto;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    font-size: 20px;
    letter-spacing: 0.12em;
    color: var(--accent-text);
    line-height: 24px;
  }
  /* OSC brothers logo next to the title (decoration, not interactive).
     Sizes from the measured bar (Barlow Condensed Light: title 108.5 px, count 39.6 px,
     LANG 56 + CLEAR 96): each step is the largest logo that still leaves the title
     uncut; below 389 px wide there is no room and the logo is hidden.
     flex-shrink 100: if the bar is short anyway, the logo gives way before the title. */
  #logo {
    flex: 0 100 auto;
    width: 40px;
    min-width: 0;
    height: auto;
    margin-left: -8px;          /* 8 px from the title (bar gap 16) */
    display: block;
    pointer-events: none;
    -webkit-user-drag: none;
  }
  @media (max-width: 440px) { #logo { width: 32px; } }
  @media (max-width: 420px) { #logo { margin-left: -4px; } }   /* 6 px from the title (bar gap 10) */
  @media (max-width: 394px) { #logo { width: 26px; } }
  @media (max-width: 388px) { #logo { display: none; } }
  #count {
    flex: 0 0 auto;
    font-variant-numeric: tabular-nums;
    font-size: 16px;
    letter-spacing: 0.06em;
    color: var(--fg-secondary);
    line-height: 20px;
    transition: color 0.15s;
  }
  #count.reject { color: var(--fg-primary); }
  #topbar .spacer { flex: 1 1 auto; }
  .textbtn {
    min-width: 88px;
    height: 44px;
    padding: 0 16px;
    background: transparent;
    border: 1px solid var(--stroke);
    border-radius: 8px;
    color: var(--fg-primary);
    font-size: 18px;
    letter-spacing: 0.12em;
    line-height: 20px;
    white-space: nowrap;
    cursor: pointer;
  }
  .textbtn:active { background: var(--bg-track); border-color: var(--fg-dim); }
  /* Fixed widths: switching language never changes the size of these buttons.
     #lang shows one of 中 / 日 / EN; #clear fits the widest label (クリア, about 59 px of text). */
  #lang, #clear { flex: 0 0 auto; min-width: 0; padding: 0; text-align: center; }
  #lang { width: 56px; letter-spacing: 0.06em; }
  #clear { width: 96px; }

  /* ---------- palette ---------- */
  #palette {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 0 calc(var(--gap) + env(safe-area-inset-right)) env(safe-area-inset-bottom) calc(var(--gap) + env(safe-area-inset-left));
    display: flex;
    flex-direction: column;
    z-index: 2;
  }
  #picks {
    height: var(--palette-h);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--gap);
  }
  .pick {
    flex: 0 1 132px;
    min-width: 0;
    height: 64px;
    padding: 0 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background: transparent;
    border: 1px solid var(--stroke);
    border-radius: 10px;
    color: var(--fg-secondary);
    font-size: 16px;
    letter-spacing: 0.06em;
    line-height: 20px;
    white-space: nowrap;
    cursor: pointer;
  }
  .pick canvas { width: 40px; height: 40px; flex: 0 0 40px; display: block; }
  .pick.selected {
    background: var(--bg-track);
    border-color: var(--pick-color, var(--accent));
    color: var(--fg-primary);
  }
  @media (max-width: 420px) {
    :root { --top-h: 52px; --palette-h: 70px; }
    #topbar .bar { gap: 10px; }
    #help-top { padding-top: 4px; }
    #help-bottom { padding-bottom: 4px; }
    .pick { flex-direction: column; gap: 2px; padding: 4px 2px; }
    .pick canvas { width: 32px; height: 32px; flex: 0 0 32px; }
  }

  /* ---------- character panel ---------- */
  #panel {
    position: fixed;
    left: 0;
    top: 0;
    width: 232px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: var(--bg-elevated);
    border: 1px solid var(--stroke);
    border-radius: 12px;
    box-shadow: 0 8px 24px var(--shadow);
    z-index: 5;
  }
  #panel[hidden] { display: none; }
  .fader {
    position: relative;
    width: 208px;
    height: 44px;
    border-radius: 8px;
    background: var(--bg-track);
    outline: 1px solid var(--stroke);   /* track edge on the light panel; drawn above the fill */
    outline-offset: -1px;
    overflow: hidden;
    cursor: pointer;
    touch-action: none;
  }
  .fader .fill {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 0;
    overflow: hidden;
    background: var(--fader-color, var(--accent));
    box-shadow: inset -2px 0 0 var(--fill-edge);   /* value edge stays visible for light colors (PULSE yellow) */
  }
  .fader .label {
    position: absolute;
    left: 0;
    top: 0;
    width: 208px;
    height: 44px;
    padding-left: 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 18px;
    letter-spacing: 0.12em;
    line-height: 20px;
    color: var(--fg-primary);
    pointer-events: none;
    white-space: nowrap;
  }
  .fader .fill .label { color: var(--ink-on-fill); }
  /* icons use currentColor, so they turn dark inside the filled part with the text */
  .fader .label svg { width: 22px; height: 22px; flex: 0 0 22px; display: block; overflow: visible; }
  /* ---------- ball picker ---------- */
  .ballbtn { --pick-color: var(--fg-primary); margin-left: 8px; }
  /* 12 balls. Each cell: icon above label, fixed 104 x 68 px, so switching language
     never changes the panel size. Widest label (WATERMELON, Barlow Condensed Light 16px
     + 0.06em spacing) measures 82 px; the label area is 98 px wide (102 px at 375 px,
     84 px at 320 px viewport width).
     Columns: 6 x 2 rows (>= 720 px wide), 4 x 3 rows (>= 500 px), 3 x 4 rows (phones). */
  #ballpanel {
    position: fixed;
    left: 0;
    top: 0;
    padding: 12px;
    display: grid;
    grid-template-columns: repeat(6, 104px);
    gap: 8px;
    background: var(--bg-elevated);
    border: 1px solid var(--stroke);
    border-radius: 12px;
    box-shadow: 0 8px 24px var(--shadow);
    z-index: 6;
  }
  #ballpanel[hidden] { display: none; }
  .ballitem {
    min-width: 0;
    height: 68px;
    padding: 4px 2px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    background: transparent;
    border: 1px solid var(--stroke);
    border-radius: 8px;
    color: var(--fg-secondary);
    font-size: 16px;
    letter-spacing: 0.06em;
    line-height: 20px;
    white-space: nowrap;
    cursor: pointer;
  }
  .ballitem canvas { width: 36px; height: 36px; flex: 0 0 36px; display: block; }
  .ballitem span { display: block; max-width: 100%; height: 20px; overflow: hidden; text-overflow: ellipsis; }
  .ballitem.selected { background: var(--bg-track); border-color: var(--fg-primary); color: var(--fg-primary); }
  @media (max-width: 719px) {
    #ballpanel { grid-template-columns: repeat(4, 104px); }
  }
  @media (max-width: 499px) {
    #ballpanel { padding: 8px; grid-template-columns: repeat(3, minmax(0, 1fr)); width: min(360px, calc(100vw - 16px)); }
  }

  #panel .row { display: flex; gap: 8px; width: 208px; }
  #panel .row .textbtn { flex: 1 1 0; min-width: 0; padding: 0; }
</style>
</head>

    <div class="bar">

  <script data-src="sim.js">
/*
 * OSC Bounce - simulation core
 * Pure logic. No DOM, no Canvas, no Web Audio.
 * Coordinates are in "play area" units (CSS pixels of the play area, origin top-left).
 * Designed to map 1:1 onto a Swift struct/class later.
 */
(function (global) {
  'use strict';

  // ---------- constants ----------
  var MAX_CHARACTERS = 16;
  var STEP = 1 / 240;            // fixed simulation step in seconds
  var MAX_FRAME_DT = 0.1;        // ignore longer gaps (tab hidden, etc.)
  var RETRIGGER_GUARD = 0.1;     // seconds; same character cannot fire a new hit within this

  var DECAY_MIN = 0.05;          // seconds
  var DECAY_MAX = 2.5;           // seconds
  var DEFAULT_DECAY = 0.4;
  var DEFAULT_REVERB = 0.25;
  var DEFAULT_DELAY = 0.0;
  var PAN_RANGE = 0.7;

  // ---------- ball table (single place; looks are drawn by the UI from `id`) ----------
  // radius: base px (at ball scale 1; actual radius = scaledRadius(radius, ballScale)). hardness: 0 (softest) .. 1 (hardest). color: base color for drawing.
  // image: optional artwork path; UI falls back to Canvas drawing if missing/failed.
  // Sorted small -> large. Large balls can touch several characters at once.
  var BALLS = [
    { id: 'steel',    label: 'STEEL',    radius: 5,  hardness: 1.00, color: [196, 200, 206], image: null,

      ds.gain.value = p.delay;
      head.connect(ds);
      ds.connect(this.delayIn);
      nodes.push(ds);

      for (var i = 0; i < nodes.length; i++) {

    osc.stop(tEnd + 0.03);

  var BODY_ALPHA = 0.13;      // faint disc showing the bounce area

  var BLINK_MIN = 3.2;        // blink period: BLINK_MIN + seed * BLINK_SPREAD seconds

  var BLINK_LEN = 0.15;       // seconds the lids take to close and open

  var GLANCE_AMP = 0.035;

  var SMILE_AMP = 0.08;       // +-8 % mouth size breathing

  var BOB_AMP = 0.02;

  var PULSE_DECAY = 6;
  var PULSE_LEN = 0.7;

  var HIT_FEATURE = 0.22;     // eyes + mouth enlargement at the pulse peak
  var HIT_LIFT = 0.05;        // face lift (x radius) at the pulse peak
  // expression change: old face shrinks, new face grows back (total 100 ms)

  var SWAP_MIN = 0.3;

  var TAU = Math.PI * 2;
  function rgbStr(c, a) {
    return a === undefined ? 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')'

  var EDGE_MIN = 0.6;         // px (palette icons)

  // 2 * e wider, every fill also gets a 2 * e stroke around it. Drawing the
  // features once through this and once normally leaves an e wide outline.
  function edgeCtx(g, e) {
    return {
      beginPath: function () { g.beginPath(); },
      closePath: function () { g.closePath(); },
      moveTo: function (x, y) { g.moveTo(x, y); },
      lineTo: function (x, y) { g.lineTo(x, y); },
      arc: function (x, y, r, a0, a1, ccw) { g.arc(x, y, r, a0, a1, ccw); },
      ellipse: function (x, y, rx, ry, rot, a0, a1, ccw) { g.ellipse(x, y, rx, ry, rot, a0, a1, ccw); },
      quadraticCurveTo: function (cx, cy, x, y) { g.quadraticCurveTo(cx, cy, x, y); },
      stroke: function () { g.stroke(); },

  // ---------- deterministic hash (32-bit integer mix; Swift: &* and >>) ----------
  function hash01(a, b, salt) {
    var h = (a ^ Math.imul(b, 0x9E3779B1) ^ Math.imul(salt, 0x85EBCA77)) >>> 0;
    h ^= h >>> 16; h = Math.imul(h, 0x7FEB352D);
    h ^= h >>> 15; h = Math.imul(h, 0x846CA68B);
    h ^= h >>> 16;

  function seedInt(seed) { return Math.floor(frac(seed) * 4294967296) >>> 0; }

  // Expression index after `count` hits (count 0 = the original smile).
  function expressionFor(seed, count, ballR) {
    if (count <= 0) return 0;
    var group = (count % 2 === 1) ? GROUP_ODD : GROUP_EVEN;
    var favored = (count % 2 === 1) ? BIG_ODD : BIG_EVEN;
    var s = seedInt(seed);
    if (ballR >= BIG_BALL_R && hash01(s, count, 2) < BIG_BIAS) return favored;
    var k = Math.floor(hash01(s, count, 1) * group.length);

  // Pulse envelope of one hit, 0..1 (0 before the hit).
  function pulseEnv(age) {
    if (age < 0 || age >= PULSE_LEN) return 0;
    if (age < PULSE_ATTACK) return age / PULSE_ATTACK;
    return Math.exp(-(age - PULSE_ATTACK) * PULSE_DECAY);
  }

  // Cubic ease-out: fastest at the hit, speed falls to 0 at FLOW_TIME.
  function flowEase(age) {
    if (!(age > 0)) return 0;
    if (age >= FLOW_TIME) return 1;
    var u = 1 - age / FLOW_TIME;
    return 1 - u * u * u;
  }

  // Head line phase offset from the last two hits (cycles, 0..1).
  // Each hit adds FLOW_CYCLES whole cycles, so finished hits leave no trace
  // and only the flow still in progress shows. The last two hits are summed,
  // so a new hit during a flow keeps the line where it is (no jump) and the
  // two flows add up. Never-hit characters (hit times far in the past) are
  // still at phase0.
  function flowPhase(t, lastHit, prevHit) {
    var a = lastHit === undefined ? 1 : flowEase(t - lastHit);
    var b = prevHit === undefined ? 1 : flowEase(t - prevHit);
    return frac(FLOW_CYCLES * (a + b));
  }

  // ---------- waveforms (phase 0..1 -> -1..1, positive = up) ----------
  function waveValue(wave, ph) {
    ph = frac(ph);
    if (wave === 'sine') return Math.sin(ph * TAU);
    if (wave === 'triangle') return ph < 0.25 ? ph * 4 : (ph < 0.75 ? 2 - ph * 4 : ph * 4 - 4);
    if (wave === 'sawtooth') return 2 * ph - 1;

  var BREAKS = {
    triangle: [[0.25, 1, 1], [0.75, -1, -1]],
    sawtooth: [[0, 1, -1]],

  // with u 0..1 across the width. Corners and vertical jumps are exact.
  function headLine(wave, p0, cycles) {

    var p1 = p0 + cycles;
    if (wave === 'sine') {
      var n = Math.max(24, Math.ceil(cycles * 28));
      for (i = 0; i <= n; i++) {
        var p = p0 + cycles * i / n;
        pts.push([i / n, waveValue(wave, p)]);

    var br = BREAKS[wave];
    for (var k = Math.floor(p0) - 1; k <= Math.ceil(p1) + 1; k++) {
      for (i = 0; i < br.length; i++) {
        var bp = k + br[i][0];
        if (bp > p0 + 1e-9 && bp < p1 - 1e-9) marks.push({ p: bp, before: br[i][1], after: br[i][2] });
      }

    marks.sort(function (a, b) { return a.p - b.p; });
    pts.push([0, waveValue(wave, p0)]);
    for (i = 0; i < marks.length; i++) {
      var u = (marks[i].p - p0) / cycles;
      pts.push([u, marks[i].before]);
      if (marks[i].after !== marks[i].before) pts.push([u, marks[i].after]);
    }
    pts.push([1, waveValue(wave, p1 - 1e-9)]);

  }

  // ---------- features, drawn in face units (origin = feature center, 1 = radius) ----------
  // lw: line width in face units; ey, my: eye and mouth rows relative to the center;
  // lid: 0 open .. 1 closed; t: time (for the dizzy spin).
  function eyeDot(g, ex, ey, er, lid, lw) {
    g.beginPath();
    if (lid > 0.75) {
      g.moveTo(ex - er, ey);
      g.lineTo(ex + er, ey);

    g.beginPath();
    g.arc(ex, ey + 0.045, 0.085, Math.PI * 1.12, Math.PI * 1.88);

  function eyeSpiral(g, ex, ey, lw, rot) {
    g.beginPath();
    var turns = 1.75, n = 28;
    for (var i = 0; i <= n; i++) {

      var rr = 0.105 * i / n;

  function drawFeatures(g, def, ex, lw, lid, breathe, t, glanceX) {

      g.arc(rx, ey - 0.03, 0.085, Math.PI * 0.12, Math.PI * 0.88);

    } else if (e.eyes === 'wink') {

      eyeArc(g, rx, ey, lw);
    } else if (e.eyes === 'spiral') {

      eyeSpiral(g, rx, ey, lw, -t * SPIN + 1.3);

    // cheeks
    if (e.blush) {
      g.beginPath();
      for (var side = -1; side <= 1; side += 2) {
        var cx = side * 0.4 + glanceX * 0.5, cy = ey + 0.17;
        for (var j = -1; j <= 1; j += 2) {

      g.quadraticCurveTo(0, my + md * 2, mw, my);
      g.stroke();
    } else if (e.mouth === 'small') {
      mw = 0.13 * breathe; md = 0.075 * breathe;
      g.moveTo(-mw, my + 0.02);
      g.quadraticCurveTo(0, my + 0.02 + md * 2, mw, my + 0.02);
      g.stroke();
    } else if (e.mouth === 'open') {
      mw = 0.2 * breathe; md = 0.17 * breathe;
      g.moveTo(-mw, my - 0.01);
      g.quadraticCurveTo(0, my - 0.01 + md * 2, mw, my - 0.01);
      g.closePath();
      g.fill();
      g.stroke();
    } else if (e.mouth === 'o') {
      g.arc(0, my + 0.07, 0.085 * breathe, 0, TAU);
      g.stroke();
    } else if (e.mouth === 'flat') {
      g.moveTo(-0.1, my + 0.06);
      g.lineTo(0.1, my + 0.06);
      g.stroke();
    } else if (e.mouth === 'slant') {
      g.moveTo(-0.13, my + 0.1);
      g.lineTo(0.12, my + 0.03);
      g.stroke();
    } else if (e.mouth === 'tongue') {
      mw = 0.2 * breathe; md = 0.07 * breathe;
      g.moveTo(-mw, my);
      g.quadraticCurveTo(0, my + md * 2, mw, my);
      g.stroke();

      g.beginPath();
      g.arc(0.06, my + md - 0.01, 0.095, 0, Math.PI);

      var n = 14;
      for (var i = 0; i <= n; i++) {

        var px = -0.17 + 0.34 * u, py = my + 0.06 + 0.04 * Math.sin(u * Math.PI * 3);

  }

  /*
   * draw(g, def, x, y, r, anim)
   *   g     2D context
   *   def   entry of CHARACTERS
   *   x, y  center, r radius (bounce radius)
   *   anim  { t: seconds, lastHit, prevHit: seconds on the same clock as t,
   *           hitCount: hits so far, hitR / prevHitR: ball radius of the
   *           last / previous hit,
   *           seed: 0..1 per instance }

   * Official image when loaded (def._imgs[i], set by ui.js; null until loaded),
   * otherwise the program-drawn fallback face.
   */
  function draw(g, def, x, y, r, anim) {
    var imgs = def._imgs;
    if (imgs) {
      var img = imgs[imageIndexFor(anim)] || imgs[IMG_REST];
      if (img) {
        // the official art has its own outline: no disc, no clip, no program face
        var side = IMG_SIDE * r;
        var bobY = anim ? BOB_AMP * r * Math.sin(TAU * (anim.t / BOB_PERIOD + (anim.seed || 0))) : 0;
        g.save();
        g.imageSmoothingEnabled = true;
        g.imageSmoothingQuality = 'high';
        g.drawImage(img, x - side / 2, y + bobY - side / 2, side, side);
        g.restore();

      }
    }

    var t = anim ? anim.t : 0;
    var seed = anim ? anim.seed : 0;
    var count = anim && anim.hitCount ? anim.hitCount : 0;
    var hitR = anim && anim.hitR ? anim.hitR : 0;
    var prevHitR = anim && anim.prevHitR ? anim.prevHitR : 0;
    var age = anim ? t - anim.lastHit : -1;
    var agePrev = anim && anim.prevHit !== undefined ? t - anim.prevHit : -1;
    // max of the last two pulses: continuous even when hits come 0.1 s apart
    var pulse = Math.max(pulseEnv(age), pulseEnv(agePrev));

    // expression and the short swap transition at the hit
    var exprIndex = expressionFor(seed, count, hitR);
    var swap = 1;
    if (count > 0 && age >= 0 && age < 2 * SWAP_HALF) {
      if (age < SWAP_HALF) {
        // previous face shrinking
        exprIndex = expressionFor(seed, count - 1, prevHitR);
        swap = 1 - (1 - SWAP_MIN) * (age / SWAP_HALF);
      } else {
        swap = SWAP_MIN + (1 - SWAP_MIN) * ((age - SWAP_HALF) / SWAP_HALF);
      }

    var expr = EXPRESSIONS[exprIndex];

    // faint body disc (the area the ball bounces off)
    g.beginPath();
    g.arc(x, y, r, 0, TAU);
    g.fillStyle = rgbStr(def.rgb, BODY_ALPHA);
    g.fill();

    var lwPx = Math.max(1.6, r * LINE_W);
    g.save();
    g.strokeStyle = def.color;
    g.fillStyle = def.color;
    g.lineWidth = lwPx;
    g.lineCap = 'round';
    g.lineJoin = 'round';

    // head line: the character's own waveform, still at rest (original art),
    // flowing only after a hit (see flowPhase); taller on a hit,
    // with the bottom edge fixed so the line never reaches the eyes
    var phase = def.phase0 + (anim ? flowPhase(t, anim.lastHit, anim.prevHit) : 0);
    var amp = def.amp * r * (1 + HIT_AMP * pulse);
    var pts = headLine(def.wave, phase, def.cycles);
    var x0 = x - WAVE_HALF_W * r, ww = 2 * WAVE_HALF_W * r;
    var wy = y + WAVE_BOTTOM * r - amp;
    g.beginPath();
    for (var i = 0; i < pts.length; i++) {
      var px = x0 + pts[i][0] * ww, py = wy - pts[i][1] * amp;
      if (i === 0) g.moveTo(px, py); else g.lineTo(px, py);
    }
    var edgePx = def.edgeColor ? Math.max(EDGE_MIN, lwPx * EDGE_W) : 0;
    if (edgePx > 0) {
      g.strokeStyle = def.edgeColor;
      g.lineWidth = lwPx + 2 * edgePx;
      g.stroke();
      g.strokeStyle = def.color;
      g.lineWidth = lwPx;
    }
    g.stroke();

    // face features in face units, scaled by the hit pulse and the swap transition
    var bob = BOB_AMP * Math.sin(TAU * (t / BOB_PERIOD + seed)) - HIT_LIFT * pulse;
    var glanceX = GLANCE_AMP * Math.sin(TAU * (t / GLANCE_PERIOD + seed * 1.37));
    var period = BLINK_MIN + seed * BLINK_SPREAD;
    var bph = ((t + seed * 7.3) % period + period) % period;
    var lid = bph < BLINK_LEN ? Math.sin(Math.PI * bph / BLINK_LEN) : 0;   // 0 open .. 1 closed
    if (pulse > 0) lid = 0;
    var breathe = 1 + SMILE_AMP * Math.sin(TAU * (t / SMILE_PERIOD + seed * 2.1));
    var s = swap * (1 + HIT_FEATURE * pulse);

    g.translate(x + def.faceDx * r, y + (FACE_CY + bob) * r);
    g.scale(r * s, r * s);
    if (edgePx > 0) {
      g.strokeStyle = def.edgeColor;
      g.fillStyle = def.edgeColor;
      drawFeatures(edgeCtx(g, edgePx / (r * s)), def, expr, lwPx / (r * s), lid, breathe, t, glanceX);
      g.strokeStyle = def.color;
      g.fillStyle = def.color;
    }
    drawFeatures(g, def, expr, lwPx / (r * s), lid, breathe, t, glanceX);
    g.restore();
  }

  // Per-instance seed from an integer id (golden-ratio spacing, deterministic).
  function seedForId(id) { return frac(id * 0.6180339887498949); }

  global.OSCFace = {
    CHARACTERS: CHARACTERS,
    EXPRESSIONS: EXPRESSIONS,
    draw: draw,
    seedForId: seedForId,
    imageIndexFor: imageIndexFor,
    IMG_HIT_TIME: IMG_HIT_TIME,
    expressionFor: expressionFor,
    headLine: headLine,
    flowPhase: flowPhase
  };
})(typeof window !== 'undefined' ? window : this);

  });
  var STONE_SHAPE = [1.0, 0.86, 0.97, 0.9, 1.05, 0.88, 0.99, 0.84, 0.95];
  var SPONGE_HOLES = [[-0.35, -0.3, 0.13], [0.25, -0.4, 0.1], [0.4, 0.1, 0.14], [-0.1, 0.05, 0.09],
                      [-0.45, 0.3, 0.1], [0.1, 0.45, 0.12], [0.0, -0.05, 0.0]];

  function shade(rgb, f) {
    return rgbStr(rgb.map(function (v) { return clamp(Math.round(v * f), 0, 255); }));
  }

  // GUM: translucent bubble-gum blob. Pure function of sim time and the stick state
  // (anim, optional; menu icons pass nothing and get the resting shape).
  // anim = { t, stuckAt, stick, nx, ny, cx, cy } - see Sim.stickDeform / Sim._beginStick.
  var GUM_EDGE = [214, 62, 138];       // outline, 4.3:1 on white
  var GUM_STRAND_TIME = 0.14;          // s after letting go that the gum string is visible
  function drawGum(g, def, x, y, r, anim) {
    var col = def.color;
    var t = anim ? anim.t : 0;
    var age = anim ? anim.t - anim.stuckAt : -1;
    var k = anim ? window.OSCSim.stickDeform(age, anim.stick) : 0;
    var nx = anim ? anim.nx : 0, ny = anim ? anim.ny : -1;
    var i, a;
    g.save();
    g.lineCap = 'round';
    g.lineJoin = 'round';

    // string of gum back to the surface it just let go of
    if (anim && age >= anim.stick && age < anim.stick + GUM_STRAND_TIME) {
      var u = (age - anim.stick) / GUM_STRAND_TIME;
      var dx = anim.cx - x, dy = anim.cy - y, dl = Math.sqrt(dx * dx + dy * dy);
      if (dl > r * 1.02) {
        // pinched band: wide where it leaves the ball and the surface, thin in the middle
        var ux = dx / dl, uy = dy / dl, px = -uy, py = ux;
        var ex = x + ux * r * 0.8, ey = y + uy * r * 0.8;
        var mx = (ex + anim.cx) / 2, my = (ey + anim.cy) / 2;
        var fade = 1 - u * u;
        var w0 = r * 0.3 * fade, w1 = r * 0.2 * fade, wm = r * 0.035 * fade;
        var co = 2 * wm - (w0 + w1) / 2;
        g.fillStyle = rgbStr(col, 0.8 * fade);
        g.beginPath();
        g.moveTo(ex + px * w0, ey + py * w0);
        g.quadraticCurveTo(mx + px * co, my + py * co, anim.cx + px * w1, anim.cy + py * w1);
        g.lineTo(anim.cx - px * w1, anim.cy - py * w1);
        g.quadraticCurveTo(mx - px * co, my - py * co, ex - px * w0, ey - py * w0);
        g.closePath();
        g.fill();
      }
    }

    // body: squashed along the contact normal, contact side kept on the surface
    g.save();
    g.translate(x - nx * r * k, y - ny * r * k);
    g.rotate(Math.atan2(ny, nx));
    g.scale(1 - k, 1 + 0.6 * k);
    var N = 36;
    g.beginPath();
    for (i = 0; i <= N; i++) {
      a = (i / N) * Math.PI * 2;
      var rr = r * (1 + 0.022 * Math.sin(3 * a + t * 4.2) + 0.012 * Math.sin(5 * a - t * 6.1));
      if (i === 0) g.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
      else g.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
    }
    g.closePath();
    g.restore();
    var grad = g.createRadialGradient(x - r * 0.3, y - r * 0.35, r * 0.1, x, y, r * 1.05);
    grad.addColorStop(0, 'rgba(255,196,224,0.9)');
    grad.addColorStop(0.6, rgbStr(col, 0.82));
    grad.addColorStop(1, 'rgba(236,84,156,0.88)');
    g.fillStyle = grad;
    g.fill();
    g.lineWidth = Math.max(1, r * 0.07);
    g.strokeStyle = rgbStr(GUM_EDGE);
    g.stroke();

    // chewed fold + gloss (follow the squash a little through the center shift)
    var hx = x - nx * r * k, hy = y - ny * r * k;
    g.strokeStyle = 'rgba(214,62,138,0.45)';
    g.lineWidth = Math.max(1, r * 0.07);
    g.beginPath();
    g.moveTo(hx - r * 0.15, hy + r * 0.55);
    g.quadraticCurveTo(hx + r * 0.35, hy + r * 0.45, hx + r * 0.55, hy + r * 0.05);
    g.stroke();
    g.fillStyle = 'rgba(255,255,255,0.85)';
    g.beginPath();
    g.ellipse(hx - r * 0.34, hy - r * 0.36, Math.max(1, r * 0.3), Math.max(0.6, r * 0.15), -0.7, 0, Math.PI * 2);
    g.fill();
    g.beginPath();
    g.arc(hx + r * 0.05, hy - r * 0.6, Math.max(0.6, r * 0.07), 0, Math.PI * 2);
    g.fill();
    g.restore();
  }

  // WATERMELON: striped sphere that rolls with the ball, cracks when it is close to
  // breaking, and bursts into pieces when it breaks (rules: OSCSim, BALLS[].breakHits).
  var MELON = {
    rindLight: [150, 206, 104],
    rind: [96, 172, 64],         // skin (also BALLS[].color)
    rindDark: [70, 140, 50],
    stripe: [28, 92, 40],        // dark green stripes
    edge: [22, 70, 30],          // outline, crack gap
    flesh: [232, 58, 70],        // red flesh
    fleshLight: [250, 120, 120],
    white: [236, 244, 214],      // inner rind
    seed: [26, 26, 26],
    stem: [120, 96, 48]
  };
  var MELON_STRIPES = 10;        // stripes around the stem axis
  var MELON_STRIPE_HALF = Math.PI / MELON_STRIPES * 0.42;   // half width (longitude, rad)
  var MELON_STRIPE_SAMPLES = 18;
  var MELON_CRACK_START = 0.5;   // damage (0..1) where cracks start to show
  var MELON_PIECES = 22;
  var MELON_REST = window.OSCSim.restOrientation();

  // Integer hash -> 0..1 (deterministic, no Math.random).
  function melonHash(a, b) {
    var h = (Math.imul(a | 0, 0x27d4eb2d) ^ Math.imul((b | 0) + 0x165667b1, 0x9e3779b1)) | 0;
    h = Math.imul(h ^ (h >>> 15), 0x85ebca6b);
    h = Math.imul(h ^ (h >>> 13), 0xc2b2ae35);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  }

  // Body point (latitude phi, longitude th; body z = stem) -> screen-space unit
  // vector [x, y, z] (z > 0 faces the viewer).
  function melonPoint(m, phi, th) {
    var cp = Math.cos(phi);
    var px = cp * Math.cos(th), py = cp * Math.sin(th), pz = Math.sin(phi);
    return [m[0] * px + m[1] * py + m[2] * pz,
            m[3] * px + m[4] * py + m[5] * pz,
            m[6] * px + m[7] * py + m[8] * pz];
  }

  // Clip a closed polygon on the sphere to the visible half (z >= 0) and return
  // its 2D outline in radii. Where the polygon leaves and re-enters the visible
  // half, the outline follows the ball's edge along the shorter arc.
  function melonClipVisible(pts) {
    var out = [], n = pts.length, i;
    for (i = 0; i < n; i++) {
      var p = pts[i], q = pts[(i + 1) % n];
      var pin = p[2] >= 0, qin = q[2] >= 0;
      if (pin) out.push([p[0], p[1], false]);
      if (pin !== qin) {
        var t = p[2] / (p[2] - q[2]);
        var ix = p[0] + (q[0] - p[0]) * t, iy = p[1] + (q[1] - p[1]) * t;
        var l = Math.sqrt(ix * ix + iy * iy) || 1;
        out.push([ix / l, iy / l, true, pin]);   // [x, y, on edge, leaving]
      }
    }
    var res = [];
    for (i = 0; i < out.length; i++) {
      var a = out[i];
      res.push(a);
      var b = out[(i + 1) % out.length];
      if (a[2] && a[3] && b[2]) {
        // left the visible half at a, comes back at b: walk along the edge
        var a0 = Math.atan2(a[1], a[0]), a1 = Math.atan2(b[1], b[0]);
        var da = a1 - a0;
        while (da > Math.PI) da -= 2 * Math.PI;
        while (da < -Math.PI) da += 2 * Math.PI;
        var steps = Math.ceil(Math.abs(da) / 0.15);
        for (var k = 1; k < steps; k++) {
          var aa = a0 + da * k / steps;
          res.push([Math.cos(aa), Math.sin(aa), true]);
        }
      }
    }
    return res;
  }

  // anim (optional): { rot: Sim ball orientation, damage: Sim.breakDamage() }
  function drawWatermelon(g, def, x, y, r, anim) {
    var m = anim && anim.rot ? anim.rot : MELON_REST;
    var crack = anim ? clamp((anim.damage - MELON_CRACK_START) / (1 - MELON_CRACK_START), 0, 1) : 0;
    var i, k, p, phi;
    g.save();
    g.beginPath();
    g.arc(x, y, r, 0, Math.PI * 2);
    var grad = g.createRadialGradient(x - r * 0.35, y - r * 0.35, r * 0.1, x, y, r);
    grad.addColorStop(0, rgbStr(MELON.rindLight));
    grad.addColorStop(0.6, rgbStr(MELON.rind));
    grad.addColorStop(1, rgbStr(MELON.rindDark));
    g.fillStyle = grad;
    g.fill();
    g.save();
    g.clip();
    // stripes: jagged bands between two meridians around the stem axis
    g.fillStyle = rgbStr(MELON.stripe);
    var N = MELON_STRIPE_SAMPLES, half = MELON_STRIPE_HALF;
    for (k = 0; k < MELON_STRIPES; k++) {
      var th = k * 2 * Math.PI / MELON_STRIPES;
      var band = [];
      for (i = 0; i <= 2 * N + 1; i++) {
        var j = i <= N ? i : 2 * N + 1 - i;       // up one edge, back down the other
        phi = -Math.PI / 2 + Math.PI * j / N;
        var edge = i <= N ? -half + half * 0.35 * Math.sin(j * 1.9 + k)
                          : half + half * 0.35 * Math.sin(j * 2.3 + k * 2);
        band.push(melonPoint(m, phi, th + edge));
      }
      var vis = melonClipVisible(band);
      if (vis.length < 3) continue;
      g.beginPath();
      for (i = 0; i < vis.length; i++) {
        p = vis[i];
        if (i === 0) g.moveTo(x + p[0] * r, y + p[1] * r); else g.lineTo(x + p[0] * r, y + p[1] * r);
      }
      g.closePath();
      g.fill();
    }
    // stem spot (only on the near side)
    var sz = m[8];
    if (sz > 0.15) {
      g.fillStyle = rgbStr(MELON.stem);
      g.beginPath();
      g.arc(x + m[2] * r, y + m[5] * r, Math.max(1, r * 0.07 * sz), 0, Math.PI * 2);
      g.fill();
    }
    // cracks: appear near the break threshold and grow with damage (fixed on screen)
    if (crack > 0) {
      var nCracks = Math.min(4, 1 + Math.floor(crack * 4));
      var lw = Math.max(1.2, r * 0.07 * (0.6 + crack));
      g.lineCap = 'round';
      g.lineJoin = 'round';
      for (k = 0; k < nCracks; k++) {
        var ang = -0.4 + k * 2.4 + (melonHash(k, 11) - 0.5) * 0.5;   // golden-angle spread
        var len = r * (0.45 + 0.75 * crack) * (0.7 + 0.3 * melonHash(k, 12));
        var c0x = x + Math.cos(ang) * r * 0.08, c0y = y + Math.sin(ang) * r * 0.08;
        g.beginPath();
        g.moveTo(c0x, c0y);
        for (i = 1; i <= 5; i++) {
          var aa = ang + (melonHash(k, 20 + i) - 0.5) * 1.1;
          g.lineTo(c0x + Math.cos(aa) * len * i / 5, c0y + Math.sin(aa) * len * i / 5);
        }
        g.strokeStyle = rgbStr(MELON.edge);     // dark gap
        g.lineWidth = lw * 1.8;
        g.stroke();
        g.strokeStyle = rgbStr(MELON.flesh);    // red flesh showing inside
        g.lineWidth = lw * 0.8;
        g.stroke();
      }
    }
    g.restore();
    g.beginPath();
    g.arc(x, y, r, 0, Math.PI * 2);
    g.lineWidth = Math.max(1, r * 0.06);
    g.strokeStyle = rgbStr(MELON.edge);
    g.stroke();
    g.fillStyle = 'rgba(255,255,255,0.55)';
    g.beginPath();
    g.arc(x - r * 0.38, y - r * 0.4, Math.max(1, r * 0.13), 0, Math.PI * 2);
    g.fill();
    g.restore();
  }

  // Burst of a broken watermelon: pure function of the shatter record
  // s = { t, x, y, r, vx, vy } (OSCSim.shatters) and the sim time. Pieces fly out,
  // slow down, spin and fade; they never collide.
  function drawMelonShatter(g, s, now) {
    var dur = window.OSCSim.MELON_SHATTER_TIME;
    var age = now - s.t;
    if (age < 0 || age > dur) return;
    var u = age / dur;
    var seed = (Math.round(s.x * 8) * 73856093) ^ (Math.round(s.y * 8) * 19349663) ^ Math.round(s.t * 1000);
    var ease = 1 - Math.pow(1 - u, 3);                 // fast out, slows down
    var alpha = u < 0.6 ? 1 : 1 - (u - 0.6) / 0.4;
    var r = s.r, sp = Math.sqrt(s.vx * s.vx + s.vy * s.vy) || 1;
    var mdx = s.vx / sp, mdy = s.vy / sp;
    var n = MELON_PIECES, i;
    g.save();
    g.globalAlpha = alpha;
    g.lineJoin = 'round';
    // splash ring
    g.strokeStyle = rgbStr(MELON.flesh, 0.5 * (1 - u));
    g.lineWidth = Math.max(1, r * 0.08);
    g.beginPath();
    g.arc(s.x, s.y, r * (0.6 + 1.2 * ease), 0, Math.PI * 2);
    g.stroke();
    for (i = 0; i < n; i++) {
      var h1 = melonHash(seed, i * 4), h2 = melonHash(seed, i * 4 + 1);
      var h3 = melonHash(seed, i * 4 + 2), h4 = melonHash(seed, i * 4 + 3);
      var kind = i % 11 < 5 ? 0 : (i % 11 < 8 ? 1 : 2);  // 0 flesh, 1 rind, 2 seed
      var ang = (i / n) * Math.PI * 2 + (h1 - 0.5) * 0.9;
      var dist = r * (0.9 + 1.4 * h2) * (kind === 2 ? 1.25 : 1);
      // pieces also drift a little along the old travel direction
      var px = s.x + Math.cos(ang) * (r * 0.3 + dist * ease) + mdx * r * 0.5 * ease;
      var py = s.y + Math.sin(ang) * (r * 0.3 + dist * ease) + mdy * r * 0.5 * ease;
      var size = r * (kind === 2 ? 0.09 : (0.26 + 0.2 * h3)) * (1 - 0.35 * u);
      g.save();
      g.translate(px, py);
      g.rotate(ang + (h4 - 0.5) * 6 * ease);
      if (kind === 0) {
        // red flesh chunk
        g.fillStyle = rgbStr(h3 > 0.5 ? MELON.flesh : MELON.fleshLight);
        g.beginPath();
        g.moveTo(size, 0);
        g.lineTo(-size * 0.6, size * (0.7 + 0.3 * h2));
        g.lineTo(-size * (0.7 + 0.3 * h1), -size * 0.6);
        g.closePath();
        g.fill();
      } else if (kind === 1) {
        // rind shard: curved strip, red / pale / green from inside out
        var rs = size * 1.4;
        g.lineCap = 'round';
        g.strokeStyle = rgbStr(MELON.flesh);
        g.lineWidth = rs * 0.5;
        g.beginPath(); g.arc(0, rs * 0.9, rs * 1.05, -Math.PI / 2 - 0.55, -Math.PI / 2 + 0.55); g.stroke();
        g.strokeStyle = rgbStr(MELON.white);
        g.lineWidth = rs * 0.35;
        g.beginPath(); g.arc(0, rs * 0.9, rs * 1.25, -Math.PI / 2 - 0.55, -Math.PI / 2 + 0.55); g.stroke();
        g.strokeStyle = rgbStr(MELON.stripe);
        g.lineWidth = rs * 0.3;
        g.beginPath(); g.arc(0, rs * 0.9, rs * 1.45, -Math.PI / 2 - 0.55, -Math.PI / 2 + 0.55); g.stroke();
      } else {
        // black seed
        var ss = Math.max(1.5, size);
        g.fillStyle = rgbStr(MELON.seed);
        g.beginPath();
        g.ellipse(0, 0, ss * 1.3, ss * 0.75, 0, 0, Math.PI * 2);
        g.fill();
      }
      g.restore();
    }
    g.restore();
  }

  function drawBall(g, def, x, y, r, anim) {
    var col = def.color;
    if (def.id === 'gum' && !(def._img && !def._imgFailed)) { drawGum(g, def, x, y, r, anim); return; }
    if (def.id === 'watermelon' && !(def._img && !def._imgFailed)) { drawWatermelon(g, def, x, y, r, anim); return; }
    if (def._img && !def._imgFailed) {
      g.save();
      g.beginPath();
      g.arc(x, y, r, 0, Math.PI * 2);
      g.clip();
      var iw = def._img.naturalWidth, ih = def._img.naturalHeight;
      var sc = (2 * r) / Math.min(iw, ih);
      g.drawImage(def._img, x - iw * sc / 2, y - ih * sc / 2, iw * sc, ih * sc);
      g.restore();
      return;
    }
    var i, a, grad;
    g.save();
    g.lineCap = 'round';
    g.lineJoin = 'round';

    if (def.id === 'stone') {
      // irregular outline (collision is still a circle)
      g.beginPath();
      for (i = 0; i < STONE_SHAPE.length; i++) {
        a = (i / STONE_SHAPE.length) * Math.PI * 2 + 0.3;
        var rr = r * STONE_SHAPE[i];
        if (i === 0) g.moveTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
        else g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
      }
      g.closePath();
      g.fillStyle = rgbStr(col);
      g.fill();
      g.lineWidth = Math.max(1, r * 0.08);
      g.strokeStyle = shade(col, 0.6);
      g.stroke();
      g.fillStyle = shade(col, 0.72);
      g.beginPath(); g.arc(x - r * 0.3, y - r * 0.2, r * 0.12, 0, Math.PI * 2); g.fill();
      g.beginPath(); g.arc(x + r * 0.28, y + r * 0.25, r * 0.09, 0, Math.PI * 2); g.fill();
      g.beginPath(); g.arc(x + r * 0.1, y - r * 0.4, r * 0.07, 0, Math.PI * 2); g.fill();
      g.restore();
      return;
    }

    if (def.id === 'cotton') {
      // scalloped fluffy outline
      var n = 10, br = r * 0.34, ring = r - br;
      g.fillStyle = rgbStr(col);
      g.strokeStyle = COLOR.cottonEdge;
      g.lineWidth = Math.max(1, r * 0.05);
      for (var pass = 0; pass < 2; pass++) {
        for (i = 0; i < n; i++) {
          a = (i / n) * Math.PI * 2;
          g.beginPath();
          g.arc(x + Math.cos(a) * ring, y + Math.sin(a) * ring, br, 0, Math.PI * 2);
          if (pass === 0) g.stroke(); else g.fill();
        }
      }
      g.beginPath();
      g.arc(x, y, ring, 0, Math.PI * 2);
      g.fill();
      g.restore();
      return;
    }

    // all other balls: circle base
    g.beginPath();
    g.arc(x, y, r, 0, Math.PI * 2);
    if (def.id === 'steel') {
      grad = g.createRadialGradient(x - r * 0.35, y - r * 0.35, r * 0.1, x, y, r);
      grad.addColorStop(0, '#ffffff');
      grad.addColorStop(0.45, rgbStr(col));
      grad.addColorStop(1, shade(col, 0.45));
      g.fillStyle = grad;
    } else if (def.id === 'glass') {
      g.fillStyle = rgbStr(col, 0.3);
    } else {
      g.fillStyle = rgbStr(col);
    }
    g.fill();
    g.save();
    g.clip();
    g.lineWidth = Math.max(1, r * 0.12);

    if (def.id === 'marble') {
      g.strokeStyle = 'rgb(70,120,220)';
      g.beginPath();
      g.moveTo(x - r, y + r * 0.2);
      g.bezierCurveTo(x - r * 0.3, y - r * 0.6, x + r * 0.2, y + r * 0.6, x + r, y - r * 0.2);
      g.stroke();
      g.strokeStyle = 'rgb(235,150,129)';
      g.beginPath();
      g.moveTo(x - r, y - r * 0.4);
      g.bezierCurveTo(x - r * 0.2, y - r * 0.1, x + r * 0.3, y - r * 0.9, x + r, y - r * 0.6);
      g.stroke();
    } else if (def.id === 'wood') {
      g.strokeStyle = shade(col, 0.68);
      g.lineWidth = Math.max(1, r * 0.08);
      for (i = -2; i <= 2; i++) {
        g.beginPath();
        g.moveTo(x - r, y + i * r * 0.36);
        g.quadraticCurveTo(x, y + i * r * 0.36 - r * 0.25, x + r, y + i * r * 0.36 + r * 0.05);
        g.stroke();
      }
    } else if (def.id === 'rubber') {
      g.fillStyle = shade(col, 1.25);
      g.fillRect(x - r, y - r * 0.18, r * 2, r * 0.36);
    } else if (def.id === 'tennis') {
      g.strokeStyle = '#ffffff';
      g.lineWidth = Math.max(1, r * 0.1);
      g.beginPath(); g.arc(x - r * 1.25, y, r * 0.95, -0.9, 0.9); g.stroke();
      g.beginPath(); g.arc(x + r * 1.25, y, r * 0.95, Math.PI - 0.9, Math.PI + 0.9); g.stroke();
    } else if (def.id === 'pingpong') {
      g.strokeStyle = shade(col, 0.75);
      g.lineWidth = Math.max(1, r * 0.08);
      g.beginPath();
      g.moveTo(x - r, y + r * 0.08);
      g.quadraticCurveTo(x, y + r * 0.3, x + r, y + r * 0.08);
      g.stroke();
    } else if (def.id === 'sponge') {
      g.fillStyle = shade(col, 0.7);
      for (i = 0; i < SPONGE_HOLES.length; i++) {
        var hdef = SPONGE_HOLES[i];
        if (hdef[2] <= 0) continue;
        g.beginPath();
        g.arc(x + hdef[0] * r, y + hdef[1] * r, hdef[2] * r, 0, Math.PI * 2);
        g.fill();
      }
    }
    g.restore();

    // outline + highlight
    g.beginPath();
    g.arc(x, y, r, 0, Math.PI * 2);
    g.lineWidth = Math.max(1, r * 0.07);
    g.strokeStyle = def.id === 'glass' ? COLOR.glassEdge : shade(col, 0.6);
    g.stroke();

    }

  var sim = new window.OSCSim();

  // ---------- ball button + ball picker ----------
  var ballBtn = document.createElement('button');

  ballBtn.className = 'pick ballbtn';
  var ballBtnIcon = document.createElement('canvas');
  var ballBtnLabel = document.createElement('span');
  ballBtnLabel.textContent = 'BALL';
  ballBtn.appendChild(ballBtnIcon);
  ballBtn.appendChild(ballBtnLabel);
  picks.appendChild(ballBtn);

  var ballPanel = document.getElementById('ballpanel');
  var ballItems = [];
  BALLS.forEach(function (def, index) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'ballitem';
    var icon = document.createElement('canvas');
    var label = document.createElement('span');
    label.textContent = ballName(def);
    b.appendChild(icon);
    b.appendChild(label);
    b.addEventListener('click', function () {

  // Ball label in the current language: BALLS[].names[lang] when the ball has
  // per-language names (GUM), otherwise the English label.
  function ballName(def) {
    return (def.names && def.names[lang]) || def.label;
  }

  // Icon radius keeps the size order of the balls and always fits the cell.
  // Square-root scale, so the smallest ball stays visible next to the largest.
  function iconBallRadius(def, size) {
    var maxR = size / 2 - 2;
    return Math.max(3, maxR * Math.sqrt(def.radius / window.OSCSim.BALL_R_MAX));
  }

  function paintIcon(canvasEl, fallbackSize, paint) {
    var size = canvasEl.clientWidth || fallbackSize;
    canvasEl.width = Math.round(size * dpr);
    canvasEl.height = Math.round(size * dpr);
    var g = canvasEl.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, size, size);
    paint(g, size);
  }

  function drawBallIcons() {
    var cur = sim.ballDef();
    paintIcon(ballBtnIcon, 40, function (g, size) {
      drawBall(g, cur, size / 2, size / 2, iconBallRadius(cur, size));
    });
    ballItems.forEach(function (it, i) {
      it.btn.classList.toggle('selected', i === sim.ballType);
      if (ballPanel.hidden) return;
      paintIcon(it.icon, 36, function (g, size) {
        drawBall(g, BALLS[i], size / 2, size / 2, iconBallRadius(BALLS[i], size));
      });
    });
  }

  function openBallPanel() {
    closePanel();
    ballPanel.hidden = false;
    drawBallIcons();

    var pw = ballPanel.offsetWidth, ph = ballPanel.offsetHeight;
    var tcs = getComputedStyle(topbar);
    var minY = (parseFloat(tcs.paddingTop) || 0) + 8;
    var pb = palette.getBoundingClientRect();
    var top = Math.max(minY, pb.top - ph - 8);
    var left = clamp((vw - pw) / 2, 8, Math.max(8, vw - pw - 8));

    ballPanel.style.top = Math.round(top) + 'px';

  function selectType(index) {

  }

  // Palette icons are animated (same drawing as the field, never hit).
  // Size is set here (on layout); paintPaletteIcons runs every frame.
  function drawPaletteIcons() {
    pickButtons.forEach(function (p) {
      var size = p.icon.clientWidth || 40;
      p.size = size;
      p.icon.width = Math.round(size * dpr);
      p.icon.height = Math.round(size * dpr);
      p.g = p.icon.getContext('2d');
    });
    paintPaletteIcons();
  }

  function paintPaletteIcons() {
    var t = sim.time;
    pickButtons.forEach(function (p, i) {
      if (!p.g) return;
      var size = p.size;
      p.g.setTransform(dpr, 0, 0, dpr, 0, 0);
      p.g.clearRect(0, 0, size, size);
      drawCharacter(p.g, CHARACTERS[i], size / 2, size / 2, size / 2 - 2,
                    { t: t, lastHit: -1000, seed: Face.seedForId(i + 101) });
    });
  }

  // ---------- layout ----------
  function layout() {
    dpr = window.devicePixelRatio || 1;
    var vw = window.innerWidth, vh = window.innerHeight;
    canvas.width = Math.round(vw * dpr);
    canvas.height = Math.round(vh * dpr);

    reserveHelpHeight();
    var tb = topbar.getBoundingClientRect();
    var pb = palette.getBoundingClientRect();
    var tcs = getComputedStyle(topbar);
    var padL = parseFloat(tcs.paddingLeft) || 8;
    var padR = parseFloat(tcs.paddingRight) || 8;

    area.x = padL;
    area.y = tb.bottom;
    area.w = Math.max(1, vw - padL - padR);
    area.h = Math.max(1, pb.top - tb.bottom);
    sim.setBounds(area.w, area.h);

    closePanel();
    closeBallPanel();
    drawPaletteIcons();
    drawBallIcons();
  }

  function toArea(e) {
    return { x: e.clientX - area.x, y: e.clientY - area.y };
  }
  function inArea(p) {
    return p.x >= 0 && p.y >= 0 && p.x <= area.w && p.y <= area.h;
  }

  // ---------- panel ----------
  function paramValue(c, name) {
    if (name === 'decay') return c.decayNorm;
    if (name === 'reverb') return c.reverb;
    return c.delay;
  }
  function setParam(c, name, v) {
    v = clamp(v, 0, 1);
    if (name === 'decay') c.decayNorm = v;
    else if (name === 'reverb') c.reverb = v;
    else c.delay = v;
  }
  function refreshFaders() {
    var c = sim.getCharacter(panelCharId);
    if (!c) return;
    faders.forEach(function (f) {
      f.querySelector('.fill').style.width = (paramValue(c, f.dataset.param) * 100) + '%';
    });
  }

  function openPanel(c) {
    panelCharId = c.id;
    var def = CHARACTERS[c.type];
    panel.style.setProperty('--fader-color', def.color);
    refreshFaders();
    panel.hidden = false;

    var pw = panel.offsetWidth, ph = panel.offsetHeight;
    var vw = window.innerWidth, vh = window.innerHeight;
    var tcs = getComputedStyle(topbar), pcs = getComputedStyle(palette);
    var margin = 8;
    var minX = (parseFloat(tcs.paddingLeft) || 0) + margin - 8;
    var maxX = vw - (parseFloat(tcs.paddingRight) || 0) + 8 - margin - pw;
    var minY = (parseFloat(tcs.paddingTop) || 0) + margin;
    var maxY = vh - (parseFloat(pcs.paddingBottom) || 0) - margin - ph;

    maxX = Math.max(minX, maxX);
    maxY = Math.max(minY, maxY);

    // Candidate sides in order: right, left, below, above.
    // The first one that fits entirely on screen wins. If none fits, the clamped
    // candidate that overlaps the character the least is used, so the panel
    // never needlessly covers the character it edits.
    var sx = area.x + c.x, sy = area.y + c.y;
    var R = sim.charRadius;
    var gap = R + 12;
    var candidates = [
      { left: sx + gap, top: sy - ph / 2 },
      { left: sx - gap - pw, top: sy - ph / 2 },
      { left: sx - pw / 2, top: sy + gap },
      { left: sx - pw / 2, top: sy - gap - ph }
    ];
    var best = null, bestOverlap = Infinity;
    for (var i = 0; i < candidates.length; i++) {
      var cand = candidates[i];
      // side placements (right/left) may slide vertically without covering the
      // character, so only their horizontal fit matters; above/below may slide
      // horizontally, so only their vertical fit matters.
      var fitsX = cand.left >= minX && cand.left <= maxX;
      var fitsY = cand.top >= minY && cand.top <= maxY;
      var fits = i < 2 ? fitsX : fitsY;
      var l = clamp(cand.left, minX, maxX);
      var t = clamp(cand.top, minY, maxY);
      if (fits) { best = { left: l, top: t }; break; }
      var ox = Math.max(0, Math.min(l + pw, sx + R) - Math.max(l, sx - R));
      var oy = Math.max(0, Math.min(t + ph, sy + R) - Math.max(t, sy - R));
      var overlap = ox * oy;
      if (overlap < bestOverlap) { bestOverlap = overlap; best = { left: l, top: t }; }
    }
    if (!best) best = { left: minX, top: minY };
    panel.style.left = Math.round(best.left) + 'px';
    panel.style.top = Math.round(best.top) + 'px';
  }

  function closePanel() {
    panelCharId = null;
    panel.hidden = true;
  }

  faders.forEach(function (f) {
    var name = f.dataset.param;
    function apply(e) {
      var c = sim.getCharacter(panelCharId);
      if (!c) return;
      var rect = f.getBoundingClientRect();
      setParam(c, name, (e.clientX - rect.left) / rect.width);
      refreshFaders();

    f.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      f.setPointerCapture(e.pointerId);
      apply(e);
    });
    f.addEventListener('pointermove', function (e) {
      if (f.hasPointerCapture && f.hasPointerCapture(e.pointerId)) apply(e);
    });
  });

  removeBtn.addEventListener('click', function () {

    closePanel();
  });

  closeBtn.addEventListener('click', function () {
    closePanel();
  });

  clearBtn.addEventListener('click', function () {
    sim.clear();
    closePanel();
  });

  langBtn.addEventListener('click', function () {
    lang = LANGS[(LANGS.indexOf(lang) + 1) % LANGS.length];
    saveLang(lang);
    applyLang();
    layout();   // help blocks keep their reserved height; this only re-lays the bar
  });

  // ---------- audio unlock + outside-click close ----------
  function unlockAudio() { audio.ensure(); }

  // Pressing anywhere outside the panel closes it. Presses on the stage canvas are
  // handled by the canvas handler instead (it closes the panel itself and decides
  // whether to place, switch, or just close).
  // The ball picker closes on any press outside it (except the BALL button, which
  // toggles it); a press on the stage that closes the picker does nothing else.
  var swallowPointerId = null;
  document.addEventListener('pointerdown', function (e) {
    unlockAudio();
    if (!panel.hidden && !panel.contains(e.target) && e.target !== canvas) {
      closePanel();
    }
    if (!ballPanel.hidden && !ballPanel.contains(e.target) && !ballBtn.contains(e.target)) {
      closeBallPanel();
      if (e.target === canvas) swallowPointerId = e.pointerId;
    }
  }, true);
  document.addEventListener('pointerup', unlockAudio, true);
  document.addEventListener('touchend', unlockAudio, { capture: true, passive: true });
  document.addEventListener('click', unlockAudio, true);

  // block zoom / context menus
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  document.addEventListener('dblclick', function (e) { e.preventDefault(); });
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  // ---------- stage pointer handling ----------
  function reject(p) {
    rejects.push({ x: p.x, y: p.y, t: performance.now() / 1000 });
    countEl.classList.add('reject');
    if (rejectTimer) clearTimeout(rejectTimer);
    rejectTimer = setTimeout(function () { countEl.classList.remove('reject'); }, 420);
  }

  // ---------- bounds handles ----------
  var HANDLE_LEN = 44;        // drawn bar length
  var HANDLE_THICK = 6;       // drawn bar thickness
  var HANDLE_HIT_LEN = 72;    // touch zone along the edge
  var HANDLE_HIT_THICK = 44;  // touch zone across the edge
  var DOUBLE_TAP = 0.35;      // seconds
  var lastHandleTap = -10;

  // Touch zones in play-area coordinates, shifted inward so the full 44 px is
  // inside the play area even when the bounds sit on the outer edge.
  function handleZones() {
    var bd = sim.bounds;
    var cx = (bd.left + bd.right) / 2, cy = (bd.top + bd.bottom) / 2;
    var t = HANDLE_HIT_THICK, L = HANDLE_HIT_LEN;
    function fit(x, y, w, h) {
      return { x: clamp(x, 0, area.w - w), y: clamp(y, 0, area.h - h), w: w, h: h };
    }
    return [
      { side: 'top',    r: fit(cx - L / 2, bd.top - t / 2, L, t) },
      { side: 'bottom', r: fit(cx - L / 2, bd.bottom - t / 2, L, t) },
      { side: 'left',   r: fit(bd.left - t / 2, cy - L / 2, t, L) },
      { side: 'right',  r: fit(bd.right - t / 2, cy - L / 2, t, L) }
    ];
  }

  function handleAt(p) {
    var zones = handleZones();
    for (var i = 0; i < zones.length; i++) {
      var r = zones[i].r;
      if (p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h) return zones[i].side;
    }
    return null;
  }

  function edgeValue(side) {
    var bd = sim.bounds;
    return side === 'top' ? bd.top : side === 'bottom' ? bd.bottom : side === 'left' ? bd.left : bd.right;
  }

  canvas.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    if (swallowPointerId === e.pointerId) { swallowPointerId = null; return; }
    var openId = panelCharId;   // panel that was open before this press
    closePanel();
    var p = toArea(e);
    if (!inArea(p)) return;

    // bounds handles take priority over characters and placement
    var side = handleAt(p);
    if (side) {
      var vertical = side === 'top' || side === 'bottom';
      pointers[e.pointerId] = {
        handle: side,
        grab: edgeValue(side) - (vertical ? p.y : p.x),
        startX: e.clientX,
        startY: e.clientY,
        moved: false
      };
      try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
      return;
    }

    var c = sim.hitTest(p.x, p.y, 4);
    var isNew = false;
    if (!c) {
      // empty spot: place a new character (its panel opens on release)
      if (!sim.canAdd()) { reject(p); return; }
      c = sim.addCharacter(selectedType, p.x, p.y);
      if (!c) { reject(p); return; }
      isNew = true;
    }
    pointers[e.pointerId] = {
      charId: c.id,
      startX: e.clientX,
      startY: e.clientY,
      offX: c.x - p.x,
      offY: c.y - p.y,
      moved: false,
      isNew: isNew,
      wasOpen: c.id === openId  // pressing the character whose panel was open
    };
    try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  });

  canvas.addEventListener('pointermove', function (e) {
    var st = pointers[e.pointerId];
    if (!st) return;
    if (!st.moved) {
      var dx = e.clientX - st.startX, dy = e.clientY - st.startY;
      if (dx * dx + dy * dy < TAP_SLOP * TAP_SLOP) return;
      st.moved = true;
    }
    var p = toArea(e);
    if (st.handle) {
      var vertical = st.handle === 'top' || st.handle === 'bottom';
      sim.setEdge(st.handle, (vertical ? p.y : p.x) + st.grab);
      return;
    }
    sim.moveCharacter(st.charId, p.x + st.offX, p.y + st.offY);
  });

  function endPointer(e, cancelled) {
    var st = pointers[e.pointerId];
    if (!st) return;
    delete pointers[e.pointerId];
    if (cancelled) return;
    if (st.handle) {
      // double tap on any handle resets all four edges
      if (!st.moved) {
        var now = performance.now() / 1000;
        if (now - lastHandleTap <= DOUBLE_TAP) {
          sim.resetBounds();
          lastHandleTap = -10;
        } else {
          lastHandleTap = now;
        }
      }
      return;
    }
    var c = sim.getCharacter(st.charId);
    if (!c) return;
    // Rules on release:
    //  new character (tap or drag)         -> open its panel at the final position
    //  tap on the character already open   -> stays closed (tap toggles it off)
    //  tap on another character            -> open that character's panel
    //  drag the character that was open    -> reopen at the final position
    //  drag any other character            -> no panel
    var open;
    if (st.isNew) open = true;
    else if (!st.moved) open = !st.wasOpen;
    else open = st.wasOpen;
    if (open) openPanel(c);
  }
  canvas.addEventListener('pointerup', function (e) { endPointer(e, false); });
  canvas.addEventListener('pointercancel', function (e) { endPointer(e, true); });

  // ---------- sound hookup ----------
  sim.onHit = function (c, hit) {
    var def = CHARACTERS[c.type];
    audio.trigger({
      wave: def.wave,
      freq: sim.noteForY(c.y).freq,
      decay: sim.decaySeconds(c),
      reverb: c.reverb,
      delay: c.delay,
      pan: sim.panForX(c.x),
      cutoff: hit.cutoff,
      attack: hit.attack
    });
  };

  // ---------- rendering ----------
  function roundRectPath(g, x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y);
    g.lineTo(x + w - r, y);
    g.arcTo(x + w, y, x + w, y + r, r);
    g.lineTo(x + w, y + h - r);
    g.arcTo(x + w, y + h, x + w - r, y + h, r);
    g.lineTo(x + r, y + h);
    g.arcTo(x, y + h, x, y + h - r, r);
    g.lineTo(x, y + r);
    g.arcTo(x, y, x + r, y, r);
    g.closePath();
  }

  function draggedNotes() {
    var map = {};
    for (var id in pointers) {
      var st = pointers[id];
      if (!st.moved) continue;
      var c = sim.getCharacter(st.charId);
      if (c) map[c.id] = c;
    }
    return map;
  }

  function render() {
    var vw = canvas.width / dpr, vh = canvas.height / dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = COLOR.bgBase;
    ctx.fillRect(0, 0, vw, vh);

    ctx.save();
    roundRectPath(ctx, area.x, area.y, area.w, area.h, AREA_RADIUS);
    ctx.fillStyle = COLOR.bgArea;
    ctx.fill();
    ctx.lineWidth = 1;
    ctx.strokeStyle = COLOR.stroke;
    ctx.stroke();
    ctx.clip();
    ctx.translate(area.x, area.y);

    var dragged = draggedNotes();
    var highlight = {};
    for (var id in dragged) {
      var dc = dragged[id];
      highlight[sim.noteIndexForY(dc.y)] = CHARACTERS[dc.type];
    }

    // no background pitch grid; only the line of the pitch a dragged character snaps to
    var scale = window.OSCSim.SCALE;
    for (var i = 0; i < scale.length; i++) {
      if (!highlight[i]) continue;
      var gy = Math.round(sim.yForNoteIndex(i)) + 0.5;
      ctx.beginPath();
      ctx.moveTo(0, gy);
      ctx.lineTo(area.w, gy);
      ctx.strokeStyle = rgbStr(highlight[i].lineRgb, 0.6);   // darker variant for light colors
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    // ball bounds: dim the outside, draw the boundary line
    var bd = sim.bounds;
    var full = sim.isFullBounds();
    if (!full) {
      ctx.beginPath();
      ctx.rect(0, 0, area.w, area.h);
      ctx.rect(bd.left, bd.top, bd.right - bd.left, bd.bottom - bd.top);
      ctx.fillStyle = COLOR.outsideDim;
      ctx.fill('evenodd');
    }
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = COLOR.boundsLine;
    ctx.strokeRect(bd.left + 0.75, bd.top + 0.75, bd.right - bd.left - 1.5, bd.bottom - bd.top - 1.5);

    // characters (unreachable ones are drawn translucent)
    var now = sim.time;
    var R = sim.charRadius;
    var chars = sim.characters;
    for (var k = 0; k < chars.length; k++) {
      var c = chars[k];
      var def = CHARACTERS[c.type];
      ctx.globalAlpha = sim.isReachable(c) ? 1 : 0.35;
      var age = now - c.lastHit;
      var s = 1;
      if (age >= 0 && age < 0.35) {
        s = 1 + 0.24 * Math.exp(-age * 14);
        var ringA = (1 - age / 0.35) * COLOR.ringAlpha;
        ctx.beginPath();
        ctx.arc(c.x, c.y, R * (1.05 + age * 1.6), 0, Math.PI * 2);
        ctx.lineWidth = 2;
        // ripple in the line color (darker edge color for light characters, see face.js)
        ctx.strokeStyle = rgbStr(def.lineRgb, ringA);
        ctx.stroke();
      }
      if (c.id === panelCharId) {
        ctx.beginPath();
        ctx.arc(c.x, c.y, R + 6, 0, Math.PI * 2);
        ctx.lineWidth = 2;
        ctx.strokeStyle = COLOR.fgPrimary;
        ctx.stroke();
      }
      drawCharacter(ctx, def, c.x, c.y, R * s, {
        t: now, lastHit: c.lastHit, prevHit: c.prevHit, hitCount: c.hitCount,
        hitR: c.hitR, prevHitR: c.prevHitR, seed: Face.seedForId(c.id)
      });
    }
    ctx.globalAlpha = 1;

    // ball
    var b = sim.ball;
    var bdef = sim.ballDef();
    drawBall(ctx, bdef, b.x, b.y, b.r, {
      t: sim.time, stuckAt: b.stuckAt, stick: bdef.stick || 0,
      nx: b.stuckNx, ny: b.stuckNy, cx: b.stuckCx, cy: b.stuckCy,
      rot: b.rot, damage: sim.breakDamage()
    });
    // pieces of a ball that just broke (WATERMELON), drawn over the new ball
    for (var si = 0; si < sim.shatters.length; si++) drawMelonShatter(ctx, sim.shatters[si], sim.time);

    // bounds handles: bar at the middle of each edge, kept fully visible
    var activeHandles = {};
    for (var pid in pointers) { if (pointers[pid].handle) activeHandles[pointers[pid].handle] = true; }
    var hcx = (bd.left + bd.right) / 2, hcy = (bd.top + bd.bottom) / 2;
    var inset = HANDLE_THICK / 2 + 3;
    var bars = [
      { side: 'top',    x: hcx, y: clamp(bd.top, inset, area.h - inset),    horiz: true },
      { side: 'bottom', x: hcx, y: clamp(bd.bottom, inset, area.h - inset), horiz: true },
      { side: 'left',   x: clamp(bd.left, inset, area.w - inset), y: hcy,  horiz: false },
      { side: 'right',  x: clamp(bd.right, inset, area.w - inset), y: hcy, horiz: false }
    ];
    for (var hb = 0; hb < bars.length; hb++) {
      var bar = bars[hb];
      var bw = bar.horiz ? HANDLE_LEN : HANDLE_THICK;
      var bh = bar.horiz ? HANDLE_THICK : HANDLE_LEN;
      roundRectPath(ctx, bar.x - bw / 2, bar.y - bh / 2, bw, bh, HANDLE_THICK / 2);
      ctx.fillStyle = activeHandles[bar.side] ? COLOR.handleActive : COLOR.handle;
      ctx.fill();
    }

    // rejection feedback (full)
    var tNow = performance.now() / 1000;
    for (var j = rejects.length - 1; j >= 0; j--) {
      var rj = rejects[j];
      var ra = tNow - rj.t;
      if (ra > 0.4) { rejects.splice(j, 1); continue; }
      var a = 1 - ra / 0.4;
      var shake = Math.sin(ra * 60) * 6 * a;
      var rr = R * 0.6;
      ctx.save();
      ctx.translate(rj.x + shake, rj.y);
      ctx.strokeStyle = COLOR.reject + a + ')';
      ctx.lineWidth = 2.5;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(0, 0, rr, 0, Math.PI * 2);
      ctx.moveTo(-rr * 0.707, rr * 0.707);
      ctx.lineTo(rr * 0.707, -rr * 0.707);
      ctx.stroke();
      ctx.restore();
    }

    ctx.restore();

    if (chars.length !== lastCount) {
      lastCount = chars.length;
      countEl.textContent = lastCount + ' / ' + window.OSCSim.MAX_CHARACTERS;
    }
  }

  var lastFrame = null;
  var shownBallType = -1;   // ball type the BALL button / picker currently show
  function frame(ts) {
    if (lastFrame !== null) sim.update((ts - lastFrame) / 1000);
    lastFrame = ts;
    // the sim can change the ball by itself (a WATERMELON breaks into the default ball)
    if (sim.ballType !== shownBallType) { shownBallType = sim.ballType; drawBallIcons(); }
    render();
    paintPaletteIcons();
    requestAnimationFrame(frame);
  }

  // ---------- boot ----------
  selectType(0);
  applyLang();
  layout();
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', function () { setTimeout(layout, 50); });
  // help text height changes once fonts load (the Chinese font loads on first use)
  if (document.fonts) {
    if (document.fonts.ready) document.fonts.ready.then(layout);
    if (document.fonts.addEventListener) {
      document.fonts.addEventListener('loadingdone', function () {
        // only when the bars actually changed height, so open panels stay open
        reserveHelpHeight();
        var tb = topbar.getBoundingClientRect(), pb = palette.getBoundingClientRect();
        if (Math.abs(tb.bottom - area.y) > 0.5 || Math.abs((pb.top - tb.bottom) - area.h) > 0.5) layout();
      });
    }
  }
  requestAnimationFrame(frame);
})();

</script>
</body>
</html>
